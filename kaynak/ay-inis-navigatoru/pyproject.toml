[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-nav"
version = "0.1.0"
description = "Terrain horizons, illumination and Earth visibility for lunar south pole landing regions (NASA Space Apps 2026)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "skyfield>=1.49",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to NASA PGDA"]
