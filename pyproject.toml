[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aynav"
version = "0.1.0"
description = "Ay güney kutbunda arazi ufku, aydınlanma ve Dünya görünürlüğü (Ay İniş Navigatörü)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "rasterio>=1.4",
  "spiceypy>=6.0",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyproj>=3.6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
