    const li = (arr) => '<ul>' + arr.map((s) => `<li>${esc(s)}</li>`).join('') + '</ul>';
    const val = S.index.validation;
    const f1 = (o, k) => Fmt.num(o[k], 1);
    const status = val && val.sun_0m ? t('data.statusVal', { n: val.n, period: val.period,
      sun: f1(val.sun_0m, 'mean_abs'), sunMax: f1(val.sun_0m, 'max_abs'), earth: f1(val.earth_0m, 'mean_abs'), earthMax: f1(val.earth_0m, 'max_abs'),
      sun2: f1(val.sun_2m, 'mean_abs'), earth2: f1(val.earth_2m, 'mean_abs') }) : t('data.status');
    $('dlgBody').innerHTML = `<p class="status">${icon('warn')}<span>${esc(status)}</span></p>
      <h4>${esc(t('data.methodTitle'))}</h4>${li(t('data.method'))}
      <h4>${esc(t('data.candTitle'))}</h4>${li(t('data.cand'))}
      <h4>${esc(t('data.glossTitle'))}</h4>${li(t('data.gloss'))}
      <h4>${esc(t('data.limitsTitle'))}</h4>${li(t('data.limits'))}
      <h4>${esc(t('data.sourcesTitle'))}</h4>${li(t('data.sources'))}
      <h4>${esc(t('data.keysTitle'))}</h4><p>${esc(t('time.keys'))}</p>`;

    $('cmpBody').innerHTML = [['Sun', 'sun', 'compare.rowSun'], ['Earth', 'earth', 'compare.rowEarth'], ['Dark', 'dark', 'compare.rowDark']]
      .map(([k, ic, key]) => `<tr><td>${icon(ic, ic)}${esc(t(key))}</td><td class="flat" id="cmpF${k}"></td><td class="arrow">→</td><td id="cmpT${k}"></td><td class="diff" id="cmpD${k}"></td></tr>`).join('');
  }

  // etiketlere dönem: özet rakamları seçili yılın hesabıdır (brifing 2026–2030, karşılaştırma "ilk N gün")
  function periodTags() { document.querySelectorAll('.fig-per').forEach((el) => setText(el, ' · ' + S.year)); }

  // bölge değişince
  function site() {
    const s = S.site;
    setText($('siteCode'), s.reg.code);
    setText($('siteName'), s.region);
    setText($('siteCoord'), Fmt.latlon(s.lat, s.lon) + ' · ' + Fmt.num(s.ground_height_m, 0) + ' m · ' + (s.legacy ? t('brief.sampleShort') : t('cand.short', { n: s.rank })));
    $('cAddCmp').disabled = !s.landable;
    feedSig = ''; feedIdx = -2;
  }

  function evHTML(e) {
    const day = e.hour >= S.landing ? t('events.day', { n: Math.floor((e.hour - S.landing) / 24) + 1 }) : Fmt.date(e.hour);
    const when = `<span class="when"><b>${esc(day)}</b><small>${esc(Fmt.date(e.hour, many) + ' ' + Fmt.time(e.hour))}</small></span>`;
    let ic, title, sub = '', tag = '';
    const dur = (key) => t(key, { d: Fmt.dur(e.durH) }) + (e.open ? ' · ' + t('events.openEnded') : '');
    if (e.k === 'sun_off') { ic = 'dark'; title = t(S.flat ? 'events.sunOffFlat' : 'events.sunOff'); sub = dur('events.durDark'); if (e.long) tag = `<span class="tag">${esc(t('events.longDark'))}</span>`; }
    else if (e.k === 'sun_on') { ic = 'sun'; title = t('events.sunOn'); sub = dur('events.durLight'); }
    else if (e.k === 'link_off') { ic = 'cut'; title = t('events.linkOff'); sub = dur('events.durNoLink'); }
    else if (e.k === 'link_on') { ic = 'earth'; title = t('events.linkOn'); sub = dur('events.durLink'); }
    else if (e.k === 'landing') { ic = 'next'; title = t('events.landing'); }
    else { ic = 'warn'; title = UP(t('events.dead')); }
    return `<li><button type="button" class="ev${e.long ? ' long' : ''}" data-k="${e.k}" data-h="${e.hour}" title="${esc(t('events.jump'))}">${when}${icon(ic)}<span class="tx">${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}${tag}</span></button></li>`;
  }

  // Kokpitteki bütün özet rakamları tek dönemden gelir: seçili yılın canlı hesabı (S.D.stats).
  // 2026–2030 özetleri yalnız brifing ekranında gösterilir.
  function summaryValues() {
    const st = S.D.stats;
    return { sun: st.sunPct, energy: st.sunEnergyPct, earth: st.earthPct, both: st.bothPct, dark: st.longestDarkH / 24 };
  }
  // düz ufuk ↔ gerçek arazi kartı için: seçili yıl, ikisi de 0° maske
  let cmpKey = '', cmpVal = null;
  function flatVsTerrain() {
    const key = [S.data.id, S.height, S.year].join('|');
    if (key !== cmpKey) {
      const [a, b] = S.D.range;
      cmpVal = { flat: Sim.stats(Sim.buildModel(S.data, true, 0), a, b), terrain: Sim.stats(Sim.buildModel(S.data, false, 0), a, b) };
      cmpKey = key;
    }
    return cmpVal;
  }

  // model yeniden hesaplanınca (bölge, ufuk modeli, maske, batarya, iniş günü)
  function derived(animate) {
    periodTags();
    const D = S.D, m = S.site.m, ms = animate ? 800 : 0;
    $('slCap').value = S.batt.cap; $('slPanel').value = S.batt.panel; $('slLoad').value = S.batt.load; $('slMask').value = S.mask;
    setText($('outCap'), Fmt.num(S.batt.cap, 0) + ' ' + t('unit.kwh'));
    setText($('outPanel'), Fmt.num(S.batt.panel, 1) + ' ' + t('unit.kw'));
    setText($('outLoad'), Fmt.num(S.batt.load, 2) + ' ' + t('unit.kw'));
    setText($('outMask'), Fmt.num(S.mask, 1) + '°');
    $('slUnc').value = Math.round(S.unc * 100);
    setText($('outUnc'), '±' + Fmt.pct(S.unc * 100, 0));

    // özet: seçili yılın canlı hesabı (tek dönem); düz ufuk modunda aynı yıl, düz ufukla
    const v = summaryValues();
    $('pSummary').dataset.flat = String(S.flat);
    setText($('sumTag'), S.year + ' · ' + t(S.flat ? 'summary.flat' : 'summary.terrain'));
    setText($('sumEarthL'), tp('summary.earthMask', { v: Fmt.num(S.mask, 1) }));
    Counter.run($('sumSun'), v.sun, (x) => Fmt.pct(x), ms);
    Counter.run($('sumEarth'), v.earth, (x) => Fmt.pct(x), ms);
    Counter.run($('sumBoth'), v.both, (x) => Fmt.pct(x), ms);
    Counter.run($('sumDark'), v.dark, (x) => withUnit(Fmt.num(x, 1), t('unit.day')), ms);
    setText($('sumEnergy'), t('summary.energy', { v: Fmt.pct(v.energy) }));
    $('heightSel').value = String(S.height);
    setText($('sumHeight'), t(S.index.heights.length > 1 ? 'summary.heightNote' : 'summary.heightFixed', { h: Fmt.num(S.height, 0) }));
    $('yearSel').value = String(S.year);
    setText($('eventsSub'), t('events.sub'));

    // iletişim: aynı yıl, seçili anten maskesiyle
    setText($('cmLiveEarthL'), t('comm.liveEarth', { y: S.year }));
    setText($('cmLiveGapL'), t('comm.liveGap', { y: S.year }));
    Counter.run($('cmLivePct'), D.stats.earthPct, (x) => Fmt.pct(x), animate ? 350 : 0);
    Counter.run($('cmLiveGap'), D.stats.longestGapH / 24, (x) => withUnit(Fmt.num(x, 1), t('unit.day')), animate ? 350 : 0);
    const crit = !S.flat && D.stats.lowMarginPct > 0;
    $('cmCrit').hidden = !crit;
    if (crit) $('cmCrit').innerHTML = icon('warn') + '<span>' + esc(t('comm.crit', { p: Fmt.pctLoc(D.stats.lowMarginPct) })) + '</span>';

    // batarya hükmü
    const b = D.batt, vd = $('pwVerdict');
    if (b.deadHour >= 0) { vd.dataset.s = 'dead'; setText(vd, t('power.verdictDead', { n: Fmt.num((b.deadHour - b.start) / 24, 1) })); }
    else { vd.dataset.s = 'ok'; setText(vd, t('power.verdictAlive', { end: dataEnd() }) + ' ' + t('power.verdictMin', { v: Fmt.num(b.minPct, 0) })); }

    // belirsizlik: tüketim ve panel gücü ±oran oynarsa yılı çıkarma olasılığı
    const rk = $('pwRisk');
    rk.hidden = !S.risk;
    if (S.risk) setText(rk, t('power.risk', { u: Fmt.pct(S.unc * 100, 0), n: Fmt.num(S.risk.n, 0), p: Fmt.pct(S.risk.pct, 0), cap: Fmt.num(S.risk.capQ, 0) }));

    // hızlı cevaplar: bu ayarlarla yılı çıkaran en küçük batarya ve güvenli iniş penceresi
    setText($('ansCapV'), D.minCap == null ? t('ans.capNone') : Fmt.num(D.minCap, 0) + ' ' + t('unit.kwh'));
    const sd = D.scan.safeDay;
    setText($('ansLandV'), sd < 0 ? '—' : sd === 0 ? t('ans.landAll') : t('ans.landFrom', { d: Fmt.date(sd * 24, many) }));
    $('ansCap').title = t('ans.capTitle', { end: dataEnd() });
    $('ansLand').title = t('ans.landTitle', { end: dataEnd() });

    // olay akışı
    const sig = D.feed.map((e) => e.k + e.hour + ':' + (e.durH || 0)).join(',') + S.flat + S.landing;
    if (sig !== feedSig) {
      feedSig = sig; feedIdx = -2;
      $('feed').innerHTML = D.feed.map(evHTML).join('');
      feedBtns = [...$('feed').querySelectorAll('.ev')];
    }

    compare(animate);
    simple();
  }

  function compare(animate) {
    const box = $('compare');
    const show = S.flat && !S.simple;
    const was = !box.hidden;
    box.hidden = !show;
    if (!show) return;
    const { flat: f, terrain: r } = flatVsTerrain();
    setText($('cmpSub'), t('compare.sub', { name: S.site.region, y: S.year }));
    const rows = [
      ['Sun', f.sunPct, r.sunPct, (x) => Fmt.pct(x), t('compare.points')],
      ['Earth', f.earthPct, r.earthPct, (x) => Fmt.pct(x), t('compare.points')],
      ['Dark', f.longestDarkH / 24, r.longestDarkH / 24, (x) => withUnit(Fmt.num(x, 1), t('unit.day')), t('unit.day')],
    ];
    for (const [k, fv, rv, fn, unit] of rows) {
      const fe = $('cmpF' + k);
      if (!was && animate) Counter.set(fe, rv); // gerçek arazi değerinden düz ufuk değerine aksın
      Counter.run(fe, fv, fn, animate ? 1100 : 0);
      $('cmpT' + k).innerHTML = fn(rv);
      const d = rv - fv;
      setText($('cmpD' + k), (d > 0 ? '+' : d < 0 ? '−' : '') + Fmt.num(Math.abs(d), 1) + ' ' + unit);
    }
    const dSun = r.sunPct - f.sunPct;
    setText($('cmpNote'), t(dSun >= 0 ? 'compare.noteMore' : 'compare.noteLess', { v: Fmt.num(Math.abs(dSun), 1) }));
    setText($('cmpNote2'), t('compare.sceneNote'));
  }

  function simple() {
    const box = $('simple');
    box.hidden = !S.simple;
    if (!S.simple) return;
    const v = summaryValues();
    $('simTag').hidden = !S.flat;
    setText($('simTag'), t('simple.flatTag'));
    Counter.run($('simSun'), v.sun, (x) => Fmt.pct0(x), 700);
    Counter.run($('simEarth'), v.earth, (x) => Fmt.pct0(x), 700);
    Counter.run($('simDark'), v.dark, (x) => withUnit(String(Math.round(x)), t('unit.day')), 700);
    setText($('simSentence'), t('simple.sentence', { sun: Fmt.pctLoc(v.sun), earth: Fmt.pctLoc(v.earth), dark: Math.round(v.dark) }));
  }

  const remain = (run, tH) => (run.open ? t('power.untilYearEnd') : Fmt.dur(Math.max(0, run.start + run.len - tH)));
  // Olay akışı 6 saatten kısa durumları birleştirir; Güneş ufku sıyırırken anlık durum (ör. "ışıkta") birleştirilmiş
  // durumla ("karanlık") çelişebilir. O zaman etiket anlık duruma göre yazılır, kalan süre saatlik seriden sayılır.
  function remainNow(run, flags, on, tH) {
    if (run.on === on) return remain(run, tH);
    const i0 = clamp(Math.floor(tH), 0, flags.length - 1);
    for (let i = i0 + 1; i < flags.length; i++) if (!!flags[i] !== on) return Fmt.dur(Math.max(0, i - tH));
    return t('power.untilYearEnd');
  }
  const dataEnd = () => Fmt.date(S.index.hours - 1, true);

  // ---------- büyük geri sayımlar (görev kontrol saati gibi): anlık durumun değişmesine kalan süre ----------
  const nextCache = new Map();
  function nextChange(flags, tH) {
    const i0 = clamp(Math.floor(tH), 0, flags.length - 1), c = nextCache.get(flags);
    if (c && i0 >= c.from && i0 < c.to && !!flags[i0] === c.on) return c.to;
    let i = i0 + 1;
    while (i < flags.length && !!flags[i] === !!flags[i0]) i++;
    let from = i0;
    while (from > 0 && !!flags[from - 1] === !!flags[i0]) from--;
    nextCache.set(flags, { from, to: i, on: !!flags[i0] });
    return i;
  }
  const p2 = (n) => String(n).padStart(2, '0');
  function countText(h) {
    if (h == null) return t('count.never');
    const m = Math.max(0, Math.round(h * 60));
    return m >= 1440 ? t('count.dh', { d: Math.floor(m / 1440), h: p2(Math.floor((m % 1440) / 60)) }) : t('count.hm', { h: Math.floor(m / 60), m: p2(m % 60) });
  }
  function countdowns(D, now, tH) {
    const sunOn = now.sunFrac > 0, link = now.linkUp;
    const iS = nextChange(D.model.sunUp, tH), iE = nextChange(D.model.linkUp, tH);
    setText($('cdSunL'), t(sunOn ? 'count.sunset' : 'count.sunrise'));
    setText($('cdSunV'), countText(iS >= D.model.n ? null : iS - tH));
    setText($('cdEarthL'), t(link ? 'count.earthset' : 'count.earthrise'));
    setText($('cdEarthV'), countText(iE >= D.model.n ? null : iE - tH));
    $('cdSun').dataset.on = String(sunOn); $('cdEarth').dataset.on = String(link);
  }
  const aboveBelow = (v) => t(v >= 0 ? 'geo.above' : 'geo.below', { v: Fmt.num(Math.abs(v), 2) });

  // her karede
  function tick() {
    const D = S.D, now = S.now, tH = S.t, mg0 = now.margin;
    setText($('clockDate'), Fmt.date(tH, true) + ' · ' + Fmt.time(tH) + ' ' + t('top.utc'));
    const cd = $('cDate');
    if (document.activeElement !== cd) { const v = Fmt.toInput(tH); if (cd.value !== v) cd.value = v; }
    setText($('clockDay'), tH >= S.landing
      ? t('top.missionDay', { n: Math.floor((tH - S.landing) / 24) + 1 })
      : t('top.preLanding', { n: Math.ceil((S.landing - tH) / 24) }));

    // güç
    const b = D.batt, pw = $('pPower'), chip = $('pwState');
    const sunRun = Sim.runAt(D.sunRuns, tH), lit = now.sunFrac > 0;
    let state = 'ok';
    if (tH < b.start) {
      state = 'wait';
      setText($('pwBatt'), '—'); setText($('pwKwh'), t('power.startFull'));
      $('pwMeter').firstElementChild.style.width = '0%';
      chip.dataset.s = 'off'; setText(chip, t('power.waiting'));
    } else {
      const i = Math.min(Math.floor(tH), D.model.n - 1), f = tH - i;
      const lvl = lerp(b.level[i], b.level[Math.min(i + 1, D.model.n)], f);
      const dead = b.deadHour >= 0 && tH >= b.deadHour;
      const pct = dead ? 0 : (lvl / S.batt.cap) * 100;
      state = dead ? 'dead' : pct < 20 ? 'low' : 'ok';
      setText($('pwBatt'), Fmt.pct0(pct));
      setText($('pwKwh'), dead ? t('power.deadSince', { date: Fmt.date(b.deadHour, many) }) : Fmt.num(lvl, 1) + ' / ' + Fmt.num(S.batt.cap, 0) + ' ' + t('unit.kwh'));
      $('pwMeter').firstElementChild.style.width = pct.toFixed(1) + '%';
      if (dead) { chip.dataset.s = 'warn'; setText(chip, t('power.dead')); }
      else { chip.dataset.s = lit ? 'ok' : 'off'; setText(chip, t(lit ? 'power.lit' : 'power.dark')); }
    }
    if (pw.dataset.state !== state) pw.dataset.state = state;
    setText($('pwIn'), Fmt.num(S.batt.panel * now.sunFrac, 2) + ' ' + t('unit.kw'));
    setText($('pwDisc'), t('power.sunDisc', { v: Fmt.pct0(now.sunFrac * 100) }));
    // sayısal okuma: ham yükseklik ve azimut + arazi ufkuna göre pay
    setText($('pwGeo'), t('geo.sun', { alt: Fmt.deg(now.sunAlt, 2), az: Fmt.az(now.sunAz), rel: aboveBelow(now.sunMargin), h: t(S.flat ? 'geo.flatH' : 'geo.terrainH') }));
    setText($('cmGeo'), t('geo.earth', { alt: Fmt.deg(now.earthAlt, 2), az: Fmt.az(now.earthAz), rel: aboveBelow(mg0), h: t(S.flat ? 'geo.flatH' : 'geo.terrainH') }));
    setText($('pwCountL'), t(lit ? 'power.toDark' : 'power.toLight'));
    setText($('pwCount'), remainNow(sunRun, D.model.sunUp, lit, tH));

    // iletişim: pay 1°'nin altında sarı, 0'ın altında kırmızı
    const cm = $('pComm'), cchip = $('cmState'), mg = now.margin, linkRun = Sim.runAt(D.linkRuns, tH);
    const cs = now.linkUp ? (mg < 1 ? 'low' : 'ok') : mg > 0 ? 'mask' : 'blocked';
    if (cm.dataset.state !== cs) cm.dataset.state = cs;
    setText($('cmMargin'), Fmt.deg(mg, 2));
    setText($('cmWhy'), tp({ ok: 'comm.stateOk', low: 'comm.stateLow', mask: 'comm.stateMask', blocked: S.flat ? 'comm.stateBelow' : 'comm.stateBlocked' }[cs]));
    cchip.dataset.s = cs === 'ok' ? 'ok' : cs === 'blocked' ? 'warn' : 'caution';
    setText(cchip, t(now.linkUp ? 'comm.linkUp' : 'comm.linkDown'));
    setText($('cmCountL'), t(now.linkUp ? 'comm.toLoss' : 'comm.toLink'));

// ===== globe: açılış ekranı — dönen, sürüklenebilir Ay; güney kutbunda 9 Artemis III bölgesi =====
// Ay kendi ekseninde yavaşça döner (Güneş sabit: dönüş = hızlandırılmış Ay günü, ışık o tarihe göredir).
// Fare kameranın Ay çevresindeki yerini değiştirir (Ay'ın aydınlık evresi de böylece döner).
// Küre dokusu: genel görünüm için three.js örnek dokusu; 80°G'nin güneyi kendi LOLA kabartma haritamız
// (polar_map.png) ve USGS bölge sınırları, aynı stereografik izdüşümle.
// Bir noktaya tıklanınca kamera yavaşça o noktanın ~130 km üstüne iner; ardından kokpitin iniş sekansı sürer.
const Globe = (() => {
  const R_KM = 1737.4, PS_HALF = 304;
  const SYNODIC_D = 29.530588853, NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14); // ışık yönü için yaklaşık evre
  const SUN_LON_W = 90;            // Güneş'in dünya çerçevesindeki boylamı: (1, 0, 0) yönü
  const SPIN_H_PER_S = 12;         // hızlandırılmış zaman: 1 sn = 12 saat → bir Ay günü ≈ 59 sn
  // poz: kamera yönü (az, el) ve merkeze uzaklığı; bakılan nokta (tx, ty, tz)
  const OVERVIEW = { az: 205, el: -46, dist: 4.9, tx: 0, ty: 0, tz: 0, fov: 30 };
  const POLE = { az: 205, el: -80, dist: 1.4, tx: 0, ty: -0.97, tz: 0, fov: 30 };
  const END_ALT = 0.075;           // inişin bittiği yükseklik (R biriminde) ≈ 130 km
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let ok = false, cv, renderer, scene, camera, moon, mat, stars;
  const pose = Object.assign({}, OVERVIEW);
  let lightH = 0, spinK = reduced ? 0 : 1, spinGoal = spinK, paused = false;
  let tween = null, path = null, saved = null, flying = false, hold = false;
  const vel = { az: 0, el: 0 };
  let W = 1, H = 1, shift = 0, shiftGoal = 0, touched = false; // shift: sunumda Ay'ı sağa kaydırır (metne yer açılır)
  const cb = {};
  const _v = new THREE.Vector3(), _w = new THREE.Vector3();

  // ---------- küre ----------
  const VS = `varying vec3 vP;
void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const FS = `precision highp float;
uniform sampler2D uMap, uPolar, uOver, uNorm;
uniform vec3 uSun, uCam;
uniform float uHasMap, uHasPolar, uBump, uOverK, uShine, uCapK, uHasNorm, uNormK;
varying vec3 vP;
const float PI = 3.141592653589793;
const float RK = ${R_KM.toFixed(1)};
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
void main(){
  vec3 n = normalize(vP);
  float lat = asin(clamp(n.y, -1.0, 1.0));
  float lon = atan(n.x, n.z);
  vec2 uv = vec2(0.5 + lon / (2.0 * PI), 0.5 + lat / PI);
  // 180. boylamdaki dikiş: iki uv'nin türevlerinden küçüğünü kullan
  vec2 uvB = vec2(fract(uv.x + 0.5), uv.y);
  vec2 dxA = dFdx(uv), dyA = dFdy(uv), dxB = dFdx(uvB), dyB = dFdy(uvB);
  // genel dokunun kutba yakın satırları gerilmiş (çizgili): 66°G'nin güneyinde yumuşat, kabartmayı söndür
  float polarBlur = smoothstep(-1.15, -1.45, lat);
  float blurK = uHasNorm > 0.5 ? 1.5 : 7.0; // NASA haritası kutba yakın daha temiz: az yumuşatma yeter
  vec2 dx = (abs(dxA.x) <= abs(dxB.x) ? dxA : dxB) * (1.0 + blurK * polarBlur);
  vec2 dy = (abs(dyA.x) <= abs(dyB.x) ? dyA : dyB) * (1.0 + blurK * polarBlur);
  vec3 base = uHasMap > 0.5 ? textureGrad(uMap, uv, dx, dy).rgb : vec3(0.52);
  vec2 du = vec2(1.0 / 1024.0, 0.0), dv = vec2(0.0, 1.0 / 512.0);
  float hE = lum(textureGrad(uMap, uv + du, dx, dy).rgb) - lum(textureGrad(uMap, uv - du, dx, dy).rgb);
  float hN = lum(textureGrad(uMap, uv + dv, dx, dy).rgb) - lum(textureGrad(uMap, uv - dv, dx, dy).rgb);
  // güney kutbu: stereografik izdüşüm (x = r sin λ, y = r cos λ; km), LOLA kabartma haritası ±304 km
  float r = 2.0 * RK * tan((PI * 0.5 + lat) * 0.5);
  vec2 xy = vec2(r * sin(lon), r * cos(lon));
  vec2 puv = clamp(xy / ${(2 * PS_HALF).toFixed(1)} + 0.5, 0.0, 1.0);
  float inCap = 1.0 - step(0.0, lat);
  float edge = max(abs(xy.x), abs(xy.y));
  float w = uHasPolar * inCap * (1.0 - smoothstep(236.0, 300.0, edge));
  float pg = texture(uPolar, puv).r;
  vec3 pcol = vec3(0.10 + 0.86 * pg);
  vec3 alb = mix(base, pcol, w);
  float bump = uBump * (1.0 - w) * uHasMap * (1.0 - polarBlur);
  vec3 east = vec3(cos(lon), 0.0, -sin(lon));
  vec3 north = vec3(-sin(lat) * sin(lon), cos(lat), -sin(lat) * cos(lon));
  vec3 nb = normalize(n - bump * (hE * east + hN * north));
  if (uHasNorm > 0.5) {
    // NASA LOLA yükseklik haritasından üretilmiş kabartma (doğu, kuzey, yukarı)
    vec3 tn = textureGrad(uNorm, uv, dx, dy).rgb * 2.0 - 1.0;
    tn.xy *= uNormK * (1.0 - w);
    nb = normalize(east * tn.x + north * tn.y + n * tn.z);
  }
  // aydınlatma: Lambert + Lommel–Seeliger karışımı (Ay diski kenara doğru kararmaz)
  float g = dot(n, uSun);
  float mu0 = max(dot(nb, uSun), 0.0);
  float mu = max(dot(n, normalize(uCam - vP)), 0.0);
  float ls = 2.0 * mu0 / (mu0 + mu + 1e-3);
  float shade = (0.32 * mu0 + 0.68 * ls) * smoothstep(-0.012, 0.045, g);
  // Kutupta Güneş hep ufukta olduğu için düz bir kürede kutup kapağı karanlık kalır; gerçek arazideki tepeleri
  // ise küre bilmez. Yaklaştıkça kapak harita gibi okunur: LOLA kabartması, Güneş tarafı daha aydınlık.
  float capLight = 0.40 + 0.62 * smoothstep(-0.14, 0.14, g);
  shade = mix(shade, capLight, uCapK * max(w, smoothstep(-1.25, -1.43, lat)));
  vec3 col = alb * (1.18 * shade) + alb * uShine * vec3(0.72, 0.82, 1.0);
  // bölge sınırları ve enlem halkaları (ışıktan bağımsız; ince çizgi, yaklaştıkça belirir)
  vec4 ov = texture(uOver, puv) * inCap * (1.0 - smoothstep(292.0, 304.0, edge));
  col = mix(col, ov.rgb, ov.a * uOverK);
  gl_FragColor = vec4(pow(col, vec3(0.92)), 1.0);
}`;

  // bölge poligonları + 84°/86°/88° G halkaları, kutup haritasıyla aynı izdüşümde (2048² saydam doku)
  function overlayCanvas(index) {
    const N = 2048, c = document.createElement('canvas');
    c.width = c.height = N;
    const g = c.getContext('2d');
    const px = (x) => ((x + PS_HALF) / (2 * PS_HALF)) * N, py = (y) => ((PS_HALF - y) / (2 * PS_HALF)) * N;
    const latR = (lat) => 2 * R_KM * Math.tan(((90 - Math.abs(lat)) / 2) * D2R);
    g.lineWidth = 2; g.strokeStyle = 'rgba(201,210,205,0.35)'; g.setLineDash([10, 12]);
    for (const lat of [84, 86, 88]) { g.beginPath(); g.arc(px(0), py(0), (latR(lat) / (2 * PS_HALF)) * N, 0, Math.PI * 2); g.stroke(); }
    g.setLineDash([]);
    g.beginPath(); g.moveTo(px(-6), py(0)); g.lineTo(px(6), py(0)); g.moveTo(px(0), py(-6)); g.lineTo(px(0), py(6)); g.stroke();
    g.lineWidth = 2.6; g.strokeStyle = 'rgba(238,242,238,0.88)'; g.lineJoin = 'round';
    for (const s of index.sites) {
      const poly = s.reg && s.reg.polygon_ps_km;
      if (!poly) continue;
      g.beginPath();
      poly.forEach(([x, y], i) => (i ? g.lineTo(px(x), py(y)) : g.moveTo(px(x), py(y))));
      g.closePath(); g.stroke();
    }
    return c;
  }

  function makeStars() {
    const n = 2200, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < n; i++) {
      const u = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      pos.set([90 * s * Math.cos(a), 90 * u, 90 * s * Math.sin(a)], i * 3);
      const b = 0.18 + 0.82 * Math.pow(rnd(), 3.2);
      col.set([b * 0.96, b * 0.98, b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, vertexColors: true, depthWrite: false }));
  }

  function init(canvas, index, callbacks) {
    cv = canvas; Object.assign(cb, callbacks || {});
    if (typeof THREE === 'undefined') return false;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
    } catch (e) { console.warn('küre: WebGL yok', e); return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(OVERVIEW.fov, 1, 0.002, 400);

    const blank = new THREE.DataTexture(new Uint8Array([133, 133, 133, 255]), 1, 1); blank.needsUpdate = true;
    const over = new THREE.CanvasTexture(overlayCanvas(index));
    over.anisotropy = 4;
    let polar = blank;
    if (index.map && index.map.image) { polar = new THREE.Texture(index.map.image); polar.needsUpdate = true; polar.anisotropy = 4; }

      vertexShader: VS, fragmentShader: renderer.capabilities.isWebGL2 ? FS : '#define textureGrad(s, u, a, b) texture2D(s, u)\n' + FS,
      uniforms: {
        uMap: { value: blank }, uPolar: { value: polar }, uOver: { value: over },
        uSun: { value: new THREE.Vector3(1, 0, 0) }, uCam: { value: new THREE.Vector3() },
        uNorm: { value: blank }, uHasNorm: { value: 0 }, uNormK: { value: 1.0 },
        uHasMap: { value: 0 }, uHasPolar: { value: polar === blank ? 0 : 1 }, uBump: { value: 0.55 }, uOverK: { value: 0.85 }, uShine: { value: 0.016 }, uCapK: { value: 0 },
      },

    const useMap = (tx) => { tx.anisotropy = 8; tx.wrapS = THREE.RepeatWrapping; mat.uniforms.uMap.value = tx; mat.uniforms.uHasMap.value = 1; };
    const fallback = () => loader.load('vendor/moon_1024.jpg', useMap, undefined, () => console.warn('küre: Ay dokusu yüklenemedi; düz gri kullanılıyor'));
    if (maxTex >= 4096) {
      loader.load('vendor/moon_4k.jpg', useMap, undefined, fallback);
      loader.load('vendor/moon_normal_4k.jpg', (tx) => {
        tx.anisotropy = 8; tx.wrapS = THREE.RepeatWrapping;
        mat.uniforms.uNorm.value = tx; mat.uniforms.uHasNorm.value = 1;
      }, undefined, () => console.warn('küre: kabartma haritası yok (vendor/moon_normal_4k.jpg)'));
    } else fallback();

    scene.add(moon);
    stars = makeStars();
    scene.add(stars);
    bindInput();
    new ResizeObserver(resize).observe(cv);
    resize();
    ok = true;
    return true;
  }

  function resize() {
    if (!renderer) return;
    const r = cv.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    // dikey ekranda (telefon) Ay'ın tamamı sığsın: kamera uzaklaşır
    const a = W / H;
    OVERVIEW.dist = a < 1 ? 1 + (3.9 / Math.max(0.42, a)) * 0.92 : 4.9;
    POLE.dist = a < 1 ? 1 + 0.4 / Math.max(0.42, a) : 1.4;

  }

  // ---------- zaman ve ışık ----------
  const subsolarLon = (ms) => { const f = ((((ms - NEW_MOON_MS) / 86400e3 / SYNODIC_D) % 1) + 1) % 1; return 180 - 360 * f; };
  function applyLight() {
    const ls = subsolarLon(Fmt.hourToDate(lightH).getTime());
    moon.rotation.y = (SUN_LON_W - ls) * D2R; // Güneş dünya çerçevesinde sabit; Ay döner
  }
  function setLightHour(h) { lightH = h; if (ok) applyLight(); }

  // ---------- kamera ----------
  const dirOf = (az, el) => _w.set(Math.cos(el * D2R) * Math.sin(az * D2R), Math.sin(el * D2R), Math.cos(el * D2R) * Math.cos(az * D2R));
  function camOf(p) {
    const pos = dirOf(p.az, p.el).clone().multiplyScalar(p.dist);
    return { pos, target: new THREE.Vector3(p.tx || 0, p.ty, p.tz || 0), up: new THREE.Vector3(0, 1, 0), fov: p.fov };

  function place(c) {
    camera.position.copy(c.pos);
    camera.up.copy(c.up);
    camera.lookAt(c.target);
    if (Math.abs(camera.fov - c.fov) > 1e-3) { camera.fov = c.fov; camera.updateProjectionMatrix(); }
  }
  const wrapAz = (d) => ((d + 540) % 360) - 180;

  function flyTo(to, ms = 1600) {
    if (!ok) return Promise.resolve();
    path = null; touched = true;
    const from = Object.assign({}, pose);
    return new Promise((res) => { tween = { from, to: Object.assign({}, pose, to), t0: performance.now(), ms: reduced ? Math.min(ms, 400) : ms, res }; });
  }
  // bir noktanın üstünden ona bakan poz (sunum için): kamera noktanın biraz ekvator yanında, dist yüksekliğinde
  function poseAbove(site, dist = 1.25, tilt = 6) {
    const P = moon.localToWorld(vecOf(site).clone());
    const el = Math.asin(clamp(P.y, -1, 1)) / D2R, az = Math.atan2(P.x, P.z) / D2R;
    return { az, el: clamp(el + tilt, -86, 86), dist, tx: P.x, ty: P.y, tz: P.z, fov: 30 };
  }

  // ---------- noktalar ----------
  const vecCache = new Map();
  function vecOf(site) {
    if (!vecCache.has(site.id)) {
      const la = site.lat * D2R, lo = site.lon * D2R;
      vecCache.set(site.id, new THREE.Vector3(Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)));
    }
    return vecCache.get(site.id);
  }
  const POLE_V = new THREE.Vector3(0, -1, 0);
  // nesne çerçevesindeki bir yüzey noktasının ekrandaki yeri; front: kameraya bakan yüzde mi
  function project(v) {
    _v.copy(v).multiplyScalar(1.0008);
    moon.localToWorld(_v);
    _w.copy(_v).normalize();
    const facing = _w.dot(_v.clone().sub(camera.position).negate().normalize());
    _v.project(camera);
    return { x: (_v.x * 0.5 + 0.5) * W, y: (-_v.y * 0.5 + 0.5) * H, front: facing > 0.02 && _v.z < 1, facing };
  }
  const projectSite = (site) => project(vecOf(site));
  const projectPole = () => project(POLE_V);
  // dünya çerçevesindeki bir yönün ekrandaki yeri (Güneş ve Dünya yön işaretleri için)
  function projectDir(dir) {
    _v.copy(camera.position).addScaledVector(dir, 60).project(camera);
    const behind = _v.z > 1;
    let x = _v.x, y = _v.y;
    if (behind) { x = -x; y = -y; }
    return { x: (x * 0.5 + 0.5) * W, y: (-y * 0.5 + 0.5) * H, inside: !behind && Math.abs(x) < 1 && Math.abs(y) < 1 };
  }
  const SUN_W = new THREE.Vector3(1, 0, 0);
  const sunScreen = () => projectDir(SUN_W);
  // Dünya: Ay'ın yakın yüzünün merkezi (0°, 0°) yönünde (librasyon yok sayıldı)
  const earthScreen = () => projectDir(new THREE.Vector3(0, 0, 1).applyQuaternion(moon.quaternion));
  // kameranın Ay yüzeyinden yüksekliği (km) ve görüş açısına göre ekrandaki km/px
  const altitudeKm = () => (camera.position.length() - 1) * R_KM;

  // ---------- giriş ----------
  function bindInput() {
    let drag = null;
    cv.addEventListener('pointerdown', (e) => {
      if (flying || e.button > 0) return;
      cv.setPointerCapture(e.pointerId);
      drag = { x: e.clientX, y: e.clientY, t: performance.now() };
      vel.az = vel.el = 0;
      tween = null; touched = true;
      cv.classList.add('dragging');
    });
    cv.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), dt = Math.max(1, now - drag.t);
      drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
      const k = (camera.fov / H) * Math.max(0.12, Math.min(1, (pose.dist - 1) / 2.4)) * 1.6; // yakındayken yavaş
      pose.az -= dx * k; pose.el = clamp(pose.el + dy * k, -86, 86);
      vel.az = (-dx * k) / dt * 16; vel.el = (dy * k) / dt * 16;
      if (cb.onUser) cb.onUser();
    });
    const end = () => { drag = null; cv.classList.remove('dragging'); };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (flying) return;
      tween = null; touched = true;
      pose.dist = clamp(1 + (pose.dist - 1) * Math.exp(e.deltaY * 0.0012), 1.12, 6.5);
      // yaklaştıkça bakış kutba kayar (kutup ekranın ortasına gelsin)

      pose.tx = lerp(pose.tx || 0, 0, 0.25); pose.tz = lerp(pose.tz || 0, 0, 0.25);
      if (cb.onUser) cb.onUser();

  }

  // ---------- iniş yaklaşması ----------
  // kamera noktanın ~130 km üstüne, biraz kuzeyinden noktaya bakarak iner; Ay bu sırada durur
  function approach(site, ms = 6200) {
    if (!ok) return Promise.resolve();
    tween = null; vel.az = vel.el = 0;
    spinGoal = 0;
    saved = Object.assign({}, pose);
    const v = vecOf(site), la = site.lat * D2R, lo = site.lon * D2R;
    const P = moon.localToWorld(v.clone());

    const north = new THREE.Vector3(-Math.sin(la) * Math.sin(lo), Math.cos(la), -Math.sin(la) * Math.cos(lo)).applyQuaternion(moon.quaternion);
    const c0 = camOf(pose);
    const r0 = c0.pos.length(), d0 = c0.pos.clone().normalize();

    const rE = endPos.length(), dE = endPos.clone().normalize();

    const slerp = (a) => {
      if (omega < 1e-4) return dE.clone();
      const s = Math.sin(omega);
      return d0.clone().multiplyScalar(Math.sin((1 - a) * omega) / s).addScaledVector(dE, Math.sin(a * omega) / s);
    };
    const fn = (k) => {
      const a = easeInOut(smooth(0, 0.82, k)), b = easeInOut(smooth(0.12, 1, k));
      const pos = slerp(a).multiplyScalar(lerp(r0, rE, b));
      const target = c0.target.clone().lerp(P, easeInOut(smooth(0.05, 0.75, k)));
      const up = c0.up.clone().lerp(radial, smooth(0.45, 1, k)).normalize();
      return { pos, target, up, fov: lerp(c0.fov, 42, smooth(0.5, 1, k)) };
    };
    flying = true; hold = false;
    return new Promise((res) => {
      path = { fn, t0: performance.now(), ms: reduced ? 1200 : ms, res: () => { hold = true; res(true); }, abort: () => res(false) };
    });
  }

  // kokpitten dönüş: inişin bittiği yerden önceki görünüme geri çık
  function depart(ms = 2600) {
    if (!ok || !saved) return Promise.resolve();
    const last = path && path.last;
    const to = camOf(saved);
    const from = last || { pos: to.pos.clone().multiplyScalar(0.3).setLength(1 + END_ALT), target: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0), fov: 42 };
    const r0 = from.pos.length(), d0 = from.pos.clone().normalize(), rE = to.pos.length(), dE = to.pos.clone().normalize();
    const omega = Math.acos(clamp(d0.dot(dE), -1, 1));
    const fn = (k) => {
      const a = easeInOut(k), s = Math.sin(omega);
      const dir = omega < 1e-4 ? dE.clone() : d0.clone().multiplyScalar(Math.sin((1 - a) * omega) / s).addScaledVector(dE, Math.sin(a * omega) / s);
      return { pos: dir.multiplyScalar(lerp(r0, rE, easeInOut(smooth(0, 0.8, k)))), target: from.target.clone().lerp(to.target, a), up: from.up.clone().lerp(to.up, a).normalize(), fov: lerp(from.fov, to.fov, a) };
    };
    flying = true; hold = false;
    const back = saved;
    return new Promise((res) => {
      path = { fn, t0: performance.now(), ms: reduced ? 500 : ms, res: () => { Object.assign(pose, back); saved = null; if (!paused) spinGoal = 1; res(); } };
    });
  }

  // yaklaşma sürerken vazgeç: olduğu yerden geri çık (approach sözü false ile çözülür)
  function cancel() {
    if (!path || !path.fn || !saved || !path.abort) return Promise.resolve();
    const abort = path.abort, cur = path.last;
    path = { last: cur }; flying = false;
    abort();
    return depart(1500);
  }

  // ---------- her kare ----------
  function render(dt) {
    if (!ok) return;
    // hızlandırılmış Ay günü
    spinK += clamp(spinGoal - spinK, -dt * 1.2, dt * 1.2);
    // yaklaştıkça dönüş durur: kutup görünümünde işaretler yerinde kalsın, tıklamak kolay olsun
    const near = camera ? smooth(1.7, 3.4, camera.position.length()) : 1;
    if (spinK * near > 0.001) { lightH += dt * SPIN_H_PER_S * spinK * near; applyLight(); if (cb.onLight) cb.onLight(lightH); }
    let c;
    if (path && path.fn) {
      const k = clamp((performance.now() - path.t0) / path.ms, 0, 1);
      c = path.fn(k);
      path.last = c;
      if (k >= 1) { const r = path.res; flying = false; path = { last: c }; if (r) r(); }
    } else {
      if (tween) {
        const k = clamp((performance.now() - tween.t0) / tween.ms, 0, 1), e = easeInOut(k), a = tween.from, b = tween.to;
        pose.az = a.az + wrapAz(b.az - a.az) * e; pose.el = lerp(a.el, b.el, e); pose.dist = lerp(a.dist, b.dist, e);
        pose.tx = lerp(a.tx || 0, b.tx || 0, e); pose.ty = lerp(a.ty, b.ty, e); pose.tz = lerp(a.tz || 0, b.tz || 0, e); pose.fov = lerp(a.fov, b.fov, e);
        if (k >= 1) { const r = tween.res; tween = null; r(); }
      } else if (Math.abs(vel.az) + Math.abs(vel.el) > 1e-4) {
        pose.az += vel.az; pose.el = clamp(pose.el + vel.el, -86, 86);
        const f = Math.exp(-dt * 3.2); vel.az *= f; vel.el *= f;
      }
      c = hold && path && path.last ? path.last : camOf(pose);
    }
    shift += (shiftGoal - shift) * Math.min(1, dt * 3);
    if (Math.abs(shift) > 1e-4) camera.setViewOffset(W, H, -shift * W, 0, W, H); else if (camera.view && camera.view.enabled) camera.clearViewOffset();
    place(c);
    mat.uniforms.uCam.value.copy(moon.worldToLocal(camera.position.clone()));
    mat.uniforms.uSun.value.copy(SUN_W).applyQuaternion(moon.quaternion.clone().invert());
    // sınır çizgileri uzaktan gürültü olmasın: yaklaştıkça belirir
    const cd = camera.position.length();
    mat.uniforms.uOverK.value = 0.25 + 0.65 * smooth(3.6, 1.8, cd);
    mat.uniforms.uCapK.value = smooth(3.0, 1.7, cd);
    stars.position.copy(camera.position);
    renderer.render(scene, camera);
  }

  function setShift(f) { shiftGoal = f; }
  function setSpin(on) { paused = !on; if (!flying && !saved) spinGoal = on ? 1 : 0; }

  return {
    init, render, flyTo, approach, depart, cancel, setLightHour, setSpin, setShift, project, projectSite, projectPole,
    sunScreen, earthScreen, altitudeKm, poseAbove, resize, OVERVIEW, POLE,
    get ok() { return ok; }, get flying() { return flying; }, get lightH() { return lightH; }, get paused() { return paused; },
    get dist() { return camera ? camera.position.length() : 4; }, get pose() { return pose; }, get landedFrom() { return saved; },
  };
})();

// ===== home: açılış ekranının arayüzü (küre üstündeki işaretler, ipucu, bölge listesi, tarih, yaklaşma göstergesi) =====
// Ekranda yalnız Ay ve dokuz bölge durur; işlevler küçük ve kenarlarda: araç çubuğu (sağ üst), tarih ve ışık (sol alt),
// bölge listesi (sağ alt, kapalı başlar). Ayrıntılı tablo ve harita "Liste" ekranında (eski brifing) kalır.
const Home = (() => {
  let idx, S, cb = {};
  let marks = [], hover = null, cluster = false, hot = new Set(), lastUser = 0, approaching = null;
  const SYN_H = 29.530588853 * 24;

  // her bölgede inilecek nokta: 1. aday (iniş paketi varsa), yoksa örnek nokta (brifing kartlarıyla aynı nokta)
  const pointOf = (s) => (s.top && s.top.landable ? s.top : s);
  const nameOf = (c) => (c.legacy ? t('cand.legacy') : t('cand.title', { n: c.rank }));

  function trio(c, cls = '') {
    const m = c.m;
    return `<span class="h-trio${cls}">
      <span class="sun">${icon('sun', 'sun')}<b>${Fmt.pct(m.terrain.sun_any_pct)}</b><small>${esc(t('home.m.sun'))}</small></span>
      <span class="earth">${icon('earth', 'earth')}<b>${Fmt.pct(m.terrain_antenna_1deg.earth_pct)}</b><small>${esc(t('home.m.earth'))}</small></span>
      <span class="dark">${icon('dark', 'dark')}<b>${Fmt.num(m.terrain.longest_dark_days, 1)}</b><small>${esc(t('home.m.dark'))}</small></span>
    </span>`;
  }

  function buildMarks() {
    const box = $('gMarks');
    box.innerHTML = '';
    marks = idx.sites.map((s) => {
      const p = pointOf(s), el = document.createElement('button');
      el.type = 'button'; el.className = 'gm'; el.dataset.id = s.id;
      el.setAttribute('aria-label', t('home.landOn', { name: s.region }));
      el.innerHTML = `<i></i><span class="gm-code">${esc(s.reg ? s.reg.code : '')}</span><span class="gm-name">${esc(s.region)}</span>`;
      el.addEventListener('pointerenter', () => setHover(s));
      el.addEventListener('pointerleave', () => setHover(null));
      el.addEventListener('focus', () => setHover(s));
      el.addEventListener('blur', () => setHover(null));
      el.addEventListener('click', () => land(s));
      box.appendChild(el);
      return { s, p, el, x: 0, y: 0, front: false };
    });
  }

  function buildList() {
    const list = idx.sites.slice().sort((a, b) => pointOf(b).m.terrain.sun_any_pct - pointOf(a).m.terrain.sun_any_pct);
    $('hRegList').innerHTML = `<li class="h-reg-head">${esc(t('home.listHead', { period: periodLabel(idx.period) }))}</li>` + list.map((s) => `<li><button type="button" class="h-reg" data-id="${s.id}">
        <span class="h-reg-code">${esc(s.reg ? s.reg.code : '')}</span><span class="h-reg-name">${esc(s.region)}</span>${trio(pointOf(s), ' mini')}</button></li>`).join('');
    const ol = $('hRegList');
    ol.onclick = (e) => { const b = e.target.closest('.h-reg'); if (b) land(idx.sites.find((x) => x.id === b.dataset.id)); };
    ol.onpointerover = (e) => { const b = e.target.closest('.h-reg'); setHover(b ? idx.sites.find((x) => x.id === b.dataset.id) : null, true); };
    ol.onpointerleave = () => setHover(null);
    const tg = $('hRegToggle');
    tg.onclick = () => { const open = tg.getAttribute('aria-expanded') !== 'true'; tg.setAttribute('aria-expanded', String(open)); ol.hidden = !open; };
  }

  function setHover(s, fromList) {
    hover = s;
    marks.forEach((m) => m.el.classList.toggle('on', m.s === s));
    const tip = $('hTip');
    if (!s || approaching) { tip.hidden = true; return; }
    const p = pointOf(s);
    tip.innerHTML = `<strong><span class="code">${esc(s.reg ? s.reg.code : '')}</span>${esc(s.region)}</strong>
      <small>${esc(nameOf(p))} · ${esc(Fmt.latlon(p.lat, p.lon))}</small>
      ${trio(p)}
      <small class="period">${esc(t('home.tipPeriod', { period: periodLabel(idx.period) }))}</small>
      <em>${esc(t(fromList ? 'home.tipClickList' : 'home.tipClick'))}</em>`;
    tip.hidden = false;
    tip.dataset.list = fromList ? 'true' : 'false';
    placeTip();
  }
  function placeTip() {
    const tip = $('hTip');
    if (tip.hidden || !hover) return;
    const m = marks.find((x) => x.s === hover), box = $('home').getBoundingClientRect();
    if (tip.dataset.list === 'true' || !m || !m.front || cluster) {
      tip.style.transform = `translate(${Math.max(16, box.width - tip.offsetWidth - 300)}px, ${Math.max(70, box.height - tip.offsetHeight - 90)}px)`;
      return;
    }
    let x = m.x + 18, y = m.y - tip.offsetHeight / 2;
    if (x + tip.offsetWidth > box.width - 16) x = m.x - 18 - tip.offsetWidth;
    y = clamp(y, 64, box.height - tip.offsetHeight - 70);
    tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }

  // ---------- iniş ----------
  async function land(s) {
    if (!s || approaching || Globe.flying) return;
    const p = pointOf(s);
    if (!p.landable) return;
    approaching = s;
    setHover(null);
    Present.stop(true);
    const home = $('home');
    home.dataset.mode = 'approach';
    setText($('haName'), s.region);
    setText($('haPoint'), nameOf(p) + ' · ' + Fmt.latlon(p.lat, p.lon));
    $('hApproach').hidden = false;
    cb.preload && cb.preload(p);
    const done = await Globe.approach(p);
    if (!done) { home.dataset.mode = ''; $('hApproach').hidden = true; approaching = null; return; }
    home.dataset.mode = 'fade';
    await new Promise((r) => setTimeout(r, 520));
    try { await cb.onLand(p); } finally {
      $('hApproach').hidden = true;
      approaching = null;
    }
  }
  function cancel() { if (approaching && Globe.flying) Globe.cancel(); }

  // kokpitten açılış ekranına dönüş: siyahtan açılır, kamera geri çıkar
  function returnTo() {
    const home = $('home');
    home.dataset.mode = 'fade';
    requestAnimationFrame(() => requestAnimationFrame(() => { home.dataset.mode = ''; }));
    syncDate();
    if (Globe.landedFrom) Globe.depart();
  }

  // ---------- tarih ve ışık ----------
  function syncDate() {
    setText($('hDateV'), Fmt.date(S.landing, true) + ' · ' + Fmt.time(S.landing) + ' ' + t('top.utc'));
    const el = $('hDate');
    if (document.activeElement !== el) el.value = Fmt.toInput(S.landing);
    Globe.setLightHour(S.landing);
  }
  function bindDate() {
    const el = $('hDate');
    el.min = Fmt.toInput(0); el.max = Fmt.toInput(idx.hours - 1);
    $('hDateBtn').onclick = () => { const f = $('hDateField'); f.hidden = !f.hidden; if (!f.hidden) el.focus(); };
    el.onchange = () => {
      const h = Fmt.fromInput(el.value);
      if (h == null) return;
      cb.onDate(clamp(h, 0, idx.hours - 1));
      syncDate();
    };
    const sp = $('hSpin');
    sp.onclick = () => {
      const on = Globe.paused;
      Globe.setSpin(on);
      sp.setAttribute('aria-pressed', String(on));
      sp.querySelector('use').setAttribute('href', on ? '#i-pause' : '#i-play');
      sp.setAttribute('aria-label', t(on ? 'home.spinPause' : 'home.spinPlay'));
    };
    sp.setAttribute('aria-label', t('home.spinPause'));
  }
  // ışık, inişten sonraki Ay gününde döner (ekranda o günün tarihi)
  function onLight(h) {
    if (h > S.landing + SYN_H) Globe.setLightHour(S.landing + ((h - S.landing) % SYN_H));
    setText($('hLightV'), Fmt.date(Globe.lightH, true));
  }

  // ---------- her kare ----------
  function edge(el, p, pad) {
    const box = $('home').getBoundingClientRect(), cx = box.width / 2, cy = box.height / 2;
    let dx = p.x - cx, dy = p.y - cy;
    const sx = (cx - pad) / Math.max(1e-6, Math.abs(dx)), sy = (cy - pad - 40) / Math.max(1e-6, Math.abs(dy)), k = Math.min(1, sx, sy);
    const x = clamp(cx + dx * k, pad, box.width - pad), y = clamp(cy + dy * k, 78, box.height - 110);
    el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    el.querySelector('i').style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  }

  function update() {
    if (!Globe.ok) return;
    let minD = Infinity, spread = 0;
    const front = [], pole = Globe.projectPole();
    for (const m of marks) {
      const q = Globe.projectSite(m.p);
      m.x = q.x; m.y = q.y; m.front = q.front;
      if (q.front) { front.push(m); spread = Math.max(spread, Math.hypot(q.x - pole.x, q.y - pole.y)); }
    }
    for (let i = 0; i < front.length; i++) for (let j = i + 1; j < front.length; j++) minD = Math.min(minD, Math.hypot(front[i].x - front[j].x, front[i].y - front[j].y));
    // uzaktan dokuz nokta üst üste biner: tek bir "yaklaş" halkası; yakındayken tek tek tıklanır
    const wantCluster = front.length > 1 && spread < 95;
    if (wantCluster !== cluster) { cluster = wantCluster; $('home').dataset.cluster = String(cluster); }
    const showNames = !cluster && minD > 120 && Globe.dist < 1.9;
    for (const m of marks) {
      m.el.hidden = !m.front;
      if (m.front) m.el.style.transform = `translate(${m.x.toFixed(1)}px, ${m.y.toFixed(1)}px)`;
      m.el.classList.toggle('hot', hot.has(m.s.id));
      m.el.classList.toggle('named', showNames || hot.has(m.s.id));
      m.el.tabIndex = cluster ? -1 : 0;
    }
    const cl = $('gCluster');
    cl.hidden = !(cluster && pole.front) || !!approaching;
    if (!cl.hidden) cl.style.transform = `translate(${pole.x.toFixed(1)}px, ${pole.y.toFixed(1)}px)`;
    edge($('gSun'), Globe.sunScreen(), 34);
    edge($('gEarth'), Globe.earthScreen(), 34);
    placeTip();
    if (approaching) {
      const alt = Globe.altitudeKm();
      setText($('haAlt'), alt >= 1000 ? Fmt.num(alt / 1000, 1) + ' ' + t('home.thousandKm') : Fmt.num(alt, 0) + ' ' + t('unit.km'));
    }
  }

  function setHot(ids) { hot = new Set(ids || []); }

  function onUser() {
    const now = performance.now();
    if (now - lastUser < 400) return;
    lastUser = now;
    if (!$('hHint').classList.contains('gone')) { $('hHint').classList.add('gone'); Store.set('homeHint', true); }
  }

  function init(index, state, callbacks) {
    idx = index; S = state; cb = callbacks || {};
    const ok = Globe.init($('globe'), idx, { onUser, onLight });
    $('home').dataset.gl = String(ok);
    if (!ok) { setText($('hNoGl'), t('home.noGl')); $('hNoGl').hidden = false; }
    buildMarks(); buildList(); bindDate();
    $('gCluster').onclick = () => { onUser(); Globe.flyTo(Globe.POLE, 2200); };
    setText($('gClusterL'), t('home.cluster', { n: idx.sites.length }));
    $('hPresent').onclick = () => Present.start();
    $('hList').onclick = () => cb.openList();
    $('hVideo').onclick = () => { Present.stop(true); $('btnVideo').click(); }; // tanıtım videosu (Blender)
    $('hInfo').onclick = () => $('dataDlg').showModal();
    $('hOverview').onclick = () => Globe.flyTo(Globe.OVERVIEW, 1800);
    $('hPole').onclick = () => Globe.flyTo(Globe.POLE, 2000);
    $('haCancel').onclick = cancel;
    if (Store.get('homeHint', false)) $('hHint').classList.add('gone');
    const langs = Object.keys(STRINGS), ls = $('hLang');
    if (langs.length > 1) {
      ls.hidden = false;
      ls.innerHTML = langs.map((l) => `<option value="${l}"${l === LANG ? ' selected' : ''}>${esc(l.toUpperCase())}</option>`).join('');
      ls.setAttribute('aria-label', t('langLabel'));
      ls.onchange = () => { Store.set('lang', ls.value); location.reload(); };
    }
    document.addEventListener('keydown', (e) => {
      if (S.scene !== 'home' || $('dataDlg').open || $('videoDlg').open || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'Escape') { if (approaching) cancel(); }
      else if ((e.key === 'p' || e.key === 'P') && !Present.active && !approaching) Present.start();
    });
    syncDate();
  }

  return { init, update, land, cancel, returnTo, syncDate, setHot, pointOf, get approaching() { return approaching; } };
})();

// ===== present: sunum modu — tek tuşla ilerleyen rehberli tur (açılış ekranındaki kürenin üstünde) =====
// Her sahnede büyük bir başlık, tek cümle ve gerekiyorsa iki-üç büyük rakam. Rakamlar veriden gelir:
// 2026–2030 özetleri sites.json / candidates.json'dan, "görev kayarsa" sahnesi tarayıcıda canlı hesaplanır
// (karşılaştırma ekranıyla aynı hesap: Sim.windowStats, ilk 30 gün, 1° anten payı).
// Tuşlar: → / Boşluk / PageDown ilerle, ← / PageUp geri, Esc çık.
const Present = (() => {
  let idx, S, cb = {}, i = 0, active = false, token = 0, wasPaused = false;
  const SLIP_SITE = 'malapert_massif', PLAN = '2027-03-01T00:00', SLIP_DAYS = 14, WIN_DAYS = 30, MASK = 1;

  const byId = (id) => idx.sites.find((s) => s.id === id);
  const kmBetween = (a, b) => Math.hypot(a.ps_km[0] - b.ps_km[0], a.ps_km[1] - b.ps_km[1]);
  const fig = (v, label, cls = '') => `<div class="pr-fig ${cls}"><b>${v}</b><span>${esc(label)}</span></div>`;
  const sign = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Fmt.num(Math.abs(v), d);

  // ---------- sahneler ----------
  const scenes = [
    { key: 'pole', enter() {
      Home.setHot([]);
      Globe.setSpin(true);
      return Globe.flyTo({ az: 168, el: -24, dist: 3.9, tx: 0, ty: -0.25, tz: 0, fov: 30 }, 2600);
    } },
    { key: 'regions', enter() {
      Globe.setSpin(false);
      Home.setHot(idx.sites.map((s) => s.id));
      return Globe.flyTo(Globe.POLE, 2600);
    } },
    { key: 'contrast', enter() {
      Globe.setSpin(false);
      const list = idx.sites.slice().sort((a, b) => Home.pointOf(b).m.terrain.sun_any_pct - Home.pointOf(a).m.terrain.sun_any_pct);
      const best = list[0], worst = list[list.length - 1], pb = Home.pointOf(best), pw = Home.pointOf(worst);
      Home.setHot([best.id, worst.id]);
      setLine('contrast', { best: best.region, worst: worst.region, km: Fmt.num(kmBetween(pb, pw), 0) });
      setFigs(fig(Fmt.pct(pb.m.terrain.sun_any_pct), best.region, 'sun') + fig(Fmt.pct(pw.m.terrain.sun_any_pct), worst.region, 'dim'),
        t('present.periodSun', { period: periodLabel(idx.period) }));
      return Globe.flyTo(Globe.POLE, 1800);
    } },
    { key: 'flat', enter() {
      Globe.setSpin(false);
      const s = byId(SLIP_SITE) || idx.sites[0], m = s.m;
      Home.setHot([s.id]);
      setLine('flat', { name: s.region });
      setFigs(
        `<div class="pr-vs"><div><small>${esc(t('present.flatCol'))}</small>${fig(Fmt.pct(m.flat_horizon.sun_any_pct), t('home.m.sun'), 'dim')}${fig(Fmt.num(m.flat_horizon.longest_dark_days, 1), t('present.darkDays'), 'dim')}</div>`
        + `<div class="pr-arrow">→</div><div><small>${esc(t('present.terrainCol'))}</small>${fig(Fmt.pct(m.terrain.sun_any_pct), t('home.m.sun'), 'sun')}${fig(Fmt.num(m.terrain.longest_dark_days, 1), t('present.darkDays'), 'dark')}</div></div>`,
        t('present.periodSample', { period: periodLabel(idx.period) }));
      return Globe.flyTo(Globe.poseAbove(s, 1.22, 7), 2400);
    } },
    { key: 'height', enter() {
      Globe.setSpin(false);
      const s = byId(SLIP_SITE) || idx.sites[0], a = s.metrics['2m'], b = s.metrics['10m'];
      Home.setHot([s.id]);
      if (!b) { setLine('heightNone', {}); setFigs(''); return Promise.resolve(); }
      setLine('height', { name: s.region, d: sign(b.terrain.sun_any_pct - a.terrain.sun_any_pct) });
      setFigs(`<div class="pr-vs">${fig(Fmt.pct(a.terrain.sun_any_pct), t('present.h2'), 'dim')}<div class="pr-arrow">→</div>${fig(Fmt.pct(b.terrain.sun_any_pct), t('present.h10'), 'sun')}</div>`,
        t('present.periodSample', { period: periodLabel(idx.period) }));
      return Globe.flyTo(Globe.poseAbove(s, 1.1, 4), 1800);
    } },
    { key: 'slip', enter: slipScene },
    { key: 'valid', enter() {
      Globe.setSpin(true);
      Home.setHot([]);

      const val = idx.validation || {}, v = val.sun_0m || val.sun_0m_map_res, ve = val.earth_0m || val.earth_0m_map_res;

      else setLine('validNone', {});
      setFigs(v && ve ? fig(Fmt.num(v.mean_abs, 1), t('present.validSun'), 'sun') + fig(Fmt.num(ve.mean_abs, 1), t('present.validEarth'), 'earth') : '',
        v && ve ? t('present.validNote', { period: val.period }) : '');
      return Globe.flyTo(Globe.OVERVIEW, 2600);
    } },
    { key: 'try', enter() {
      Globe.setSpin(false);
      Home.setHot(idx.sites.map((s) => s.id));

    } },
  ];

  // "Görev 2 hafta kayarsa?": A = örnek nokta, plan tarihi; B = aynı nokta +14 gün; C = bölgenin 1. adayı, +14 gün
  async function slipScene() {
    Globe.setSpin(false);
    const s = byId(SLIP_SITE) || idx.sites[0], c1 = Home.pointOf(s);
    Home.setHot([s.id]);
    const h0 = Fmt.fromInput(PLAN), h1 = h0 + SLIP_DAYS * 24, my = token;
    setLine('slipWait', { name: s.region });
    setFigs(`<p class="pr-wait">${esc(t('present.computing'))}</p>`);
    const fly = Globe.flyTo(Globe.poseAbove(s, 1.16, 5), 2000);
    try {
      const [a, c] = await Promise.all([cb.core(s.id), c1 === s ? null : cb.core(c1.id)]);
      if (my !== token) return;
      const A = Sim.windowStats(a, h0, WIN_DAYS * 24, MASK), B = Sim.windowStats(a, h1, WIN_DAYS * 24, MASK);
      const C = c ? Sim.windowStats(c, h1, WIN_DAYS * 24, MASK) : null;
      const km = c ? kmBetween(s, c1) : 0;
      setLine(C ? 'slip' : 'slipNoCand', { name: s.region, dB: sign(B.bothPct - A.bothPct), dC: C ? sign(C.bothPct - A.bothPct) : '', km: Fmt.num(km, 1),
        d0: Fmt.date(h0, true), d1: Fmt.date(h1) });
      const col = (st, title, sub, cls) => `<div class="pr-col ${cls}"><small>${esc(title)}</small><em>${esc(sub)}</em>${fig(Fmt.pct(st.bothPct), t('present.both'), 'both')}${fig(Fmt.num(st.longestDarkH / 24, 1), t('present.darkDays'), 'dark')}</div>`;
      setFigs(`<div class="pr-cols">${col(A, 'A · ' + t('present.plan'), t('cand.legacy') + ' · ' + Fmt.date(h0), 'dim')}${col(B, 'B · ' + t('present.slipped'), t('cand.legacy') + ' · ' + Fmt.date(h1), 'dim')}`
        + (C ? col(C, 'C · ' + t('present.moved'), nameOf(c1) + ' · ' + Fmt.date(h1), 'win') : '') + '</div>',
      t('present.periodSlip', { n: WIN_DAYS, mask: Fmt.num(MASK, 0) }));
    } catch (e) {
      console.warn('sunum: hesap yapılamadı', e);
      if (my === token) { setLine('slipError', { name: s.region }); setFigs(''); }
    }
    return fly;
  }
  const nameOf = (c) => (c.legacy ? t('cand.legacy') : t('cand.title', { n: c.rank }));

  // ---------- görünüm ----------
  function setLine(key, vars) { setText($('prLine'), t('present.s.' + key + '.line', vars)); }
  function setFigs(html, note) { $('prFigs').innerHTML = html || ''; setText($('prNote'), note || ''); }

  function show(n) {
    i = clamp(n, 0, scenes.length - 1);
    token++;
    const sc = scenes[i], box = $('present');
    box.dataset.scene = sc.key;
    box.classList.remove('in'); void box.offsetWidth; box.classList.add('in');
    setText($('prKick'), t('present.kicker', { i: i + 1, n: scenes.length }));
    setText($('prTitle'), t('present.s.' + sc.key + '.title'));
    setLine(sc.key, {});
    setFigs('');
    $('prDots').querySelectorAll('li').forEach((li, k) => li.classList.toggle('on', k === i));
    $('prPrev').disabled = i === 0;
    setText($('prNextL'), t(i === scenes.length - 1 ? 'present.finish' : 'present.next'));
    sc.enter();
  }

  function start() {
    if (active || Home.approaching) return;
    active = true;
    wasPaused = Globe.paused;
    $('present').hidden = false;
    $('home').dataset.present = 'on';
    if (innerWidth > 900) Globe.setShift(0.2);
    $('prDots').innerHTML = scenes.map(() => '<li></li>').join('');
    show(0);
  }
  function stop(silent) {
    if (!active) return;
    active = false; token++;
    $('present').hidden = true;
    $('home').dataset.present = 'off';
    Globe.setShift(0);
    Globe.setSpin(!wasPaused);
    Home.setHot([]);
    if (!silent) Globe.flyTo(Globe.POLE, 1800);
  }
  const next = () => (i >= scenes.length - 1 ? stop() : show(i + 1));
  const prev = () => show(i - 1);

  function init(index, state, callbacks) {
    idx = index; S = state; cb = callbacks || {};
    $('prNext').onclick = next; $('prPrev').onclick = prev; $('prExit').onclick = () => stop();
    document.addEventListener('keydown', (e) => {
      if (!active || S.scene !== 'home' || $('videoDlg').open) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
      else if (e.key === 'Escape') { e.preventDefault(); stop(); }
    });
  }

  return { init, start, stop, get active() { return active; } };
})();

// ===== briefing: kutup haritası + bölge kartları + bölge içi aday noktalar =====
const Briefing = (() => {
  const R_MOON = 1737.4;
  const SORTS = ['power', 'comm', 'dark', 'balanced'];
  const LABEL_ANCHOR = { nobile_rim_1: 'br', mons_mouton_plateau: 'tr', mons_mouton: 'tl' };
  const CAND_KK = 7;   // px/km: haritada bundan uzaktayken aday noktaları üst üste biner, çizilmez
  const RING_KK = 45;  // px/km: iniş hatası halkaları (100 m ve 300 m) ancak bu kadar yakından seçilir
  const SPAN_MIN = 3;  // km: adaylar arası 300 m seçilebilsin diye
  let idx, cv, ctx, cb = {};
  let sort = 'power', selected = null, hover = null;
  let pick = null, hoverCand = null; // seçili bölgede inilecek nokta ve farenin üstündeki aday
  const weights = { sun: 1, earth: 1, dark: 1 }; // dengeli puanın ağırlıkları (eşitken veri dosyasındaki sırayla aynı)
  let moreOpen = window.innerHeight >= 1000;      // ayrıntı satırları: kısa ekranda kapalı başlar, kartlara yer kalsın
  const view = { cx: 0, cy: 60, span: 480 }, goal = { cx: 0, cy: 60, span: 480 };
  let raf = 0, dims = { w: 1, h: 1, dpr: 1 };
  // İlk açılışta harita boyutsuzken (gizli ya da yerleşim bitmemişken) sığdırma yapılırsa görünüm 3 km'ye
  // çöküyor ve harita simsiyah açılıyordu. Kullanıcı haritaya dokunana kadar her boyut değişiminde yeniden sığdırılır.
  let autoFit = true;

  // Her kart TEK bir noktanın kendi rakamlarını gösterir: bölgenin 1. adayı (dengeli puanı en yüksek nokta);
  // "Dengeli" sıralamada ağırlıklar değişince o ağırlıklarla en yüksek puanlı nokta. Sıralama da o noktaya göre.
  const cardPoint = (s) => (sort === 'balanced' ? bestWeighted(s).c : s.top);
  const val = {
    power: (s) => s.top.m.terrain.sun_energy_pct,
    comm: (s) => s.top.m.terrain_antenna_1deg.earth_pct,
    dark: (s) => -s.top.m.terrain.longest_dark_days,
    balanced: (s) => bestWeighted(s).score,
  };
  // seçili ağırlıklarla bölgenin en yüksek puanlı noktası
  function bestWeighted(s) {
    let best = null;
    for (const c of s.cands) { const score = Sim.weighted(c.m, weights); if (!best || score > best.score) best = { c, score }; }
    return best;
  }
  const sorted = () => idx.sites.slice().sort((a, b) => val[sort](b) - val[sort](a));
  const cur = () => idx.sites.find((x) => x.id === selected);
  const candName = (c) => (c.legacy ? t('cand.legacy') : t('cand.title', { n: c.rank }));

  // ---------- kartlardaki mini şerit: 2027'de Güneş (üst) ve Dünya, 1° payla (alt); bölgenin 1. adayı ----------
  const BINS = 180, strips = new Map();
  function stripData(se) {
    const sf = se.sun_visible_fraction, em = se.earth_margin_deg, n = sf.length, sun = new Float32Array(BINS), earth = new Float32Array(BINS);
    for (let b = 0; b < BINS; b++) {
      const a = Math.floor((b / BINS) * n), e = Math.floor(((b + 1) / BINS) * n);
      let s = 0, k = 0;
      for (let i = a; i < e; i++) { s += sf[i]; if (em[i] > 1) k++; }
      sun[b] = s / (e - a); earth[b] = k / (e - a);
    }
    return { sun, earth };
  }
  function drawStrip(el) {
    const d = strips.get(el.dataset.id);
    if (!d) return;
    const f = fitCanvas(el), c = el.getContext('2d'), bw = f.w / BINS;
    c.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
    c.clearRect(0, 0, f.w, f.h);
    for (let b = 0; b < BINS; b++) {
      if (d.sun[b] > 0.01) { c.globalAlpha = 0.2 + 0.8 * d.sun[b]; c.fillStyle = cssVar('--sun'); c.fillRect(b * bw, 0, bw + 0.4, 3); }
      if (d.earth[b] > 0.01) { c.globalAlpha = 0.2 + 0.8 * d.earth[b]; c.fillStyle = cssVar('--earth'); c.fillRect(b * bw, 4, bw + 0.4, 3); }
    }
    c.globalAlpha = 1;
  }
  const drawStrips = () => document.querySelectorAll('#cards .ministrip').forEach(drawStrip);
  async function preloadStrips() {
    for (const s of sorted()) {
      if (strips.has(s.id)) continue;
      try { strips.set(s.id, stripData(await Data.loadYear(s.top.id, idx.defaultYear))); drawStrips(); } catch (e) { /* şerit olmadan da kart çalışır */ }
    }
  }

  // ---------- kartlar ----------
  function renderSortBar() {

  // dengeli sıralamada üç ölçünün ağırlığı (0–5); hepsi eşitken puan değişmez
  function renderWeights() {

    bar.innerHTML = `<span class="wb-l">${esc(t('brief.weights'))}</span>` + [['sun', 'sun'], ['earth', 'earth'], ['dark', 'dark']].map(([k, ic]) =>
      `<label class="wb">${icon(ic, ic)}<span>${esc(t('brief.weight.' + k))}</span><input type="range" min="0" max="5" step="1" value="${weights[k]}" data-k="${k}" aria-label="${esc(t('brief.weights') + ': ' + t('brief.weight.' + k))}"><output>${weights[k]}</output></label>`).join('')

  function select(id, o = {}) {
