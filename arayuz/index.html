    const el = $('bDate');
    if (el && cb.state && document.activeElement !== el) el.value = Fmt.toInput(cb.state.landing);
  }
  function pickCand(c) {
    pick = c;
    renderDetail(); draw();
    if (cb.onSelect) cb.onSelect(c);
  }

  // ---------- harita ----------
  const k = () => Math.min(dims.w, dims.h) / view.span;
  const sx = (x) => dims.w / 2 + (x - view.cx) * k();
  const sy = (y) => dims.h / 2 - (y - view.cy) * k();
  const latR = (lat) => 2 * R_MOON * Math.tan(((90 - Math.abs(lat)) / 2) * D2R);

  function bboxOf(poly) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    return { x0, y0, x1, y1 };
  }
  // b kutusu haritaya sığacak şekilde hedef görünüm
  function frame(b, pad, minSpan) {
    dims = fitCanvas(cv);
    if (dims.w < 80 || dims.h < 80) return; // görünmüyor: boyut gelince ResizeObserver yeniden sığdırır
    const w = (b.x1 - b.x0) * pad, h = (b.y1 - b.y0) * pad, short = Math.min(dims.w, dims.h);
    goal.cx = (b.x0 + b.x1) / 2; goal.cy = (b.y0 + b.y1) / 2;
    goal.span = Math.max(minSpan, w * (short / dims.w), h * (short / dims.h));
  }
  function fitAll(instant) {
    autoFit = true;
    let x0 = 0, y0 = 0, x1 = 0, y1 = 0; // kutup (0,0) hep görünsün
    for (const s of idx.sites) { const b = bboxOf(s.reg.polygon_ps_km); x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1); }
    frame({ x0, y0, x1, y1 }, 1.22, SPAN_MIN);
    if (instant) Object.assign(view, goal);
    animate();
  }
  function zoomRegion(s) { autoFit = false; frame(bboxOf(s.reg.polygon_ps_km), 1.3, SPAN_MIN); animate(); }
  function zoomCands() {
    const s = cur();
    if (!s) return;
    autoFit = false;
    frame(bboxOf(s.cands.map((c) => c.ps_km)), 1.5, 5);
    animate();
  }
  // seçili noktaya, iniş hatası halkaları seçilecek kadar yaklaş
  function zoomPick() {
    if (!pick) return;
    autoFit = false;
    goal.cx = pick.ps_km[0]; goal.cy = pick.ps_km[1]; goal.span = SPAN_MIN;
    animate();
  }
  // inişe geçerken noktaya yaklaş (zaten daha yakınsa uzaklaşma)
  function zoomTo(site, ms = 900) {
    if (!site) return Promise.resolve();
    goal.cx = site.ps_km[0]; goal.cy = site.ps_km[1]; goal.span = Math.min(goal.span, 46);
    animate();
    return new Promise((res) => setTimeout(res, ms));
  }
  function animate() {
    if (raf) return;
    const step = () => {
      raf = 0;
      let moving = false;
      for (const key of ['cx', 'cy', 'span']) {
        const d = goal[key] - view[key];
        if (Math.abs(d) > (key === 'span' ? 0.05 : 0.02) * Math.min(1, view.span / 40)) { view[key] += d * 0.14; moving = true; } else view[key] = goal[key];
      }
      draw();
      if (moving) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  const showCands = (s) => s && s.id === selected && s.cands.length > 1 && k() >= CAND_KK;

  function diamond(px, py, r) {
    ctx.beginPath(); ctx.moveTo(px, py - r); ctx.lineTo(px + r, py); ctx.lineTo(px, py + r); ctx.lineTo(px - r, py); ctx.closePath();
  }

  // seçili noktanın iniş hatası halkaları (yalnız çok yakından): halka kesik çizgi, üstündeki hesap noktaları
  // düzse küçük nokta, eğim sınırını aşıyorsa uyarı renginde çarpı. Harita kuzeyi yukarıda değil; yön enlem/boylamdan.
  function drawRings(c, px, py, line) {
    const warn = cssVar('--warn'), kk = k();
    for (const r of c.sens.rings) {
      ctx.setLineDash([3, 3]); ctx.lineWidth = 1; ctx.strokeStyle = line;
      ctx.beginPath(); ctx.arc(px, py, (r.radius_m / 1000) * kk, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      for (const o of r.offsets) {
        const rho = latR(o.lat), a = o.lon * D2R, ox = sx(rho * Math.sin(a)), oy = sy(rho * Math.cos(a));
        if (o.flat) { ctx.fillStyle = line; ctx.beginPath(); ctx.arc(ox, oy, 2, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.strokeStyle = warn; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ox - 3, oy - 3); ctx.lineTo(ox + 3, oy + 3); ctx.moveTo(ox + 3, oy - 3); ctx.lineTo(ox - 3, oy + 3); ctx.stroke(); }
      }
    }
  }

  // aday noktalar: iniş paketi olanlar dolu, yalnız rakamı olanlar içi boş, eski örnek nokta eşkenar dörtgen
  function drawCands(s, line) {
    const order = s.cands.slice().sort((a, b) => (a === pick) - (b === pick) || a.landable - b.landable);
    for (const c of order) {
      const px = sx(c.ps_km[0]), py = sy(c.ps_km[1]), on = c === pick, hov = c === hoverCand;
      ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(0,0,0,0.8)';
      if (c.legacy) { diamond(px, py, 5.5); ctx.stroke(); ctx.lineWidth = 1.6; ctx.strokeStyle = on || hov ? '#fff' : line; ctx.stroke(); }
      else {
        ctx.beginPath(); ctx.arc(px, py, 3.6, 0, Math.PI * 2); ctx.stroke();
        if (c.landable) { ctx.fillStyle = on || hov ? '#fff' : line; ctx.fill(); }
        else { ctx.lineWidth = 1.4; ctx.strokeStyle = on || hov ? '#fff' : line; ctx.stroke(); }
      }
      if (on || hov) {
        ctx.lineWidth = 3.4; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.arc(px, py, on ? 12 : 8.5, 0, Math.PI * 2); ctx.stroke();
        ctx.lineWidth = on ? 2 : 1.2; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
      if (on && c.sens && k() >= RING_KK) drawRings(c, px, py, line);
      if (c.landable && !c.legacy) {
        ctx.font = '500 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(String(c.rank), px + 6, py - 4);
        ctx.fillStyle = '#fff'; ctx.fillText(String(c.rank), px + 6, py - 4);
      }
    }
  }

  function draw() {
    if (!ctx) return;
    dims = fitCanvas(cv);
    const { w, h, dpr } = dims;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#050607'; ctx.fillRect(0, 0, w, h);
    const b = idx.map.bounds, kk = k();
    if (idx.map.image) {
      ctx.globalAlpha = 0.8;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(idx.map.image, sx(b[0]), sy(b[3]), (b[2] - b[0]) * kk, (b[3] - b[1]) * kk);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(6,9,10,0.38)'; ctx.fillRect(0, 0, w, h);
    }
    const line = cssVar('--line'), earth = cssVar('--earth');
    ctx.font = '500 11px "IBM Plex Mono", monospace';

    // seçili bölgede NASA aydınlanma haritası (poligon dışı saydam); yakında harita pikselleri olduğu gibi görünür
    const selS = cur(), heat = selS && selS.heat && selS.heat.image ? selS.heat : null;
    if (heat) {
      const hb = heat.bounds;
      ctx.imageSmoothingEnabled = ((hb[2] - hb[0]) * kk) / heat.image.width < 4;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(heat.image, sx(hb[0]), sy(hb[3]), (hb[2] - hb[0]) * kk, (hb[3] - hb[1]) * kk);
      ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = true;
    }

    // enlem çemberleri ve boylamlar
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(201,210,205,0.22)'; ctx.fillStyle = 'rgba(201,210,205,0.7)';
    for (const lat of [88, 86, 84, 82]) {
      const r = latR(lat) * kk;
      ctx.beginPath(); ctx.arc(sx(0), sy(0), r, 0, Math.PI * 2); ctx.stroke();
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(lat + '° ' + t('compass.s'), sx(0) + r * Math.SQRT1_2 + 3, sy(0) + r * Math.SQRT1_2);
    }
    for (let lon = 0; lon < 360; lon += 30) {
      const a = lon * D2R, r0 = latR(89) * kk, r1 = latR(80) * kk;
      ctx.beginPath(); ctx.moveTo(sx(0) + Math.sin(a) * r0, sy(0) - Math.cos(a) * r0); ctx.lineTo(sx(0) + Math.sin(a) * r1, sy(0) - Math.cos(a) * r1); ctx.stroke();
    }
    // kutup
    ctx.strokeStyle = line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(sx(0) - 7, sy(0)); ctx.lineTo(sx(0) + 7, sy(0)); ctx.moveTo(sx(0), sy(0) - 7); ctx.lineTo(sx(0), sy(0) + 7); ctx.stroke();
    ctx.fillStyle = line; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = '600 13px "Barlow Condensed", sans-serif';
    ctx.fillText(t('brief.mapPole').toLocaleUpperCase(LOCALE), sx(0) + 9, sy(0) + 5);
    // Dünya yönü: 0° boylam
    const ex = sx(0), ey = Math.max(26, sy(latR(80.6)));
    ctx.strokeStyle = earth; ctx.fillStyle = earth; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ex, ey + 20); ctx.lineTo(ex, ey); ctx.moveTo(ex - 5, ey + 7); ctx.lineTo(ex, ey); ctx.lineTo(ex + 5, ey + 7); ctx.stroke();
    ctx.textBaseline = 'middle';
    ctx.fillText(t('brief.mapEarth').toLocaleUpperCase(LOCALE), ex + 9, ey + 8);

    // bölgeler
    const order = idx.sites.slice().sort((a, c) => c.reg.area_km2 - a.reg.area_km2);
    for (const s of order) {
      const sel = s.id === selected, hov = s.id === hover, poly = s.reg.polygon_ps_km;
      ctx.beginPath();
      poly.forEach(([x, y], i) => (i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y))));
      ctx.closePath();
      if (sel && !heat) { ctx.fillStyle = 'rgba(238,242,238,0.14)'; ctx.fill(); }
      ctx.lineWidth = sel ? 2.4 : hov ? 1.8 : 1.1;
      ctx.strokeStyle = sel || hov ? '#ffffff' : line;
      ctx.stroke();
    }
    // iniş noktaları ve etiketler: uzaktan bölge başına tek işaret, yakında seçili bölgenin bütün adayları
    for (const s of order) {
      const sel = s.id === selected;
      if (showCands(s)) drawCands(s, line);
      else {
        const p = sel && pick ? pick : s, px = sx(p.ps_km[0]), py = sy(p.ps_km[1]);
        ctx.strokeStyle = sel ? '#fff' : line; ctx.lineWidth = sel ? 2 : 1.2;
        diamond(px, py, sel ? 6 : 3.5); ctx.stroke();
        if (sel) { ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI * 2); ctx.stroke(); }
      }
      const bb = bboxOf(s.reg.polygon_ps_km), anchor = LABEL_ANCHOR[s.id] || 'tl';
      const label = sel || kk > 3.2 ? s.reg.code + ' · ' + s.region.toLocaleUpperCase(LOCALE) : s.reg.code;
      ctx.font = (sel ? '700 16px' : '600 14px') + ' "Barlow Condensed", sans-serif';
      let lx, ly;
      if (anchor === 'br') { ctx.textAlign = 'right'; ctx.textBaseline = 'top'; lx = sx(bb.x1); ly = sy(bb.y0) + 4; }
      else if (anchor === 'tr') { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; lx = sx(bb.x1); ly = sy(bb.y1) - 3; }
      else { ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; lx = sx(bb.x0); ly = sy(bb.y1) - 3; }
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.strokeText(label, lx, ly);
      ctx.fillStyle = sel ? '#fff' : line; ctx.fillText(label, lx, ly);
    }
    // ölçek çubuğu
    const barKm = [200, 100, 50, 20, 10, 5, 2, 1, 0.5].find((v) => v * kk < 150) || 0.5;
    ctx.strokeStyle = line; ctx.fillStyle = line; ctx.lineWidth = 1.2;
    const bx = 14, by = 20;
    ctx.beginPath(); ctx.moveTo(bx, by - 4); ctx.lineTo(bx, by); ctx.lineTo(bx + barKm * kk, by); ctx.lineTo(bx + barKm * kk, by - 4); ctx.stroke();
    ctx.font = '500 11px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(Fmt.num(barKm, barKm < 1 ? 1 : 0) + ' km', bx, by + 4);
    $('mapCands').hidden = !(selS && selS.cands.length > 1);
    $('mapPick').hidden = !(pick && pick.sens);
  }

  // harita açıklaması: ısı haritasının ölçeği ve nokta işaretleri (yalnız aday verisi olan bölgede)
  function renderLegend() {
    const s = cur(), el = $('mapLegend');
    el.hidden = !(s && s.heat);
    if (el.hidden || el.dataset.done) return;
    el.dataset.done = '1';
    el.innerHTML = `<span class="lg-h">${esc(t('cand.legendHeat'))}</span>
      <span class="lg-ramp"><small>${Fmt.pct(0, 0)}</small><i></i><small>${Fmt.pct(100, 0)}</small></span>
      <span class="lg-k"><i class="dot full"></i>${esc(t('cand.legendFull'))}</span>
      <span class="lg-k"><i class="dot"></i>${esc(t('cand.legendNum'))}</span>
      <span class="lg-k"><i class="dia"></i>${esc(t('cand.legendLegacy'))}</span>`;
  }

  function hit(px, py) {
    const x = view.cx + (px - dims.w / 2) / k(), y = view.cy - (py - dims.h / 2) / k();
    let best = null;
    for (const s of idx.sites) {
      const poly = s.reg.polygon_ps_km;
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [xi, yi] = poly[i], [xj, yj] = poly[j];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      const near = Math.hypot(s.ps_km[0] - x, s.ps_km[1] - y) * k() < 12;
      if ((inside || near) && (!best || s.reg.area_km2 < best.reg.area_km2)) best = s;
    }
    return best;
  }
  // fareye en yakın aday (9 px içinde); yalnız adaylar çizilirken
  function hitCand(px, py) {
    const s = cur();
    if (!showCands(s)) return null;
    let best = null, bd = 9;
    for (const c of s.cands) {
      const d = Math.hypot(sx(c.ps_km[0]) - px, sy(c.ps_km[1]) - py);
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }

  // adayın üç rakamı ve NASA değeri: fareyle üstüne gelince (ya da aday çubuğunda)
  function setHoverCand(c, px, py) {
    const tip = $('mapTip');
    if (c !== hoverCand) {
      hoverCand = c;
      if (c) {
        tip.innerHTML = `<b>${esc(candName(c))}</b><span class="tip-trio">${trio(c)}</span>`
          + (c.nasaSun != null ? `<span>${esc(t('cand.nasaShort', { sun: Fmt.pct(c.nasaSun) }))}</span>` : '')
          + `<small>${esc(t(c.landable ? 'cand.tipLand' : 'cand.tipNoPack'))}</small>`;
      }
      tip.hidden = !c;
      draw();
    }
    if (c && px != null) {
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = clamp(px + 14 + tw > dims.w ? px - 14 - tw : px + 14, 4, Math.max(4, dims.w - tw - 4)) + 'px';
      tip.style.top = clamp(py + 14 + th > dims.h ? py - 14 - th : py + 14, 4, Math.max(4, dims.h - th - 4)) + 'px';
    }
  }

  function bindMap() {
    let drag = null;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); drag = { x, y, cx: view.cx, cy: view.cy, moved: false }; });
    cv.addEventListener('pointermove', (e) => {
      const [x, y] = pos(e);
      if (drag) {
        if (Math.hypot(x - drag.x, y - drag.y) > 4) drag.moved = true;
        if (drag.moved) { autoFit = false; setHoverCand(null); goal.cx = view.cx = drag.cx - (x - drag.x) / k(); goal.cy = view.cy = drag.cy + (y - drag.y) / k(); draw(); }
      } else {
        const c = hitCand(x, y);
        setHoverCand(c, x, y);
        const s = c ? null : hit(x, y), id = s ? s.id : null;
        cv.style.cursor = c || (id && id !== selected) ? 'pointer' : '';
        if (id !== hover) { hover = id; draw(); }
      }
    });
    cv.addEventListener('pointerup', (e) => {
      const [x, y] = pos(e);
      if (drag && !drag.moved) {
        const c = hitCand(x, y);
        if (c) pickCand(c);
        else { const s = hit(x, y); if (s && s.id !== selected) select(s.id, { scroll: true, zoom: true }); }
      }
      drag = null;
    });
    cv.addEventListener('pointercancel', () => { drag = null; });
    cv.addEventListener('pointerleave', () => { if (!drag) setHoverCand(null); });
    cv.addEventListener('wheel', (e) => {
      e.preventDefault();
      const [x, y] = pos(e);
      const wx = view.cx + (x - dims.w / 2) / k(), wy = view.cy - (y - dims.h / 2) / k();
      autoFit = false;
      const span = clamp(view.span * Math.exp(e.deltaY * 0.0015), SPAN_MIN, 700);
      view.span = goal.span = span;
      goal.cx = view.cx = wx - (x - dims.w / 2) / k(); goal.cy = view.cy = wy + (y - dims.h / 2) / k();
      setHoverCand(null);
      draw();
    }, { passive: false });
    $('mapFit').onclick = () => fitAll(false);
    $('mapCands').onclick = zoomCands;
    $('mapPick').onclick = zoomPick;
    new ResizeObserver(() => { dims = fitCanvas(cv); if (autoFit) fitAll(true); else draw(); }).observe(cv);
  }

  function bindCandBar() {
    const bar = $('candBar'), at = (e) => { const b = e.target.closest('.cand'), s = cur(); return b && s ? s.cands[Number(b.dataset.i)] : null; };
    bar.addEventListener('click', (e) => { const c = at(e); if (c) pickCand(c); });
    // çubukta gezinirken haritadaki nokta da işaretlensin
    bar.addEventListener('pointerover', (e) => { const c = at(e); if (c) { hoverCand = c; $('mapTip').hidden = true; draw(); } });
    bar.addEventListener('pointerleave', () => { hoverCand = null; draw(); });
  }

  function init(index, callbacks) {
    idx = index; cb = callbacks || {};
    cv = $('mapCanvas'); ctx = cv.getContext('2d');
    cv.setAttribute('aria-label', t('brief.mapAlt'));
    renderSortBar(); renderCards();
    // karta tıklayınca harita o bölgeye yaklaşır: ısı haritası ve adaylar görünür
    $('cards').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) select(c.dataset.id, { zoom: true }); });
    $('btnLand').addEventListener('click', () => { if (pick && pick.landable && cb.onLand) cb.onLand(pick); });
    bindMap(); bindCandBar(); bindWeights();
    const bd = $('bDate');
    bd.min = Fmt.toInput(0); bd.max = Fmt.toInput(idx.hours - 1);
    bd.onchange = () => { const h = Fmt.fromInput(bd.value); if (h != null && cb.onDate) cb.onDate(clamp(h, 0, idx.hours - 1)); syncDate(); };
    syncDate();
    dims = fitCanvas(cv);
    fitAll(true);
    select(sorted()[0].id);
    new ResizeObserver(drawStrips).observe($('cards'));
    setTimeout(preloadStrips, 500);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  }

  return { init, select, pickCand, zoomTo, fitAll, draw, syncDate, get selected() { return selected; }, get pick() { return pick; } };
})();

// ===== compare: senaryo karşılaştırma ekranı (en fazla 3 sütun; 3D ve iniş sekansı olmadan) =====
// Senaryo = iniş noktası + iniş tarihi + anten payı. Batarya ayarları senaryoya dahil değildir.
// Her sütun, inişten sonraki pencereyi (14 / 30 / 90 gün) Sim.windowStats ile özetler; şeritler inişe hizalıdır.
const Compare = (() => {
  const MAX = 3, LETTERS = 'ABC', WINDOWS = [14, 30, 90];
  const ROW = 15, GAP = 4, RULER = 16, PADX = 1;
  let S, cb, list = [], win = 30, showDiff = true, shift = 14, token = 0, results = [], hoverOff = null;

  const save = () => Store.set('cmp', list.map((x) => ({ id: x.id, ms: Fmt.hourToDate(x.hour).getTime(), mask: x.mask })));
  const siteOf = (id) => { for (const s of S.index.sites) for (const c of s.cands) if (c.id === id) return c; return null; };
  const nameOf = (c) => (c.legacy ? t('cand.legacy') : t('cand.title', { n: c.rank }));
  const letter = (i) => LETTERS[i];

  function init(state, callbacks) {
    S = state; cb = callbacks;
    // önceki oturumdan kalan senaryolar: yalnız bu veride karşılığı olanlar
    list = Store.get('cmp', []).map((x) => ({ id: x.id, hour: Math.round(Fmt.hourOfMs(x.ms)), mask: x.mask }))
      .filter((x) => { const c = siteOf(x.id); return c && c.landable && x.hour >= 0 && x.hour < S.index.hours; }).slice(0, MAX);
    const seg = $('cmpWin');
    seg.setAttribute('aria-label', t('cmp.window'));
    seg.innerHTML = WINDOWS.map((d) => `<button type="button" data-v="${d}" aria-pressed="${d === win}">${esc(t('cmp.days', { n: d }))}</button>`).join('');
    seg.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; win = Number(b.dataset.v); seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render(); };
    $('cmpDiff').onchange = (e) => { showDiff = e.target.checked; paint(); };
    $('cmpClear').onclick = () => { list = []; save(); count(); render(); };
    $('cmpBack').onclick = () => cb.close();
    const cols = $('cmpCols');
    cols.addEventListener('click', onClick);
    cols.addEventListener('change', onChange);
    cols.addEventListener('pointermove', onMove);
    cols.addEventListener('pointerleave', () => { hoverOff = null; drawAll(); readAll(); });
    new ResizeObserver(() => { if (!$('cmpScene').hidden) drawAll(); }).observe(cols);
    count();
  }

  // üstteki kalıcı "Karşılaştır (n)" tuşları
  function count() {
    document.querySelectorAll('[data-cmp-open]').forEach((b) => {
      b.querySelector('span').textContent = t('cmp.open', { n: list.length });
      b.classList.toggle('has', list.length > 0);
    });
  }

  // o anki nokta + tarih + anten payını sabitle. Dönen: { ok, letter } ya da { ok: false, reason }
  function add(site, hour, mask) {
    if (!site) return { ok: false, reason: t('cmp.noSite') };
    if (!site.landable) return { ok: false, reason: t('cmp.noPackShort') };
    if (list.length >= MAX) return { ok: false, reason: t('cmp.full', { n: MAX }) };
    hour = clamp(Math.round(hour), 0, S.index.hours - 1);
    if (list.some((x) => x.id === site.id && x.hour === hour && x.mask === mask)) return { ok: false, reason: t('cmp.dup') };
    list.push({ id: site.id, hour, mask });
    save(); count();
    if (!$('cmpScene').hidden) render();
    return { ok: true, letter: letter(list.length - 1) };
  }

  function open() {
    setText($('cmpBackL'), t(S.prevScene === 'cockpit' && S.data ? 'cmp.backCockpit' : 'top.back'));
    render();
  }

  // ---------- hesap ----------
  async function render() {
    const my = ++token;
    count();
    $('cmpClear').disabled = !list.length;
    if (!list.length) { results = []; paint(); return; }
    setText($('cmpSummary'), t('app.loading'));
    try {
      const out = [];
      for (const sc of list) {
        const site = siteOf(sc.id), core = await cb.core(sc.id);
        out.push({ sc, site, core, st: Sim.windowStats(core, sc.hour, win * 24, sc.mask) });
      }
      if (my !== token) return;
      results = out;
      paint();
    } catch (e) {
      console.error(e);
      if (my === token) setText($('cmpSummary'), t('app.loadError', { msg: e.message }));
    }
  }

  // satırlar: [anahtar, değer, büyük olan mı iyi, birim]
  const ROWS = [
    ['sun', (st) => st.sunPct, true, 'pct'],
    ['earth', (st) => st.earthPct, true, 'pct'],
    ['both', (st) => st.bothPct, true, 'pct'],
    ['dark', (st) => st.longestDarkH / 24, false, 'day'],
    ['gap', (st) => st.longestGapH / 24, false, 'day'],
  ];
  const fmtV = (v, unit) => (unit === 'pct' ? Fmt.pct(v) : Fmt.days(v));
  const fmtD = (d, unit) => (Math.abs(d) < 0.05 ? '=' : (d > 0 ? '+' : '−') + Fmt.num(Math.abs(d), 1) + (unit === 'pct' ? '' : ' ' + t('unit.day')));

  // tek cümlelik özet: ortak pencerede (Güneş + Dünya) kim önde, en uzun karanlık nasıl değişiyor
  function summary() {
    if (!results.length) return t('cmp.empty');
    if (results.length === 1) return t('cmp.one');
    const both = results.map((r) => r.st.bothPct);
    let best = 0;
    both.forEach((v, i) => { if (v > both[best]) best = i; });
    let ref = 0;
    if (best === 0) { ref = 1; both.forEach((v, i) => { if (i && v > both[ref]) ref = i; }); }
    const d = both[best] - both[ref];
    if (d < 0.05) return t('cmp.sumTie', { v: Fmt.pct(both[best]) });
    const dd = (results[best].st.longestDarkH - results[ref].st.longestDarkH) / 24;
    const dark = Math.abs(dd) < 0.05 ? t('cmp.sumDarkSame') : t(dd < 0 ? 'cmp.sumDarkShorter' : 'cmp.sumDarkLonger', { v: Fmt.num(Math.abs(dd), 1) });
    return t('cmp.sumLead', { a: letter(best), bFrom: t('cmp.from')[letter(ref)], v: Fmt.num(d, 1), av: Fmt.pct(both[best]), bv: Fmt.pct(both[ref]) }) + ' ' + dark;
  }

  function landingHTML(st, sc) {
    const L = st.landing, out = [];
    const rel = (v) => t(v >= 0 ? 'geo.above' : 'geo.below', { v: Fmt.num(Math.abs(v), 2) });
    const until = (h) => (h == null ? t('cmp.noChange') : Fmt.dur(h));
    out.push(`<div>${icon('sun', 'sun')}<span>${esc(t('cmp.landSun', { rel: rel(L.sunMargin), disc: Fmt.pct0(L.disc * 100) }))}<br>${esc(t(L.sunUp ? 'cmp.toDark' : 'cmp.toLight', { d: until(L.sunChangeH) }))}</span></div>`);
    out.push(`<div>${icon('earth', 'earth')}<span>${esc(t('cmp.landEarth', { rel: rel(L.earthMargin), s: t(L.linkUp ? 'comm.linkUp' : 'comm.linkDown').toLocaleLowerCase(LOCALE), m: Fmt.num(sc.mask, 1) }))}<br>${esc(t(L.linkUp ? 'cmp.toLoss' : 'cmp.toLink', { d: until(L.linkChangeH) }))}</span></div>`);
    return out.join('');
  }

  function paint() {
    setText($('cmpSummary'), summary());
    const n = results.length;
    const vals = ROWS.map(([, f]) => results.map((r) => f(r.st)));
    const bestOf = ROWS.map(([, , hi], k) => (n > 1 ? (hi ? Math.max(...vals[k]) : Math.min(...vals[k])) : null));
    const cols = results.map((r, i) => {
      const { sc, site, st } = r;
      const rows = ROWS.map(([key, , , unit], k) => {
        const v = vals[k][i], best = bestOf[k] != null && Math.abs(v - bestOf[k]) < 0.05;
        const diff = showDiff && i > 0 ? `<i class="x-d">${esc(fmtD(v - vals[k][0], unit))}</i>` : '';
        return `<div class="x-row${best ? ' best' : ''}" title="${esc(t('cmp.rowTitle.' + key))}"><span>${icon({ sun: 'sun', earth: 'earth', both: 'both', dark: 'dark', gap: 'cut' }[key])}${esc(t('cmp.row.' + key))}<small class="per"> · ${esc(t('cmp.rowPeriod', { n: win }))}</small></span><span class="x-v"><b>${fmtV(v, unit)}</b>${diff}</span></div>`;
      }).join('');
      const clip = st.clipped ? `<p class="x-clip">${icon('warn')}<span>${esc(t('cmp.clipped', { got: Fmt.num((st.end - st.start) / 24, 1), want: win, end: Fmt.date(S.index.hours - 1, true) }))}</span></p>` : '';
      return `<article class="x-col panel" data-i="${i}" title="${esc(t('cmp.openTitle'))}">
        <header class="x-ch"><span class="x-let">${letter(i)}</span>
          <div class="x-id"><b>${esc(site.reg.code)} · ${esc(site.region)}</b><small>${esc(nameOf(site))} · ${esc(Fmt.latlon(site.lat, site.lon))}</small></div>
          <button type="button" class="btn btn-sm x-rm" data-act="rm" aria-label="${esc(t('cmp.remove'))}" title="${esc(t('cmp.remove'))}">${icon('cut')}</button></header>
        <div class="x-when"><label class="datefield"><span>${esc(t('cmp.landing'))}</span><input type="datetime-local" class="x-date" step="3600" min="${Fmt.toInput(0)}" max="${Fmt.toInput(S.index.hours - 1)}" value="${Fmt.toInput(sc.hour)}"><small>${esc(t('top.utc'))}</small></label>
          <small class="x-mask">${esc(t('cmp.mask', { v: Fmt.num(sc.mask, 1) }))}</small></div>
        <div class="x-rows">${rows}</div>
        <div class="x-land"><p class="x-lh">${esc(t('cmp.atLanding'))}</p>${landingHTML(st, sc)}</div>
        ${clip}
        <div class="x-strips"><div class="x-sl" aria-hidden="true"><span>${icon('sun', 'sun')}</span><span>${icon('earth', 'earth')}</span><span>${icon('both', 'both')}</span></div><canvas class="x-cv" role="img" aria-label="${esc(t('cmp.stripAlt', { k: letter(i) }))}"></canvas></div>
        <p class="x-read"></p>
        <footer class="x-foot2">
          <span class="x-copy"><span>${esc(t('cmp.copy'))}</span><button type="button" class="btn btn-sm" data-act="copy" data-sign="-1">−</button><input type="number" class="x-n" min="1" max="365" step="1" value="${shift}" aria-label="${esc(t('cmp.copyN'))}"><span>${esc(t('unit.day'))}</span><button type="button" class="btn btn-sm" data-act="copy" data-sign="1">+</button></span>
          <button type="button" class="btn btn-sm" data-act="open">${esc(t('cmp.openCockpit'))}</button>
        </footer>
      </article>`;
    });
    if (n < MAX) cols.push(`<article class="x-col x-empty panel"><p>${esc(t(n ? 'cmp.slot' : 'cmp.empty'))}</p><p class="sub">${esc(t('cmp.how'))}</p></article>`);
    $('cmpCols').innerHTML = cols.join('');
    $('cmpCols').dataset.n = String(cols.length);
    setText($('cmpFoot'), t('cmp.foot', { h: Fmt.num(S.height, 0) }));
    drawAll(); readAll();
  }

  // ---------- şeritler: Güneş (disk oranı), Dünya (bağlantı), ikisi birlikte; x ekseni = inişten sonraki süre ----------
  function drawOne(cv, r) {
    const f = fitCanvas(cv), c = cv.getContext('2d'), m = r.st.model, a0 = r.st.start, span = win * 24;
    const W = f.w - 2 * PADX, cols = Math.max(1, Math.round(W));
    c.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
    c.clearRect(0, 0, f.w, f.h);
    const colors = [cssVar('--sun'), cssVar('--earth'), cssVar('--both')], rows = [0, ROW + GAP, 2 * (ROW + GAP)];
    c.fillStyle = '#171b1c';
    rows.forEach((y) => c.fillRect(PADX, y, W, ROW));
    for (let px = 0; px < cols; px++) {
      const a = a0 + Math.floor((px / cols) * span), b = Math.max(a + 1, a0 + Math.floor(((px + 1) / cols) * span));
      if (a >= r.st.end) break;
      let s = 0, e = 0, k = 0, cnt = 0;
      for (let i = a; i < Math.min(b, r.st.end); i++) { s += m.sunFrac[i]; e += m.linkUp[i]; k += m.both[i]; cnt++; }
      [s / cnt, e / cnt, k / cnt].forEach((v, j) => { if (v > 0.003) { c.globalAlpha = 0.25 + 0.75 * v; c.fillStyle = colors[j]; c.fillRect(PADX + px, rows[j], 1.05, ROW); } });
    }
    c.globalAlpha = 1;
    // veri sonunu aşan kısım: taralı
    if (r.st.clipped) {
      const xc = PADX + ((r.st.end - a0) / span) * W, hgt = 3 * ROW + 2 * GAP;
      c.save(); c.beginPath(); c.rect(xc, 0, PADX + W - xc, hgt); c.clip();
      c.fillStyle = '#0a0c0d'; c.fillRect(xc, 0, W, hgt);
      c.strokeStyle = cssVar('--rule-2'); c.lineWidth = 1;
      for (let x = xc - hgt; x < PADX + W; x += 6) { c.beginPath(); c.moveTo(x, hgt); c.lineTo(x + hgt, 0); c.stroke(); }
      c.restore();
    }
    // gün cetveli: inişten sonraki gün sayısı
    const ry = 3 * ROW + 2 * GAP + 2, every = win <= 14 ? 2 : win <= 30 ? 5 : 15, minor = win <= 30 ? 1 : 5;
    c.font = '500 10.5px "IBM Plex Mono", monospace'; c.textBaseline = 'top'; c.fillStyle = cssVar('--ink-2');
    for (let dday = 0; dday <= win; dday += minor) {
      const x = Math.round(PADX + (dday / win) * W) + 0.5, lab = dday % every === 0;
      c.strokeStyle = lab ? 'rgba(201,210,205,0.55)' : 'rgba(201,210,205,0.25)';
      c.beginPath(); c.moveTo(x, ry - 1); c.lineTo(x, ry + (lab ? 5 : 2)); c.stroke();
      if (lab) { c.textAlign = dday === 0 ? 'left' : dday === win ? 'right' : 'center'; c.fillText(dday === 0 ? t('cmp.day0') : '+' + dday, x + (dday === 0 ? 2 : dday === win ? -2 : 0), ry + 5); }
    }
    // imleç (bütün sütunlarda aynı "inişten sonraki süre")
    if (hoverOff != null) {
      const x = PADX + (hoverOff / span) * W;
      c.fillStyle = cssVar('--ink'); c.fillRect(x - 0.75, -1, 1.5, 3 * ROW + 2 * GAP + 2);
    }
  }
  function drawAll() {
    document.querySelectorAll('#cmpCols .x-cv').forEach((cv) => { const r = results[Number(cv.closest('.x-col').dataset.i)]; if (r) drawOne(cv, r); });
  }
  // fareyle okuma: o sütunun tarihi/saati ve o andaki durum
  function readAll() {
    document.querySelectorAll('#cmpCols .x-col[data-i]').forEach((col) => {
      const r = results[Number(col.dataset.i)], el = col.querySelector('.x-read');
      if (!r) return;
      if (hoverOff == null) { el.textContent = t('cmp.readHint'); el.classList.add('hint'); return; }
      el.classList.remove('hint');
      const h = r.st.start + Math.round(hoverOff), m = r.st.model;
      if (h >= r.st.end) { el.textContent = t('cmp.readNoData'); return; }
      el.textContent = [
        Fmt.date(h, true) + ' ' + Fmt.time(h) + ' ' + t('top.utc'),
        t('cmp.readDay', { d: Fmt.num(hoverOff / 24, 1) }),
        t('tip.sun', { v: Fmt.pct0(m.sunFrac[h] * 100) }),
        t(m.linkUp[h] ? 'tip.link' : 'tip.noLink') + ' (' + Fmt.deg(m.margin[h], 1) + ')',
      ].join(' · ');
    });
  }
  function onMove(e) {
    const cv = e.target.closest('.x-cv');
    if (!cv) { if (hoverOff != null) { hoverOff = null; drawAll(); readAll(); } return; }
    const r = cv.getBoundingClientRect();
    hoverOff = clamp(((e.clientX - r.left - PADX) / Math.max(1, r.width - 2 * PADX)) * win * 24, 0, win * 24 - 1);
    drawAll(); readAll();
  }

  // ---------- sütun eylemleri ----------
  function onClick(e) {
    const col = e.target.closest('.x-col[data-i]');
    if (!col) return;
    const i = Number(col.dataset.i), r = results[i], btn = e.target.closest('[data-act]');
    if (!r) return;
    if (btn && btn.dataset.act === 'rm') { list.splice(i, 1); save(); render(); return; }
    if (btn && btn.dataset.act === 'copy') {
      const nEl = col.querySelector('.x-n'), nDays = clamp(Math.round(Number(nEl.value) || 0), 1, 365);
      shift = nDays;
      const h = r.sc.hour + Number(btn.dataset.sign) * nDays * 24, why = col.querySelector('.x-read');
      if (h < 0 || h > S.index.hours - 1) { why.textContent = t('cmp.copyOut'); return; }
      const res = add(r.site, h, r.sc.mask);
      if (!res.ok) why.textContent = res.reason;
      return;
    }
    // sütuna tıklamak (alan ve tuşlar dışında) ya da "Kokpitte aç": senaryoyu kokpitte açar
    if ((btn && btn.dataset.act === 'open') || !e.target.closest('button, input, label, canvas, select')) cb.land(r.site, { hour: r.sc.hour, mask: r.sc.mask, skip: true });
  }
  function onChange(e) {
    const col = e.target.closest('.x-col[data-i]');
    if (!col) return;
    const i = Number(col.dataset.i);
    if (e.target.classList.contains('x-date')) {
      const h = Fmt.fromInput(e.target.value);
      if (h == null) return;
      list[i].hour = clamp(Math.round(h), 0, S.index.hours - 1);
      save(); render();
    } else if (e.target.classList.contains('x-n')) shift = clamp(Math.round(Number(e.target.value) || 14), 1, 365);
  }

  return { init, add, open, render, get count() { return list.length; }, get list() { return list; }, get results() { return results; } };
})();

// ===== descent: iniş sekansı (kamera alçalır, HUD panelleri sırayla açılır) =====
const Descent = (() => {
  const DUR = 9; // saniye
  let active = false, timers = [], handle = null, finish = null;

  const fmtAlt = (m) => (m >= 1000 ? Fmt.num(m / 1000, m >= 20000 ? 0 : 1) + ' ' + t('unit.km') : Math.round(m) + ' ' + t('unit.m'));

  // o: { name, linkUp, use3d } → Promise (bitince ya da atlanınca çözülür)
  function play(o) {
    const cp = $('cockpit'), box = $('descent'), log = $('dLog');
    const panels = [...cp.querySelectorAll('[data-boot]')].sort((a, b) => a.dataset.boot - b.dataset.boot);
    active = true;
    cp.dataset.boot = 'seq';
    panels.forEach((p) => p.classList.remove('on'));
    log.innerHTML = '';
    box.hidden = false;
    setText($('dAlt'), o.use3d ? fmtAlt(120000) : '—');
    const say = (key, vars) => { const li = document.createElement('li'); li.textContent = t(key, vars); log.appendChild(li); };
    const open = (n) => panels.filter((p) => Number(p.dataset.boot) <= n).forEach((p) => p.classList.add('on'));
    const k = o.use3d ? 1 : 0.35; // 3D yoksa kısa tut
    const at = (sec, fn) => timers.push(setTimeout(fn, sec * k * 1000));

    return new Promise((resolve) => {
      finish = () => {
        if (!active) return;
        active = false;
        timers.forEach(clearTimeout); timers = [];
        panels.forEach((p) => p.classList.add('on'));
        cp.dataset.boot = 'done';
        box.hidden = true;
        handle = null;
        resolve();
      };
      say('descent.s1', { name: o.name });
      at(2.2, () => say('descent.s2'));
      at(4.6, () => { say('descent.s3'); open(2); });
      at(5.8, () => { say('descent.s4'); open(3); });
      at(7.0, () => { say(o.linkUp ? 'descent.s5up' : 'descent.s5down'); open(5); });
      at(8.1, () => { say('descent.s6'); open(6); });
      if (o.use3d) handle = Scene.startDescent(DUR - 0.6, (alt) => setText($('dAlt'), fmtAlt(alt)), () => {});
      at(DUR, finish);
    });
  }

  function skip() {
    if (!active) return;
    if (handle) handle.skip();
    if (finish) finish();
  }

  return { play, skip, get active() { return active; } };
})();

// ===== tour: otomatik tur (kendi kendine oynayan demo; altyazılar veriden doldurulur) =====
const Tour = (() => {
  let active = false, timer = 0, later = 0, idx = 0, steps = [], S = null, act = null, saved = null;

  function build() {
    // altyazıdaki rakamlar kokpitle aynı dönemden: seçili yılın canlı hesabı (düz ufuk kartıyla aynı değerler)
    const D = S.D, feed = D.feed, fv = HUD.flatVsTerrain();
    // tur, iniş anından sonraki bir yıl içinde gezer
    const L = S.landing, end = Math.min(S.data.series.n - 7, L + 8760);
    const rise = feed.find((e) => e.k === 'sun_on' && e.hour > L + 60) || { hour: Math.min(L + 240, end) };
    const longDark = D.sunRuns.filter((r) => !r.on && r.start >= L && r.start < end).reduce((a, b) => (b.len > a.len ? b : a), { start: L, len: 0 });
    // kanıt anı: gerçek arazide Güneş tam görünürken düz ufuk hesabının "battı" dediği bir saat
    const se = S.data.series;
    let proof = -1;
    for (let i = L + 240; i < end && proof < 0; i++) if (se.sunFrac[i] > 0.95 && se.sunAlt[i] < -0.45 && se.sunFrac[i + 6] > 0.95 && se.sunAlt[i + 6] < -0.45) proof = i + 3;
    const cam = Scene.cam || { az: 0 };
    const view = (v) => { if (S.has3d) act.setView(v); };
    const play = (speed) => { act.setSpeed(speed); act.setPlaying(true); };
    return [
      { dur: 7, cap: t('tour.s1', { name: S.site.region }), run() {
        act.setFlat(false); view('orbit'); act.seek(rise.hour + 30); play(24);
        Scene.tween({ az: cam.az + 0.9, pol: 0.95, dist: 9000 }, 6.5);
      } },
      { dur: 9, cap: t('tour.s2'), run() {
        view('astro'); act.seek(rise.hour - 1); play(1);
        const now = Sim.at(S.data, D.model, rise.hour + 3);
        if (S.view === 'pano') Pano.lookAt(now.sunAz); else { Scene.lookAt(now.sunAz, now.sunAlt); Scene.tweenLook(now.sunAz, now.sunAlt, 11, 6); }
      } },
      { dur: 7, cap: t('tour.s3', { earth: Fmt.pctLoc(D.stats.earthPct) }), run() {
        play(24);
        const now = Sim.at(S.data, D.model, S.t);
        if (S.view === 'pano') Pano.lookAt(now.earthAz); else Scene.tweenLook(now.earthAz, Math.max(now.earthAlt, 3), 26, 2.5);
      } },
      { dur: 9, cap: t(D.batt.deadHour >= 0 ? 'tour.s4dead' : 'tour.s4alive', {
        dark: Fmt.days(longDark.len / 24), cap: Fmt.num(S.batt.cap, 0), n: Math.floor((D.batt.deadHour - D.batt.start) / 24) + 1 }), run() {
        view('orbit'); act.seek(Math.max(L, longDark.start - 60)); play(24);
        Scene.tween({ az: cam.az - 0.7, pol: 1.05, dist: 6500 }, 8);
      } },
      { dur: 8, cap: t('tour.s5', { flat: Fmt.pct(fv.flat.sunPct), real: Fmt.pct(fv.terrain.sunPct), y: S.year }), run() {
        act.setPlaying(false); view('orbit');
        if (proof >= 0) act.seek(proof);
        Scene.tween({ pol: 1.2, dist: 1500 }, 2);
        later = setTimeout(() => { if (active) act.setFlat(true); }, 2200);
      } },
      { dur: 5, cap: t('tour.s6'), run() { act.setFlat(false); Scene.tween({ pol: 1.1, dist: 3200 }, 4); } },
    ];
  }

  function show() {
    const st = steps[idx];
    setText($('tourCap'), st.cap);
    setText($('tourStep'), t('tour.step', { i: idx + 1, n: steps.length }));
    st.run();
    timer = setTimeout(() => { idx++; if (idx < steps.length) show(); else stop(); }, st.dur * 1000);
  }

  function start(state, actions) {
    if (active) return;
    S = state; act = actions;
    saved = { t: S.t, speed: S.speed };
    active = true; idx = 0; steps = build();
    $('tour').hidden = false;
    $('cockpit').dataset.tour = 'on';
    setText($('tourBtnLabel'), t('tour.stop'));
    show();
  }

  function stop() {
    if (!active) return;
    active = false;
    clearTimeout(timer); clearTimeout(later);
    $('tour').hidden = true;
    $('cockpit').dataset.tour = 'off';
    setText($('tourBtnLabel'), t('tour.start'));
    act.setPlaying(false); act.setFlat(false); act.setSpeed(saved.speed);
  }

  return { start, stop, toggle(state, actions) { if (active) stop(); else start(state, actions); }, get active() { return active; } };
})();

// ===== app: durum, sahne geçişleri, ana döngü =====
const App = (() => {
  // tek durum nesnesi; modüller okur, yalnız buradaki eylemler değiştirir
  const S = {
    index: null,
    site: null,       // sites.json kaydı (+ bölge)
    data: null,       // horizon + series (bütün yıllar uç uca)
    D: null,          // Sim.derive sonucu
    now: null,        // Sim.at sonucu
    t: 0, landing: 0, playing: false, speed: 24,   // saat; sayaç verinin ilk yılının 1 Ocak'ından başlar
    year: 2027, zoom: 'year',                      // özet rakamlarının ve şeridin yılı; şerit penceresi
    height: 2,                                     // gözlemci (panel/anten) yüksekliği, m
    flat: false, flatK: 0, mask: 1,
    batt: { cap: 100, panel: 2, load: 0.5 }, // örnek değerler; gerçek araç verisi değil
    unc: 0.2, risk: null,                    // tüketim ve panel gücündeki belirsizlik (±oran) ve sonucu
    view: 'orbit', simple: false, gl: false, has3d: false, sceneTried: false,
    scene: 'home', prevScene: 'home', origin: 'home', // origin: kokpite hangi ekrandan inildi (geri tuşu oraya döner)
    expert: Store.get('expert', false),
    playDescent: Store.get('descent', false), landedOnce: false, // iniş sekansı: ilk inişte oynar, sonra yalnız istenirse
  };
  let last = 0, landBusy = false;

  function loading(msg, soft) {
    const el = $('loading');
    el.hidden = !msg;
    el.classList.toggle('soft', !!soft);
    el.classList.remove('err');
    if (msg) setText($('loadingMsg'), msg);
  }

  const yearRange = (y) => [clamp(Fmt.yearStart(y), 0, S.index.hours), clamp(Fmt.yearStart(y + 1), 0, S.index.hours)];

  function recompute(animate) {
    S.D = Sim.derive(S.data, { flat: S.flat, mask: S.mask, batt: S.batt, landing: S.landing, range: yearRange(S.year) });
    S.risk = riskOf();
    S.now = Sim.at(S.data, S.D.model, S.t);
    HUD.derived(animate);
    Timeline.draw(S.D, S.batt.cap);
    SkyPlot.invalidate();
  }

  // Belirsizlik altında batarya: denemeler kapasiteye bağlı değil, o yüzden kapasite kaydırılırken yeniden koşmaz.
  let riskKey = '', riskNeed = null;
  function riskOf() {
    if (!(S.unc > 0)) return null;
    const key = [S.data.id, S.flat, S.height, S.D.batt.start, S.batt.panel, S.batt.load, S.unc].join('|');
    if (key !== riskKey) { riskKey = key; riskNeed = Sim.uncertainty(S.D.model, S.batt, S.D.batt.start, S.unc); }
    return { n: riskNeed.length, ...Sim.survival(riskNeed, S.batt.cap) };
  }

  // bir noktanın verisi, seçili gözlemci yüksekliğinin ufuk profiliyle (kokpit ve karşılaştırma ortak kullanır)
  async function core(id) {
    const entry = Data.loadSite(id), c = await entry.core;
    try { c.horizon = await entry.horizon(S.height); } catch (e) { console.warn('ufuk profili yok:', id, S.height, e); c.horizon = c.horizons[2]; }
    return c;
  }

  // 3D sahne (arazi, ufuk halkası, astronotun gözü) 2 m gözlemci içindir; başka yükseklik seçiliyken bunu sahnenin üstünde söyle
  function heightNote() {
    if (!S.has3d) return; // 3D yokken "3D açılamadı" iletisi kalsın
    HUD.message(S.height !== 2 && S.view !== 'pano' ? t('scene.heightNote', { h: Fmt.num(S.height, 0) }) : '');
  }

  function show(scene) {
    if (scene !== S.scene) S.prevScene = S.scene;
    S.scene = scene;
    $('home').hidden = scene !== 'home'; $('briefing').hidden = scene !== 'briefing'; $('cockpit').hidden = scene !== 'cockpit'; $('cmpScene').hidden = scene !== 'compare';
    $('app').dataset.scene = scene;
  }

  function applyZoom() {
    const n = S.index.hours;
    if (S.zoom === 'all') Timeline.setView(0, n - 1);
    else if (S.zoom === 'year') { const [a, b] = yearRange(S.year); Timeline.setView(a, b - 1); }
    else if (S.zoom !== 'custom') { const span = Number(S.zoom) * 24; Timeline.setView(S.t - span * 0.15, S.t + span * 0.85); }
  }

  // ---------- eylemler ----------
  const act = {
    setView(v) {
      if (!S.has3d && v !== 'pano') return;
      S.view = v;
      $('gl').hidden = v === 'pano'; $('pano').hidden = v !== 'pano';
      if (v === 'pano') { Scene.hideMarkers(); Pano.autoCenter(); } else Scene.setView(v);
      heightNote();
      HUD.controls();
    },
    setFlat(on) {
      if (S.flat === on) return;
      S.flat = on;
      Scene.setFlat(on);
      recompute(true);
      HUD.controls();
    },
    setSimple(on) { S.simple = on; PLAIN = on; HUD.controls(); HUD.derived(false); HUD.relabel(); },
    setSpeed(v) { S.speed = v; HUD.controls(); },
    setPlaying(on) {
      if (on && S.t >= S.data.series.n - 1) S.t = S.landing;
      S.playing = on; HUD.controls();
    },
    seek(h) { S.t = clamp(h, 0, S.data ? S.data.series.n - 1 : S.index.hours - 1); if (S.scene === 'cockpit') Timeline.follow(S.t); },
    nextEvent() {
      const e = S.D.feed.find((x) => x.hour > S.t + 0.01 && x.k !== 'landing');
      if (e) act.seek(e.hour);
    },
    setLandingNow() { S.landing = Math.round(S.t); recompute(false); Briefing.syncDate(); },
    // yıl seçimi: imleç ve iniş anı aynı takvim gününe, seçilen yıla taşınır
    setYear(y) {
      const d = Fmt.yearStart(y) - Fmt.yearStart(S.year), n = S.index.hours;
      S.year = y;
      S.t = clamp(S.t + d, 0, n - 1); S.landing = clamp(Math.round(S.landing + d), 0, n - 1);
      if (S.zoom !== 'all') S.zoom = S.zoom === 'custom' ? 'year' : S.zoom;
      if (S.data) { recompute(true); applyZoom(); HUD.controls(); }
      Briefing.syncDate();
    },
    setZoom(z) { S.zoom = z; applyZoom(); HUD.controls(); },
    async setHeight(h) {
      S.height = h;
      if (S.data) { S.data = await core(S.data.id); recompute(true); heightNote(); }
      HUD.controls();
    },
    setMask(v) { S.mask = Math.round(v * 10) / 10; recompute(true); },
    setBatt(key, v) { S.batt[key] = v; recompute(false); },
    setUnc(v) { S.unc = v; recompute(false); },
    applyMinCap() { if (S.D.minCap != null) act.setBatt('cap', S.D.minCap); },
    goSafeLanding() {
      const day = S.D.scan.safeDay;
      if (day < 0) return;
      S.landing = day * 24; S.t = S.landing;
      recompute(false); Timeline.follow(S.t); Briefing.syncDate();
    },
    tour() { Tour.toggle(S, act); },
    look(what) {
      if (what === 'lander') return Scene.lookLander();
      const az = what === 'sun' ? S.now.sunAz : S.now.earthAz, alt = what === 'sun' ? S.now.sunAlt : S.now.earthAlt;
      if (S.view === 'pano') Pano.lookAt(az); else Scene.lookAt(az, alt);
    },
    back() {
      Tour.stop();
      Descent.skip();
      S.playing = false;
      if (S.origin === 'briefing') { show('briefing'); Briefing.syncDate(); Briefing.fitAll(false); }
      else { show('home'); Home.returnTo(); }
    },
    openList() { Present.stop(true); show('briefing'); Briefing.syncDate(); requestAnimationFrame(() => Briefing.fitAll(true)); },
    goHome() { show('home'); Home.syncDate(); },
    setExpert(on) { S.expert = on; Store.set('expert', on); $('app').dataset.expert = on ? 'on' : 'off'; $('btnExpert').setAttribute('aria-pressed', String(on)); },
    // o anki nokta + tarih + anten payını karşılaştırmaya ekle
    addScenario(btn) {
      const inCockpit = S.scene === 'cockpit';
      const site = inCockpit ? S.site : Briefing.pick;
      const r = Compare.add(site, Math.round(inCockpit ? S.t : S.landing), S.mask);
      flash(btn, r.ok ? t('cmp.added', { k: r.letter }) : r.reason);
    },
    openCompare() { Tour.stop(); Descent.skip(); S.playing = false; show('compare'); Compare.open(); },
    closeCompare() {
      const to = S.prevScene === 'cockpit' && S.data ? 'cockpit' : S.prevScene === 'briefing' ? 'briefing' : 'home';
      show(to);
      if (to === 'briefing') Briefing.fitAll(false); else if (to === 'home') Home.syncDate();
    },
    setPlayDescent(on) { S.playDescent = on; Store.set('descent', on); },
  };

  // tuşun üstünde kısa bir geri bildirim (ör. "A olarak eklendi" ya da neden eklenemediği)
  function flash(btn, text) {
    if (!btn) return;
    const span = btn.querySelector('span') || btn;
    if (!btn.dataset.label) btn.dataset.label = span.textContent;
    span.textContent = text;
    clearTimeout(btn._flash);
    btn._flash = setTimeout(() => { span.textContent = btn.dataset.label; }, 2200);
  }

  // ---------- brifingden (ya da karşılaştırmadan) kokpite ----------
  // site: bölgenin örnek noktası ya da iniş paketi olan bir aday (kayıt biçimi aynı).
  // opt: { hour, mask, skip }: karşılaştırmadan açılan senaryo. Tarih nokta değişirken korunur.
  async function land(site, opt = {}) {
    if (landBusy) return;
    landBusy = true;
    const entry = Data.loadSite(site.id);
    try {
      const fromBrief = S.scene === 'briefing';
      if (S.scene === 'home' || S.scene === 'briefing') S.origin = S.scene;
      const bb = $('btnBack').querySelector('span');
      bb.dataset.t = S.origin === 'briefing' ? 'top.back' : 'top.backHome'; // relabel() bu anahtarı okur
      setText(bb, t(bb.dataset.t));
      const [c] = await Promise.all([core(site.id), fromBrief ? Briefing.zoomTo(site, 850) : null]);
      loading(t('app.siteLoading', { name: site.region }), true);
      S.site = site; S.data = c;
      if (opt.hour != null) { S.landing = opt.hour; S.t = opt.hour; }
      if (opt.mask != null) S.mask = opt.mask;
      S.t = clamp(S.t, 0, c.series.n - 1); S.landing = clamp(Math.round(S.landing), 0, c.series.n - 1);
      S.year = Fmt.yearOf(S.t);
      S.playing = false; S.flat = false; S.flatK = 0; S.simple = false; PLAIN = false; HUD.relabel();

      show('cockpit');

      // 3D sahne: açılmazsa ya da arazi gelmezse 2B panorama ile devam
      if (!S.sceneTried) {
        S.sceneTried = true;
        S.gl = Scene.init($('gl'), $('viewport'));
        Scene.onLost = () => { S.gl = S.has3d = false; HUD.message(t('scene.no3d')); act.setView('pano'); };
      }
      let use3d = S.gl;
      HUD.message('');
      if (use3d) {
        try {
          const terrain = await entry.terrain();
          Scene.setFlat(false, true);
          Scene.setSite({ site, sites: S.index.sites, map: S.index.map, horizon: c.horizons[2], series: c.series, terrain });
        } catch (e) {
          console.warn('arazi yüklenemedi:', e);
          use3d = false;
          HUD.message(t('scene.terrainMissing'));
        }
      } else HUD.message(t('scene.no3d'));

      HUD.site();
      recompute(false);
      if (S.zoom === 'custom') S.zoom = 'year';
      applyZoom();
      S.has3d = use3d;
      act.setView(use3d ? 'orbit' : 'pano');
      loading('');
      const play = !opt.skip && (opt.descent || S.playDescent || !S.landedOnce);
      S.landedOnce = true;
      if (play) await Descent.play({ name: site.region, linkUp: S.now.linkUp, use3d });
    } catch (e) {
      console.error(e);
      show(S.origin === 'briefing' ? 'briefing' : 'home');
      if (S.scene === 'home') Home.returnTo();
      loading(t('app.loadError', { msg: e.message }));
      $('loading').classList.add('err');
      setTimeout(() => loading(''), 6000);
    } finally {
      landBusy = false;
    }
  }

  // sahnenin HUD panelleriyle örtülmeyen kısmı (panorama eksenleri buraya çizilir)
  function insets() {
    const v = $('viewport').getBoundingClientRect(), m = $('colMid').getBoundingClientRect();
    if (m.width < 50 || m.bottom < v.top + 40 || m.top > v.bottom - 40) return { l: 0, t: 0, r: 0, b: 0 };
    return { l: Math.max(0, m.left - v.left), t: Math.max(0, m.top - v.top), r: Math.max(0, v.right - m.right), b: Math.max(0, v.bottom - m.bottom) };
  }

  // ---------- ana döngü ----------
  function frame(ts) {
    const dt = Math.min(0.1, (ts - last) / 1000 || 0);
    last = ts;
    if (S.scene === 'home') { Globe.render(dt); Home.update(); }
    if (S.scene === 'cockpit' && S.D) {
      if (S.playing && !Descent.active) {
        S.t += dt * S.speed;
        if (S.t >= S.data.series.n - 1) { S.t = S.data.series.n - 1; S.playing = false; HUD.controls(); }
        Timeline.follow(S.t);
      }
      // imleç başka bir yıla geçtiyse özet o yıla döner
      const y = Fmt.yearOf(S.t);
      if (y !== S.year && S.index.years.includes(y)) { S.year = y; recompute(false); if (S.zoom === 'year') applyZoom(); HUD.controls(); }
      const goal = S.flat ? 1 : 0;
      if (S.flatK !== goal) S.flatK = goal > S.flatK ? Math.min(1, S.flatK + dt / 0.8) : Math.max(0, S.flatK - dt / 0.8);
      S.now = Sim.at(S.data, S.D.model, S.t);
      const o = { site: S.data, now: S.now, tH: S.t, flatK: easeInOut(S.flatK), mask: S.mask, view: null };
      if (S.view === 'pano') {
        o.inset = insets();
        Pano.draw(o);
        o.view = Pano.view;
      } else {
        Scene.update(S.now);
        Scene.render(dt);
        const v = Scene.view;
        if (v.mode === 'astro') o.view = { yaw: v.yaw, hfov: 2 * Math.atan(Math.tan((v.fov * D2R) / 2) * v.aspect) / D2R };
      }
      SkyPlot.draw(o);
      HUD.tick();
      Timeline.setCursor(S.t);
    }
    requestAnimationFrame(frame);
  }

  function bindKeys() {
    document.addEventListener('keydown', (e) => {
      if (S.scene !== 'cockpit' || Descent.active || $('dataDlg').open) return;
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON' && e.code === 'Space') return;
      if (e.code === 'Space') { e.preventDefault(); act.setPlaying(!S.playing); }
      else if (e.key === 'ArrowRight') act.seek(S.t + (e.shiftKey ? 24 : 1));
      else if (e.key === 'ArrowLeft') act.seek(S.t - (e.shiftKey ? 24 : 1));
      else if (e.key === 'n' || e.key === 'N') act.nextEvent();
      else if (e.key === 'h' || e.key === 'H') { const c = $('cockpit'); c.dataset.hud = c.dataset.hud === 'off' ? 'on' : 'off'; }
      else if (e.key === 'Escape') Tour.stop();
    });
  }

  async function main() {
    applyStrings(document);
    document.documentElement.lang = LANG;
    loading(t('app.loading'));
    try {
      S.index = await Data.loadIndex();
    } catch (e) {
      $('loading').classList.add('err');
      setText($('loadingMsg'), t('app.loadError', { msg: e.message }));
      return;
    }
    S.year = S.index.defaultYear;
    S.t = S.landing = Fmt.yearStart(S.year);
    HUD.init(S, act);
    SkyPlot.init($('sky'));
    Pano.init($('pano'));
    Timeline.init(act.seek, (a, b, user) => { if (user) { S.zoom = 'custom'; HUD.controls(); } });
    $('btnSkip').onclick = Descent.skip;
    Home.init(S.index, S, {
      onLand: (site) => land(site, { descent: true }),
      onDate: (h) => { S.landing = Math.round(h); S.t = S.landing; S.year = Fmt.yearOf(S.t); Briefing.syncDate(); },
      openList: act.openList,
      // yaklaşma sürerken noktanın dosyaları iner (6 sn'lik uçuş ağ süresini örter)
      preload: (site) => { core(site.id).catch(() => {}); Data.loadSite(site.id).terrain().catch(() => {}); },
    });
    Present.init(S.index, S, { core });
    Compare.init(S, { land, core, close: act.closeCompare });
    Briefing.init(S.index, {
      state: S,
      onSelect: (site) => { if (site.landable) Data.loadSite(site.id).terrain(); },
      onLand: land,
      onDate: (h) => { S.landing = Math.round(h); S.t = S.landing; S.year = Fmt.yearOf(S.t); },
    });
    document.querySelectorAll('[data-cmp-open]').forEach((b) => { b.onclick = act.openCompare; });
    $('bAddCmp').onclick = (e) => act.addScenario(e.currentTarget);
    $('cAddCmp').onclick = (e) => act.addScenario(e.currentTarget);
    $('bHome').onclick = act.goHome;
    $('btnExpert').onclick = () => act.setExpert(!S.expert);
    act.setExpert(S.expert);
    document.querySelectorAll('[data-info]').forEach((b) => { b.onclick = () => $('dataDlg').showModal(); });
    $('chkDescent').checked = S.playDescent;
    $('chkDescent').onchange = (e) => act.setPlayDescent(e.target.checked);
    const langs = Object.keys(STRINGS), ls = $('langSel');
    if (langs.length > 1) {
      ls.hidden = false;
      ls.innerHTML = langs.map((l) => `<option value="${l}"${l === LANG ? ' selected' : ''}>${esc(STRINGS[l].langName || l)}</option>`).join('');
      ls.setAttribute('aria-label', t('langLabel'));
      ls.onchange = () => { Store.set('lang', ls.value); location.reload(); };
    }
    bindKeys();
    show('home');
    loading('');
    requestAnimationFrame(frame);
  }

  return { main, S, act, land };
})();
window.AyInis = Object.assign(App, { Scene, Briefing, Compare, Sim, Globe, Home, Present }); // konsoldan denemek için

App.main();

})();
</script>
