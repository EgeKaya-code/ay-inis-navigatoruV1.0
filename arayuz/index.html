  const hourToDate = (h) => new Date(epoch + Math.floor(h * 60 + 1e-6) * 60e3);
  const hourOfMs = (ms) => (ms - epoch) / 3600e3;
  const yearStart = (y) => (Date.UTC(y, 0, 1) - epoch) / 3600e3;
  const yearOf = (h) => hourToDate(h).getUTCFullYear();
  // <input type="datetime-local"> değeri (UTC olarak okunur/yazılır)
  const toInput = (h) => hourToDate(Math.round(h)).toISOString().slice(0, 16);
  const fromInput = (v) => { const ms = Date.parse(v + (v.length <= 10 ? 'T00:00' : '') + ':00Z'); return Number.isNaN(ms) ? null : hourOfMs(ms); };
  const p2 = (n) => String(n).padStart(2, '0');
  const date = (h, withYear) => {
    const d = hourToDate(h);
    return d.getUTCDate() + ' ' + t('months')[d.getUTCMonth()] + (withYear ? ' ' + d.getUTCFullYear() : '');
  };
  const time = (h) => { const d = hourToDate(h); return p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()); };
  const latlon = (lat, lon) =>
    num(Math.abs(lat), 2) + '° ' + (lat < 0 ? t('compass.s') : t('compass.n')) + ' · ' +
    num(Math.abs(lon), 2) + '° ' + (lon < 0 ? t('compass.w') : t('compass.e'));
  // Türkçe: "%65'inde", "%66'sında" gibi; ek sayının okunuşuna göre değişir (yalnız tr sözlüğü için).
  const trLocSuffix = (n) => {
    n = Math.round(Math.abs(n));
    const ones = ['', "'inde", "'sinde", "'ünde", "'ünde", "'inde", "'sında", "'sinde", "'inde", "'unda"];
    const tens = ['', "'unda", "'sinde", "'unda", "'ında", "'sinde", "'ında", "'inde", "'inde", "'ında"];
    if (n === 0) return "'ında";
    if (n % 10) return ones[n % 10];
    if (n % 100) return tens[(n / 10) % 10];
    return "'ünde";
  };
  const pctLoc = (v) => (LANG === 'tr' ? '%' + Math.round(v) + trLocSuffix(v) : Math.round(v) + '%');
  const pct0 = (v) => (LANG === 'tr' ? '%' + Math.round(v) : Math.round(v) + '%');
  const az = (v) => num(((v % 360) + 360) % 360, 1) + '°';
  return { num, pct, pct0, days, deg, az, dur, date, time, latlon, pctLoc, hourToDate, setEpoch, hourOfMs, yearStart, yearOf, toInput, fromInput };
})();

// "2026-01-01 to 2030-12-31 UTC, hourly" → "2026–2030"
function periodLabel(p) { const m = /(\d{4}).*?(\d{4})/.exec(p || ''); return m ? (m[1] === m[2] ? m[1] : m[1] + '–' + m[2]) : '2026–2030'; }

// sayaç gibi akan rakam
const Counter = (() => {
  const live = new WeakMap();
  function run(el, to, render, ms = 700) {
    const prev = live.get(el);
    const from = prev ? prev.cur : to;
    if (prev && prev.raf) cancelAnimationFrame(prev.raf);
    const st = { cur: from, raf: 0 };
    live.set(el, st);
    if (from === to || matchMedia('(prefers-reduced-motion: reduce)').matches) { st.cur = to; el.innerHTML = render(to); return; }
    const t0 = performance.now();
    const step = (now) => {
      const k = clamp((now - t0) / ms, 0, 1);
      st.cur = lerp(from, to, easeInOut(k));
      el.innerHTML = render(st.cur);
      if (k < 1) st.raf = requestAnimationFrame(step); else { st.cur = to; st.raf = 0; }
    };
    st.raf = requestAnimationFrame(step);
  }
  // animasyonsuz başlangıç değeri (bir sonraki run buradan akar)
  function set(el, v) { const prev = live.get(el); if (prev && prev.raf) cancelAnimationFrame(prev.raf); live.set(el, { cur: v, raf: 0 }); }
  return { run, set };
})();

function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }
function icon(name, cls) { return '<svg class="ic' + (cls ? ' ' + cls : '') + '"><use href="#i-' + name + '"/></svg>'; }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function applyStrings(root) {
  root.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  root.querySelectorAll('[data-t-title]').forEach((el) => { el.title = t(el.dataset.tTitle); });
}

// küçük dpr'li canvas yardımcıları
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}
const cssVarCache = new Map();
function cssVar(name) {
  if (!cssVarCache.has(name)) cssVarCache.set(name, getComputedStyle(document.documentElement).getPropertyValue(name).trim());
  return cssVarCache.get(name);
}

// ===== data: veri dosyalarını yükleme (tembel, önbellekli) =====
const Data = (() => {
  const BASE = 'veri/';
  const cache = new Map();
  let index = null;

  async function json(path) {
    const r = await fetch(BASE + path);
    if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
    return r.json();
  }
  function image(path) {
    return new Promise((res) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null); // harita olmadan da çalış
      im.src = BASE + path;
    });
  }

  const median = (a) => { const v = a.slice().sort((x, y) => x - y), h = v.length >> 1; return v.length % 2 ? v[h] : (v[h - 1] + v[h]) / 2; };
  const spread = (a, best) => ({ best: best(...a), median: median(a) });

  // Bir bölgenin aday noktaları (candidates.json). Her aday, kokpitin beklediği "site" kaydıyla aynı
  // biçimdedir; eski örnek nokta (legacy) sites.json kaydının kendisidir, rakamları değişmez.
  function attachCandidates(s, rc, sens) {
    const own = { regionId: s.id, legacy: true, rank: null, landable: true, nasaSun: null, nasaEarth: null };
    Object.assign(s, own, { cands: [s], heat: null });
    if (rc) {
      s.cands = rc.candidates.map((c) => (c.legacy
        ? Object.assign(s, { nasaSun: c.nasa_sun_pct, nasaEarth: c.nasa_earth_pct })
        : {
          id: c.id, regionId: s.id, region: s.region, reg: s.reg, legacy: false, rank: c.rank, landable: !!c.package,
          lat: c.lat, lon: c.lon, ps_km: c.ps_km, ground_height_m: c.ground_height_m, slope_deg: c.slope_deg,
          m: c.metrics['2m'], nasaSun: c.nasa_sun_pct, nasaEarth: c.nasa_earth_pct, search_note: null,
        }));
      if (!s.cands.includes(s)) s.cands.push(s);
      s.heat = { file: rc.heat.file, bounds: rc.heat.bounds_km, map: rc.nasa_map, image: null, asked: false };
    }
    // iniş hatası halkaları (sensitivity.json; yalnız iniş paketi olan noktalar için var)
    s.cands.forEach((c) => { c.sens = (sens && sens[c.id]) || null; });
    // Pareto: baskılanmayan noktalar; baskılananlarda en iyi baskılayan nokta
    const dom = Sim.pareto(s.cands.map((c) => c.m));
    s.cands.forEach((c, i) => { c.dominator = dom[i] < 0 ? null : s.cands[dom[i]]; c.pareto = dom[i] < 0; });
    const of = (f) => s.cands.map(f);
    s.stat = {
      n: s.cands.length,
      sun: spread(of((c) => c.m.terrain.sun_energy_pct), Math.max),
      earth1: spread(of((c) => c.m.terrain_antenna_1deg.earth_pct), Math.max),
      dark: spread(of((c) => c.m.terrain.longest_dark_days), Math.min),
      score: spread(of((c) => Sim.balanced(c.m)), Math.max),
    };
    // kart şeridi ve varsayılan sıralama için: dengeli puanı en yüksek aday
    s.top = s.cands.find((c) => c.rank === 1) || s;
  }

  // regions.json + sites.json + polar_map.png (+ varsa candidates.json: yoksa her bölge tek noktayla çalışır)
  async function loadIndex() {
    if (index) return index;
    const [reg, sites, map, cand, sens, yrs] = await Promise.all([json('regions.json'), json('sites.json'), image('polar_map.png'),
      json('candidates.json').catch(() => null), json('sensitivity.json').catch(() => null), json('years.json').catch(() => null)]);
    const byId = new Map(reg.regions.map((r) => [r.id, r]));
    const candById = new Map(cand ? cand.regions.map((r) => [r.id, r]) : []);
    index = {
      map: { image: map, bounds: reg.map.bounds_km },
      period: sites.period,
      hasCandidates: !!cand,
      sites: sites.sites.map((s) => ({ ...s, reg: byId.get(s.id), m: s.metrics['2m'] })),
    };
    index.sensRadii = sens ? sens.radii_m : [];
    // years.json: hangi yılların serisi ve hangi gözlemci yüksekliklerinin ufuk profili var (yoksa yalnız 2027 ve 2 m)
    index.years = yrs && yrs.years && yrs.years.length ? yrs.years.slice().sort() : [2027];
    index.heights = yrs && yrs.observer_heights_m ? yrs.observer_heights_m : [2];
    index.defaultYear = index.years.includes(2027) ? 2027 : index.years[0];
    index.validation = (yrs && yrs.validation) || null;
    Fmt.setEpoch(Date.UTC(index.years[0], 0, 1));
    index.hours = (Date.UTC(index.years[index.years.length - 1] + 1, 0, 1) - Date.UTC(index.years[0], 0, 1)) / 3600e3;
    index.sites.forEach((s) => attachCandidates(s, candById.get(s.id), sens ? sens.regions[s.id] : null));
    return index;
  }

  // NASA aydınlanma ısı haritası (bölge seçilince iner); gelince onReady çağrılır
  function loadHeat(s, onReady) {
    if (!s.heat || s.heat.asked) return;
    s.heat.asked = true;
    image(s.heat.file).then((im) => { s.heat.image = im; if (im && onReady) onReady(); });
  }

  const f32 = (a) => Float32Array.from(a);

  // Arazi: float32 ızgara. Artifact ikili dosya sunmadığı için önce base64 metin kopyası
  // (terrain.b64.txt, pack-terrain.mjs üretir) denenir; yoksa asıl terrain.bin okunur.
  async function terrainBuffer(dir) {
    try {
      const r = await fetch(BASE + dir + 'terrain.b64.txt');
      if (!r.ok) throw new Error('b64 yok');
      const bin = atob((await r.text()).trim());
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    } catch (e) {
      const r = await fetch(BASE + dir + 'terrain.bin');
      if (!r.ok) throw new Error('terrain.bin → HTTP ' + r.status);
      return r.arrayBuffer();
    }
  }

  const mkHorizon = (hz) => ({ step: hz.azimuth_step_deg, elev: f32(hz.elevation_deg), dist: f32(hz.distance_km), observer: hz.observer_height_m });
  const FIELDS = { sunAlt: 'sun_alt_deg', sunAz: 'sun_az_deg', sunFrac: 'sun_visible_fraction', earthAlt: 'earth_alt_deg',
    earthAz: 'earth_az_deg', earthMargin: 'earth_margin_deg', earthIllum: 'earth_illuminated_fraction' };
  const hoursIn = (y) => (Date.UTC(y + 1, 0, 1) - Date.UTC(y, 0, 1)) / 3600e3;

  // tek yılın serisi (brifingdeki mini şeritler için; kokpit bütün yılları loadSite ile alır)
  const yearCache = new Map();
  function loadYear(id, year) {
    const key = id + '|' + year;
    if (!yearCache.has(key)) {
      const p = json('sites/' + id + '/series_' + year + '.json');
      yearCache.set(key, p);
      p.catch(() => yearCache.delete(key));
    }
    return yearCache.get(key);
  }

  // bir noktanın dosyaları: ufuk profili (2 m) + eldeki bütün yılların saatlik serisi, uç uca eklenmiş.
  // Saat sayacı ilk yılın 1 Ocak 00:00 UTC'sinden başlar. Arazi ayrı bir söz (promise): gelmese de 2B kısım çalışır.
  function loadSite(id) {
    if (cache.has(id)) return cache.get(id);
    const dir = 'sites/' + id + '/';
    const core = Promise.all([json(dir + 'horizon.json'), ...index.years.map((y) => loadYear(id, y))])
      .then(([hz, ...ys]) => {
        ys.forEach((se, i) => { if (se.sun_alt_deg.length !== hoursIn(index.years[i])) throw new Error(dir + 'series_' + index.years[i] + '.json: beklenmeyen uzunluk'); });
        const n = ys.reduce((a, se) => a + se.sun_alt_deg.length, 0);
        const series = { n, start: ys[0].start_utc, observer: ys[0].observer_height_m };
        for (const k in FIELDS) {
          const out = new Float32Array(n);
          let o = 0;
          for (const se of ys) { out.set(se[FIELDS[k]], o); o += se[FIELDS[k]].length; }
          series[k] = out;
        }
        const h = mkHorizon(hz);
        return { id, horizon: h, horizons: { [h.observer]: h }, series };
      });
    // arazi yalnız istenince iner (brifingdeki mini şeritler için 9 bölgenin serisi yeter)
    let terrainP = null;
    const terrain = () => {
      if (!terrainP) {
        terrainP = Promise.all([json(dir + 'terrain.json'), terrainBuffer(dir)]).then(([meta, buf]) => ({ meta, z: new Float32Array(buf) }));
        terrainP.catch(() => { terrainP = null; });
      }
      return terrainP;
    };
    const entry = { core, terrain };
    // başka gözlemci yüksekliğinin ufuk profili (horizon_0m.json, horizon_10m.json); istenince iner
    entry.horizon = async (h) => {
      const c = await core;
      if (!c.horizons[h]) c.horizons[h] = mkHorizon(await json(dir + 'horizon_' + h + 'm.json'));
      return c.horizons[h];
    };
    cache.set(id, entry);
    core.catch(() => cache.delete(id));
    return entry;
  }

  return { loadIndex, loadSite, loadYear, loadHeat };
})();

// ===== sim: tarayıcıdaki gerçek hesap (saf fonksiyonlar, DOM yok) =====
const Sim = (() => {
  const SUN_R = 0.267;      // Güneş açısal yarıçapı (°)
  const EARTH_R = 0.95;     // Dünya açısal yarıçapı (°)
  const MERGE_H = 6;        // bundan kısa durumlar komşusuyla birleştirilir
  const LONG_DARK_H = 72;   // bundan uzun karanlıklar vurgulanır
  const DARK_CAP_DAYS = 30; // dengeli puanda karanlığın 0 puan aldığı süre

  // yarıçapı r olan diskin, düz ufkun (0°) üstünde kalan alan oranı
  function discAbove(alt, r = SUN_R) {
    if (alt >= r) return 1;
    if (alt <= -r) return 0;
    const x = alt / r;
    return 0.5 + (x * Math.sqrt(1 - x * x) + Math.asin(x)) / Math.PI;
  }

  function horizonAt(hz, az) {
    const n = hz.elev.length;
    const x = (((az % 360) + 360) % 360) / hz.step;
    const i = Math.floor(x), f = x - i;
    return hz.elev[i % n] + (hz.elev[(i + 1) % n] - hz.elev[i % n]) * f;
  }
  function horizonDistAt(hz, az) {
    const n = hz.dist.length;
    return hz.dist[Math.round((((az % 360) + 360) % 360) / hz.step) % n];
  }

  // Dosyadaki seri 2 m gözlemci için hesaplanmıştır. Başka bir gözlemci yüksekliğinin ufuk profili seçilince
  // Güneş'in görünen oranı ve Dünya payı aynı alt/az serisinden, o profille yeniden hesaplanır (Güneş ve Dünya'nın
  // yönü birkaç metrelik yükseklik farkıyla değişmez). Güneş yarıçapı burada sabit 0,267° alınır.
  function forHorizon(site, hz) {
    if (hz.observer === site.series.observer) return { sunFrac: site.series.sunFrac, margin: site.series.earthMargin };
    if (!hz.calc || hz.calc.n !== site.series.n) {
      const s = site.series, n = s.n, sunFrac = new Float32Array(n), margin = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        sunFrac[i] = discAbove(s.sunAlt[i] - horizonAt(hz, s.sunAz[i]));
        margin[i] = s.earthAlt[i] - horizonAt(hz, s.earthAz[i]);
      }
      hz.calc = { n, sunFrac, margin };
    }
    return hz.calc;
  }

  // seçilen ufuk modeli (gerçek arazi / düz) ve anten maskesi için saatlik diziler.
  // sunUp: Güneş diskinin herhangi bir kısmı görünür; both: Güneş görünür VE Dünya bağlantısı var.
  function buildModel(site, flat, mask) {
    const s = site.series, n = s.n;
    let sunFrac, margin;
    if (flat) {
      sunFrac = new Float32Array(n); for (let i = 0; i < n; i++) sunFrac[i] = discAbove(s.sunAlt[i]);
      margin = s.earthAlt;
    } else ({ sunFrac, margin } = forHorizon(site, site.horizon));
    const sunUp = new Uint8Array(n), linkUp = new Uint8Array(n), both = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      sunUp[i] = sunFrac[i] > 0 ? 1 : 0;
      linkUp[i] = margin[i] > mask ? 1 : 0;
      both[i] = sunUp[i] & linkUp[i];
    }
    return { n, flat, mask, sunFrac, margin, sunUp, linkUp, both };
  }

  function runsOf(flags) {
    const out = [];
    let start = 0;
    for (let i = 1; i <= flags.length; i++) {
      if (i === flags.length || flags[i] !== flags[start]) { out.push({ start, len: i - start, on: !!flags[start] }); start = i; }
    }
    return out;
  }

  // kısa durumları at, aynı durumdaki komşuları birleştir; sonuç yılı boşluksuz kaplar
  function mergeRuns(runs, n, minLen = MERGE_H) {
    let kept = runs.filter((r) => r.len >= minLen);
    if (!kept.length) kept = [runs.reduce((a, b) => (b.len > a.len ? b : a))];
    const out = [];
    for (const r of kept) {
      if (out.length && out[out.length - 1].on === r.on) continue;
      out.push({ start: r.start, on: r.on, len: 0 });
    }
    out[0].start = 0;
    out.forEach((r, i) => { r.len = (i + 1 < out.length ? out[i + 1].start : n) - r.start; r.open = i + 1 === out.length; });
    return out;
  }

  // [a, b) aralığında flags'in 0 olduğu en uzun kesintisiz süre (saat)
  function longestOff(flags, a = 0, b = flags.length) {
    let run = 0, best = 0;
    for (let i = a; i < b; i++) { if (!flags[i]) { run++; if (run > best) best = run; } else run = 0; }
    return best;
  }

  // [a, b) saat aralığının özeti. sunPct: Güneş diskinin herhangi bir kısmının göründüğü ZAMAN yüzdesi
  // ("güneşli zaman"); sunEnergyPct: diskin görünen oranının ortalaması ("güneş enerjisi oranı").
  function stats(model, a = 0, b = model.n) {
    let energy = 0, sun = 0, link = 0, both = 0, vis = 0, low = 0;
    for (let i = a; i < b; i++) {
      energy += model.sunFrac[i]; sun += model.sunUp[i]; link += model.linkUp[i]; both += model.both[i];
      if (model.margin[i] > 0) { vis++; if (model.margin[i] < 1) low++; }
    }
    const n = Math.max(1, b - a);
    return {
      hours: b - a,
      lowMarginPct: vis ? (low / vis) * 100 : 0, // Dünya göründüğü zamanın ne kadarında pay 1°'nin altında
      sunPct: (sun / n) * 100,
      sunEnergyPct: (energy / n) * 100,
      earthPct: (link / n) * 100,
      bothPct: (both / n) * 100,
      longestDarkH: longestOff(model.sunUp, a, b),
      longestGapH: longestOff(model.linkUp, a, b),
    };
  }

  // flags[from] durumunun değişmesine kalan saat; veri sonuna dek değişmiyorsa null
  function untilChange(flags, from) {
    for (let i = from + 1; i < flags.length; i++) if (flags[i] !== flags[from]) return i - from;
    return null;
  }

  // Karşılaştırma ekranının hesabı: startHour'da inen bir görevin ilk `hours` saati (inişe hizalı pencere).
  // Pencere veri sonunu aşarsa kırpılır (clipped). model verilmezse site + mask'ten kurulur (gerçek arazi).
  function windowStats(site, startHour, hours, mask, model) {
    const m = model || buildModel(site, false, mask), s = site.series;
    const a = clamp(Math.round(startHour), 0, m.n - 1), b = Math.min(m.n, a + hours);
    const st = stats(m, a, b);
    const sunHz = m.flat ? 0 : horizonAt(site.horizon, s.sunAz[a]);
    return Object.assign(st, {
      start: a, end: b, asked: hours, clipped: b - a < hours,
      landing: {
        sunAlt: s.sunAlt[a], sunAz: s.sunAz[a], sunMargin: s.sunAlt[a] - sunHz, disc: m.sunFrac[a],
        earthAlt: s.earthAlt[a], earthAz: s.earthAz[a], earthMargin: m.margin[a],
        sunUp: !!m.sunUp[a], linkUp: !!m.linkUp[a],
        sunChangeH: untilChange(m.sunUp, a), linkChangeH: untilChange(m.linkUp, a),
      },
      model: m,
    });
  }

  // her saat: batarya += panel·güneş_oranı·1h − tüketim·1h, 0 ile kapasite arasında
  function battery(model, cfg, startHour) {
    const n = model.n, level = new Float32Array(n + 1).fill(NaN);
    let e = cfg.cap, dead = -1, min = cfg.cap;
    const s0 = clamp(Math.round(startHour), 0, n - 1);
    level[s0] = e;
    for (let i = s0; i < n; i++) {
      e = clamp(e + cfg.panel * model.sunFrac[i] - cfg.load, 0, cfg.cap);
      level[i + 1] = e;
      if (e < min) min = e;
      if (e <= 0 && dead < 0) dead = i + 1;
    }
    return { level, start: s0, deadHour: dead, minPct: (min / cfg.cap) * 100 };
  }

    for (let i = start; i < model.n; i++) {
      e += cfg.panel * model.sunFrac[i] - cfg.load;
      if (e > cfg.cap) e = cfg.cap;
      if (e <= 0) return i + 1 - start;

  function derive(site, opt) {

  function darkScore(days) { return 100 - (Math.min(days, DARK_CAP_DAYS) / DARK_CAP_DAYS) * 100; }

  // Dönen dizi: i. noktayı baskılayan (hiçbir ölçüde daha kötü olmayan, en az birinde daha iyi) noktanın
  // sırası, yoksa −1. Birden çok baskılayan varsa dengeli puanı en yüksek olan.
  function pareto(ms) {

    return v.map((b, i) => {
      let best = -1;
      v.forEach((a, j) => {

        if (a[0] === b[0] && a[1] === b[1] && a[2] === b[2]) return;

  function requiredCap(model, panel, load, start) {

  // (varsayım; gerçek araç verisi değil). n deneme, tohum sabit: aynı ayar hep aynı sonucu verir.
  // Dönen: her denemenin gerektirdiği kapasite, küçükten büyüğe.
  function uncertainty(model, cfg, start, u, n = 1000) {

  function survival(need, cap, q = 95) {

    return { pct: (ok / need.length) * 100, capQ: Math.floor(worst / 10) * 10 + 10 };
  }

  return { SUN_R, EARTH_R, LONG_DARK_H, discAbove, horizonAt, horizonDistAt, buildModel, runsOf, mergeRuns, stats, longestOff, windowStats, battery, at, runAt, derive, balanced,

})();

    feed.rotateX(Math.PI / 2);
    add(feed, dark, 0, 0, 0.2, dishPivot);
    // yanıp sönen işaret ışığı: araç uzaktan ve karanlıkta da bulunabilsin
    const bc = document.createElement('canvas'); bc.width = bc.height = 32;
    const bx = bc.getContext('2d'), bg = bx.createRadialGradient(16, 16, 0, 16, 16, 16);
    bg.addColorStop(0, 'rgba(255,255,255,1)'); bg.addColorStop(0.35, 'rgba(255,255,255,0.5)'); bg.addColorStop(1, 'rgba(255,255,255,0)');

    beacon.position.set(-0.7, 4.25, 0);
    beacon.scale.set(0.011, 0.011, 1);

  // aracın yere düşen gölgesi: 20 km'lik gölge haritası bu ölçeği çözemediği için ayrı, temsili bir şerit
  function buildShadowStrip() {
    const g = new THREE.BufferGeometry(), idx = [];
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array((SH_SEG + 1) * 6), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array((SH_SEG + 1) * 8), 4));
    for (let i = 0; i < SH_SEG; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
    g.setIndex(idx);
    shadowStrip = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4, toneMapped: false }));
    shadowStrip.frustumCulled = false; shadowStrip.visible = false;
    scene.add(shadowStrip);
  }
  function updateShadowStrip() {
    const show = st.sunFrac > 0.03 && st.sunAlt > 0.3;
    shadowStrip.visible = show;
    if (!show) return;
    const len = Math.min(4.2 / Math.tan(st.sunAlt * D2R), 450), ys = terrain.scale.y;
    const hl = Math.hypot(V.sun.x, V.sun.z) || 1, dx = -V.sun.x / hl, dz = -V.sun.z / hl;
    const pa = shadowStrip.geometry.attributes.position, ca = shadowStrip.geometry.attributes.color;
    for (let i = 0; i <= SH_SEG; i++) {
      const s = i / SH_SEG, d = 1.0 + s * len, w = lerp(1.45, 0.55, s), a = 0.82 * st.sunFrac * Math.pow(1 - s, 0.7);
      for (let k = 0; k < 2; k++) {
        const sg = k ? 1 : -1, x = V.lander.x + dx * d + dz * w * sg, z = V.lander.z + dz * d - dx * w * sg;
        pa.setXYZ(i * 2 + k, x, groundY(x, z) * ys + 0.1, z);
        ca.setXYZW(i * 2 + k, 0, 0, 0, a);
      }
    }
    pa.needsUpdate = true; ca.needsUpdate = true;
  }

  function buildBeam() {
    const mkLine = (mat) => {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
      const l = new THREE.Line(g, mat);
      l.frustumCulled = false; l.visible = false;
      scene.add(l);
      return l;
    };
    beamUp = mkLine(new THREE.LineBasicMaterial({ color: 0x6fb2ff, transparent: true, opacity: 0.95, toneMapped: false }));
    beamCut = mkLine(new THREE.LineDashedMaterial({ color: 0xff3d6e, dashSize: 4, gapSize: 3, toneMapped: false }));
  }

  function buildFlatDisc() {
    const g = new THREE.CircleGeometry(220000, 96);
    g.rotateX(-Math.PI / 2);
    flatDisc = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0x8f897e }));
    flatDisc.position.y = -6;
    flatDisc.visible = false;
    scene.add(flatDisc);
  }

  // ---------- regolit dokusu (yordamsal): albedo + normal ----------
  function regolith() {
    if (regoTex) return regoTex;
    const N = 512, h = new Float32Array(N * N);
    let seed = 13;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    // yalnız kısa dalga boyları: uzaktan bakınca döşeme tekrarı görünmesin
    for (const [cells, amp] of [[22, 0.55], [46, 0.42], [96, 0.26], [190, 0.13]]) {
      const lat = new Float32Array(cells * cells).map(rnd);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const fx = (x / N) * cells, fy = (y / N) * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
        let tx = fx - x0, ty = fy - y0; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
        const x1 = (x0 + 1) % cells, y1 = (y0 + 1) % cells;
        const v = lerp(lerp(lat[y0 * cells + x0], lat[y0 * cells + x1], tx), lerp(lat[y1 * cells + x0], lat[y1 * cells + x1], tx), ty);
        h[y * N + x] += (v - 0.5) * amp;
      }
    }
    // küçük kraterler: çanak + kenar kabartısı (yakın planda yüzey okunur olsun)
    for (let k = 0; k < 120; k++) {
      const cx0 = Math.round(rnd() * N), cy0 = Math.round(rnd() * N), r = 2 + Math.pow(rnd(), 2.6) * 13, dep = r * 0.085, R = Math.ceil(r * 1.7);
      for (let yy = -R; yy <= R; yy++) for (let xx = -R; xx <= R; xx++) {
        const q = Math.hypot(xx, yy) / r;
        if (q > 1.7) continue;
        const v = q < 1 ? -dep * (1 - q * q) + dep * 0.22 * q * q : dep * 0.22 * Math.exp(-((q - 1) * (q - 1)) / 0.05);
        h[((((cy0 + yy) % N) + N) % N) * N + ((((cx0 + xx) % N) + N) % N)] += v;
      }
    }
    const mkCanvas = (fn) => {
      const c = document.createElement('canvas'); c.width = c.height = N;
      const cx = c.getContext('2d'), im = cx.createImageData(N, N);
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const o = (y * N + x) * 4; fn(x, y, im.data, o); im.data[o + 3] = 255; }
      cx.putImageData(im, 0, 0);
      return c;
    };
    const at = (x, y) => h[((y + N) % N) * N + ((x + N) % N)];
    const albedo = mkCanvas((x, y, d, o) => { const v = clamp(236 + clamp(at(x, y), -0.7, 0.7) * 30, 0, 255); d[o] = d[o + 1] = d[o + 2] = v; });
    const normal = mkCanvas((x, y, d, o) => {
      const dx = (at(x + 1, y) - at(x - 1, y)) * 1.6, dy = (at(x, y + 1) - at(x, y - 1)) * 1.6, l = Math.hypot(dx, dy, 1);
      d[o] = (-dx / l) * 127 + 128; d[o + 1] = (-dy / l) * 127 + 128; d[o + 2] = (1 / l) * 127 + 128;
    });
    const tex = (c, srgb) => {
      const tx = new THREE.CanvasTexture(c);
      tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
      tx.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
      return tx;
    };
    regoTex = { map: tex(albedo, true), normalMap: tex(normal, false) };
    return regoTex;
  }

  // ---------- bölgeye özel nesneler ----------
  // NaN boşlukları komşu ortalamasıyla doldur; derinliği (kaç geçişte dolduğu) sakla
  function fillGaps(z, W, H) {
    const out = Float32Array.from(z), depth = new Uint16Array(W * H);
    let pending = [];
    for (let i = 0; i < out.length; i++) if (Number.isNaN(out[i])) pending.push(i);
    let pass = 0;
    while (pending.length && pass < 600) {
      pass++;
      const upd = [], next = [];
      for (const i of pending) {
        const r = (i / W) | 0, c = i % W;
        let s = 0, k = 0;
        if (c > 0 && !Number.isNaN(out[i - 1])) { s += out[i - 1]; k++; }
        if (c < W - 1 && !Number.isNaN(out[i + 1])) { s += out[i + 1]; k++; }
        if (r > 0 && !Number.isNaN(out[i - W])) { s += out[i - W]; k++; }
        if (r < H - 1 && !Number.isNaN(out[i + W])) { s += out[i + W]; k++; }
        if (k) upd.push(i, s / k); else next.push(i);
      }
      for (let j = 0; j < upd.length; j += 2) { out[upd[j]] = upd[j + 1]; depth[upd[j]] = pass; }
      pending = next;
    }
    for (const i of pending) { out[i] = 0; depth[i] = 999; }
    return { out, depth };
  }

  function groundY(x, z) {
    if (!grid) return 0;
    const fc = clamp(x / grid.sp + (grid.W - 1) / 2, 0, grid.W - 1.001), fr = clamp(z / grid.sp + (grid.H - 1) / 2, 0, grid.H - 1.001);
    const c = Math.floor(fc), r = Math.floor(fr), tx = fc - c, ty = fr - r, i = r * grid.W + c;
    return lerp(lerp(grid.z[i], grid.z[i + 1], tx), lerp(grid.z[i + grid.W], grid.z[i + grid.W + 1], tx), ty);
  }

  function buildTerrain(tr) {
    const W = tr.meta.width, H = tr.meta.height, sp = tr.meta.spacing_m;
    const { out, depth } = fillGaps(tr.z, W, H);
    let min = Infinity, max = -Infinity;
    const pos = new Float32Array(W * H * 3), uv = new Float32Array(W * H * 2), REP = (W * sp) / 170;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      const i = r * W + c, y = out[i];
      if (depth[i] <= 3) { if (y < min) min = y; if (y > max) max = y; }
      pos[i * 3] = (c - (W - 1) / 2) * sp; pos[i * 3 + 1] = y; pos[i * 3 + 2] = (r - (H - 1) / 2) * sp;
      uv[i * 2] = (c / (W - 1)) * REP; uv[i * 2 + 1] = (r / (H - 1)) * REP;
    }
    // büyük veri boşlukları (köşeler) çizilmez: uydurma arazi göstermeyelim
    const idx = new Uint32Array((W - 1) * (H - 1) * 6);
    let k = 0;
    for (let r = 0; r < H - 1; r++) for (let c = 0; c < W - 1; c++) {
      const a = r * W + c, b = a + 1, d = a + W, e = d + 1;
      if (depth[a] > 3 || depth[b] > 3 || depth[d] > 3 || depth[e] > 3) continue;
      idx[k++] = a; idx[k++] = d; idx[k++] = b; idx[k++] = b; idx[k++] = d; idx[k++] = e;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(new THREE.BufferAttribute(idx.subarray(0, k), 1));
    geo.computeVertexNormals();
    grid = { z: out, W, H, sp, min, max, half: ((W - 1) * sp) / 2 };

    if (!terrainMat) {
      const rg = regolith();
      terrainMat = new THREE.MeshLambertMaterial({ color: 0x97938c, map: rg.map, normalMap: rg.normalMap, normalScale: new THREE.Vector2(0.24, 0.24) });
      // Ay regoliti Lambert gibi davranmaz: sığ açıda Lommel-Seeliger'e yakındır. Karışım kullan.
      terrainMat.onBeforeCompile = (sh) => {
        const chunk = THREE.ShaderChunk.lights_lambert_pars_fragment;
        const patched = chunk.replace(
          /float dotNL = saturate\( dot\( (\w+), directLight\.direction \) \);/,
          'float dotNLr = saturate( dot( $1, directLight.direction ) ); float dotNVr = saturate( dot( $1, geometryViewDir ) ); float dotNL = mix( dotNLr, min( 2.0 * dotNLr / ( dotNLr + dotNVr + 0.02 ), 1.2 ), 0.55 ); dotNL *= smoothstep( -0.07, 0.03, dot( normalize( vNormal ), directLight.direction ) );');
        if (patched !== chunk && chunk.includes('geometryViewDir')) sh.fragmentShader = sh.fragmentShader.replace('#include <lights_lambert_pars_fragment>', patched);
      };
      flatDisc.material = new THREE.MeshLambertMaterial({ color: 0x97938c });
    }
    terrain = new THREE.Mesh(geo, terrainMat);
    terrain.castShadow = true; terrain.receiveShadow = true;
    scene.add(terrain);
  }

  // 360° ufuk profilinden siluet halkası: gözlemciden bakınca gerçek ufku verir
  function buildRing(hz) {
    const n = hz.elev.length, pos = new Float32Array((n + 1) * 6), idx = new Uint32Array(n * 6);
    const bottom = -RING_R * Math.tan(14 * D2R);
    for (let i = 0; i <= n; i++) {
      const j = i % n, az = j * hz.step * D2R;
      let el = hz.elev[j];
      if (hz.dist[j] < 9.5) el -= 0.05; // yakın ufku arazi ağı çiziyor; halka onun hemen ardında kalsın
      const x = Math.sin(az) * RING_R, z = -Math.cos(az) * RING_R, top = EYE + RING_R * Math.tan(el * D2R);
      pos.set([x, top, z, x, Math.min(bottom, top - 100), z], i * 6);
      if (i < n) idx.set([i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 2, i * 2 + 1, i * 2 + 3], i * 6);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    if (!ringMat) {
      ringMat = new THREE.ShaderMaterial({
        side: THREE.DoubleSide, transparent: true,
        uniforms: { sunDir: { value: new THREE.Vector3() }, lit: { value: 1 }, alpha: { value: 1 }, base: { value: new THREE.Color(0x97938c) } },
        vertexShader: `varying vec3 vIn; void main(){ vIn = normalize(vec3(-position.x, 0.0, -position.z)); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `uniform vec3 sunDir; uniform float lit; uniform float alpha; uniform vec3 base; varying vec3 vIn;
          void main(){ float d = max(dot(normalize(vIn), normalize(vec3(sunDir.x, 0.0, sunDir.z))), 0.0);
            vec3 col = base * (0.015 + lit * d * 0.5);
            gl_FragColor = vec4(col, alpha);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      });
    }
    ring = new THREE.Mesh(geo, ringMat);
    ring.frustumCulled = false;
    scene.add(ring);
  }

  // Dünya'nın yıl boyunca gökte çizdiği iz (librasyon)
  function buildTrace(se) {
    const pts = [], v = new THREE.Vector3();
    for (let i = 0; i < se.n; i += 3) { dirTo(se.earthAlt[i], se.earthAz[i], v); pts.push(v.x * SKY_D * 1.002, v.y * SKY_D * 1.002, v.z * SKY_D * 1.002); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
    trace = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x5aa5ff, transparent: true, opacity: 0.16, depthWrite: false, toneMapped: false }));
    trace.frustumCulled = false;
    sky.add(trace);
  }

  // yüksekten bakınca bağlam: kutup haritası (soluk) ve bölge sınırı. Alçakta gizlenir.
  function buildContext(o) {
    const b = o.map.bounds, S = 2048, c = document.createElement('canvas');
    c.width = c.height = S;
    const cx = c.getContext('2d');
    cx.fillStyle = '#1a1d1c'; cx.fillRect(0, 0, S, S);
    if (o.map.image) cx.drawImage(o.map.image, 0, 0, S, S);
    const px = (x) => ((x - b[0]) / (b[2] - b[0])) * S, py = (y) => ((b[3] - y) / (b[3] - b[1])) * S;
    const regionId = o.site.regionId || o.site.id; // aday noktada da kendi bölgesi vurgulansın
    for (const s of o.sites) {
      cx.beginPath();
      s.reg.polygon_ps_km.forEach(([x, y], i) => (i ? cx.lineTo(px(x), py(y)) : cx.moveTo(px(x), py(y))));
      cx.closePath();
      cx.lineWidth = s.id === regionId ? 2.5 : 1.5; cx.strokeStyle = s.id === regionId ? '#ffffff' : 'rgba(220,228,224,0.7)';
      cx.stroke();
    }
    const tx = new THREE.CanvasTexture(c);
    tx.colorSpace = THREE.SRGBColorSpace;
    tx.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    const size = (b[2] - b[0]) * 1000, g = new THREE.PlaneGeometry(size, size);
    g.rotateX(-Math.PI / 2);
    contextMat = new THREE.MeshBasicMaterial({ map: tx, transparent: true, opacity: 0, depthWrite: false, color: 0x777b79 });
    context = new THREE.Mesh(g, contextMat);
    // harita düzleminde: x̂ → (cosλ, 0, −sinλ), ŷ → (−sinλ, 0, −cosλ); nokta (0,0,0)'a gelsin
    const lam = o.site.lon * D2R, sxk = o.site.ps_km[0], syk = o.site.ps_km[1];
    context.rotation.y = lam;
    const ex = sxk * Math.cos(lam) - syk * Math.sin(lam), nn = sxk * Math.sin(lam) + syk * Math.cos(lam);
    context.position.set(-ex * 1000, grid.min - 300, nn * 1000);
    context.renderOrder = -1;
    context.visible = false;
    scene.add(context);
  }

  function disposeSite() {
    for (const obj of [terrain, ring, context]) if (obj) { scene.remove(obj); obj.geometry.dispose(); }
    if (context) { contextMat.map.dispose(); contextMat.dispose(); }
    if (trace) { sky.remove(trace); trace.geometry.dispose(); trace.material.dispose(); }
    terrain = ring = context = trace = null;
  }

  function circMean(arr) {
    let s = 0, c = 0;
    for (let i = 0; i < arr.length; i += 24) { s += Math.sin(arr[i] * D2R); c += Math.cos(arr[i] * D2R); }
    return (Math.atan2(s, c) / D2R + 360) % 360;
  }

  // o: { site, sites, map, horizon, series, terrain }
  function setSite(o) {
    if (!ok) return;
    disposeSite();
    buildTerrain(o.terrain); buildRing(o.horizon); buildTrace(o.series); buildContext(o);
    siteEarthAz = circMean(o.series.earthAz);
    const az = (siteEarthAz + 35) * D2R, lx = Math.sin(az) * 14, lz = -Math.cos(az) * 14;
    V.lander.set(lx, groundY(lx, lz), lz);
    lander.position.copy(V.lander);
    lander.visible = true;
    st.flat = st.flatGoal; applyFlat();
    resetOrbit();
    cam.yaw = siteEarthAz * D2R; cam.pitch = 0.07; cam.fov = 55;
    st.shadowDirty = true;
  }

  function resetOrbit() {
    cam.az = Math.PI - (siteEarthAz + 205) * D2R; cam.pol = 1.2; cam.dist = 2600;
  }

  // ---------- kamera ve kontroller ----------
  function zoomBy(f) {
    if (cam.mode === 'astro') cam.fov = clamp(cam.fov * f, 2.5, 75);
    else cam.dist = clamp(cam.dist * f, 18, 60000);
  }
  function bindControls() {
    const pts = new Map();
    let pinch = 0;
    canvas.addEventListener('pointerdown', (e) => { tween = null; canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
    canvas.addEventListener('pointermove', (e) => {
      const p = pts.get(e.pointerId);
      if (!p || cam.cine) return;
      const dx = e.clientX - p[0], dy = e.clientY - p[1];
      p[0] = e.clientX; p[1] = e.clientY;
      if (pts.size === 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) zoomBy(pinch / d);
        pinch = d;
        return;
      }
      if (cam.mode === 'astro') {
        const k = (cam.fov * D2R) / Math.max(1, canvas.clientHeight);
        cam.yaw -= dx * k; cam.pitch = clamp(cam.pitch + dy * k, -0.6, 1.3);
      } else {
        cam.az -= dx * 0.005; cam.pol = clamp(cam.pol - dy * 0.005, 0.06, 1.56);
      }
    });
    const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); if (!cam.cine) { tween = null; zoomBy(Math.exp(e.deltaY * 0.0012)); } }, { passive: false });
  }

  function updateCamera(dt) {
    if (cam.cine) cam.cine(dt);
    else if (tween) {
      tween.t += dt;
      const k = easeInOut(Math.min(1, tween.t / tween.dur));
      for (const key in tween.to) cam[key] = key === 'dist' ? tween.from.dist * Math.pow(tween.to.dist / tween.from.dist, k) : lerp(tween.from[key], tween.to[key], k);
      if (tween.t >= tween.dur) tween = null;
    }
    if (cam.mode === 'astro' && !cam.cine) {
      camera.position.set(0, EYE * (st.flat > 0.5 ? 1 : 1), 0);
      camera.rotation.set(cam.pitch, -cam.yaw, 0, 'YXZ');
      camera.fov = cam.fov; camera.near = 0.3;
    } else {
      const ys = terrain.scale.y;
      V.target.set(V.lander.x, V.lander.y * ys + 1.6, V.lander.z);
      const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
      camera.position.set(V.target.x + cam.dist * sp * Math.sin(cam.az), V.target.y + cam.dist * cp, V.target.z + cam.dist * sp * Math.cos(cam.az));
      const gy = groundY(camera.position.x, camera.position.z) * ys + 2.5;
      if (Math.abs(camera.position.x) < grid.half && Math.abs(camera.position.z) < grid.half && camera.position.y < gy) camera.position.y = gy;
      camera.up.set(0, 1, 0);
      camera.lookAt(V.target);
      camera.fov = 50; camera.near = Math.max(0.5, cam.dist * 0.02);
    }
    camera.updateProjectionMatrix();
  }

  function setView(mode) {
    tween = null;
    cam.mode = mode === 'astro' ? 'astro' : 'orbit';
  }
  // yumuşak kamera geçişi (otomatik tur için); kullanıcı sahneye dokununca iptal olur
  function startTween(to, sec) {
    if (!ok || !terrain) return;
    const from = {};
    for (const key in to) from[key] = cam[key];
    if ('yaw' in to) { const d = to.yaw - cam.yaw; to.yaw = cam.yaw + Math.atan2(Math.sin(d), Math.cos(d)); }
    if ('pol' in to) to.pol = clamp(to.pol, 0.06, 1.56);
    tween = { from, to, t: 0, dur: Math.max(0.05, sec) };
  }
  function tweenLook(azDeg, altDeg, fov, sec) {
    startTween({ yaw: azDeg * D2R, pitch: clamp((altDeg - fov * 0.06) * D2R, -0.4, 1.2), fov }, sec);
  }
  function lookAt(azDeg, altDeg) {
    // hedef, panellerin örtmediği alanın ortasına gelsin diye biraz aşağıya bak
    if (cam.mode === 'astro') { cam.yaw = azDeg * D2R; cam.pitch = clamp((altDeg - cam.fov * 0.06) * D2R, -0.4, 1.2); }
  }
  function lookLander() {
    if (cam.mode === 'astro') { cam.yaw = Math.atan2(V.lander.x, -V.lander.z); cam.pitch = 0.1; cam.fov = 55; } else resetOrbit();
  }

  // iniş sekansı: yörünge yüksekliğinden araca doğru alçalan kamera (yörünge parametreleri canlandırılır)
  function startDescent(dur, onAlt, onDone) {
    if (!ok || !terrain) { onDone(); return; }
    cam.mode = 'orbit';
    resetOrbit();
    const azEnd = cam.az, dEnd = 62, polEnd = 1.36, d0 = 120000;
    let tt = 0, done = false;
    cam.cine = (dt) => {
      tt = Math.min(dur, tt + dt);
      const p = tt / dur, e = 1 - Math.pow(1 - p, 1.3);
      cam.dist = dEnd * Math.pow(d0 / dEnd, 1 - e);
      cam.pol = lerp(0.03, polEnd, smooth(0.3, 1, p));
      cam.az = azEnd - (1 - e) * 2.2;
      onAlt(Math.max(0, cam.dist * Math.cos(cam.pol)));
      if (p >= 1 && !done) { done = true; cam.cine = null; onDone(); }
    };
    return { skip() { tt = dur; } };
  }

  // ---------- kare başına güncelleme ----------
  function setFlat(on, instant) { st.flatGoal = on ? 1 : 0; if (instant) { st.flat = st.flatGoal; if (terrain) applyFlat(); } }
  function applyFlat() {
    const k = easeInOut(st.flat);
    terrain.scale.y = lerp(1, FLAT_Y, k);
    flatDisc.visible = st.flat > 0.02;
    lander.position.y = V.lander.y * terrain.scale.y;
    st.shadowDirty = true;
  }

  function update(s) {
    if (!ok) return;
    dirTo(s.sunAlt, s.sunAz, V.sun); dirTo(s.earthAlt, s.earthAz, V.earth);
    st.sunFrac = s.sunFrac; st.sunAlt = s.sunAlt; st.earthAlt = s.earthAlt; st.linkUp = s.linkUp; st.margin = s.margin; st.blockKm = s.blockKm; st.illum = s.illum;
  }

  function fitShadow() {
    const ys = terrain.scale.y, yLo = grid.min * ys - 5, yHi = Math.max(grid.max * ys, 0) + 12, cy = (yLo + yHi) / 2;
    sunLight.target.position.set(0, cy, 0);
    sunLight.position.set(V.sun.x * 40000, cy + V.sun.y * 40000, V.sun.z * 40000);
    sunLight.target.updateMatrixWorld();
    const f = V.a.copy(V.sun).negate(), r = V.b.set(0, 1, 0).cross(f).negate().normalize(), u = V.c.copy(r).cross(f);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    const p = sunLight.position, h = grid.half;
    for (const X of [-h, h]) for (const Y of [yLo, yHi]) for (const Z of [-h, h]) {
      const dx = X - p.x, dy = Y - p.y, dz = Z - p.z;
      const a = dx * r.x + dy * r.y + dz * r.z, b = dx * u.x + dy * u.y + dz * u.z, c = dx * f.x + dy * f.y + dz * f.z;
      x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b); z0 = Math.min(z0, c); z1 = Math.max(z1, c);
    }
    const sc = sunLight.shadow.camera;
    sc.left = x0; sc.right = x1; sc.bottom = y0; sc.top = y1; sc.near = Math.max(1, z0 - 200); sc.far = z1 + 200;
    sc.updateProjectionMatrix();
    sunLight.shadow.needsUpdate = true;
    V.lastSun.copy(V.sun);
    st.shadowDirty = false;
  }

  function place(el, world, show, text) {
    if (!show) { el.hidden = true; return; }
    V.a.copy(world).project(camera);
    if (V.a.z > 1 || Math.abs(V.a.x) > 1.05 || Math.abs(V.a.y) > 1.05) { el.hidden = true; return; }
    el.hidden = false;
    el.style.transform = `translate(${((V.a.x * 0.5 + 0.5) * host.clientWidth).toFixed(1)}px, ${((-V.a.y * 0.5 + 0.5) * host.clientHeight).toFixed(1)}px)`;
    if (text != null) setText(el.lastElementChild, text);
  }

  function render(dt) {
    if (!ok || !terrain) return;
    if (st.flat !== st.flatGoal) {
      st.flat = st.flatGoal > st.flat ? Math.min(1, st.flat + dt / 0.8) : Math.max(0, st.flat - dt / 0.8);
      applyFlat();
    }
    updateCamera(dt);

    // Işığın doğruluğu: şiddet hesap verisinden (Güneş diskinin görünen oranı) gelir
    sunLight.intensity = SUN_I * st.sunFrac;
    earthLight.position.copy(V.earth).multiplyScalar(40000);
    earthLight.intensity = 0.3 * st.illum * smooth(-0.5, 1.5, st.margin);
    fillLight.intensity = 0.05 + 0.42 * (1 - st.sunFrac);
    bounce.intensity = 0.9 * st.sunFrac * smooth(-1, 3, st.sunAlt);
    if (st.sunFrac > 0 && (st.shadowDirty || V.sun.distanceToSquared(V.lastSun) > 2e-8)) fitShadow();

    const astro = cam.mode === 'astro' && !cam.cine, real = st.flat < 0.5;
    sky.position.copy(camera.position);
    sunDisc.position.copy(V.sun).multiplyScalar(SKY_D);
    sunDisc.lookAt(camera.position);
    sunGlow.position.copy(sunDisc.position);
    sunStreak.position.copy(sunDisc.position);
    sunGlow.material.opacity = 0.3 + 0.7 * st.sunFrac;
    sunStreak.material.opacity = 0.55 * st.sunFrac;
    // astronot gözünde HUD ile sahne çelişmesin: veri "hiç görünmüyor" diyorsa disk çizilmez
    const sunShown = !(astro && real && st.sunFrac <= 0.001);
    sunDisc.visible = sunGlow.visible = sunStreak.visible = sunShown;
    earth.position.copy(V.earth).multiplyScalar(SKY_D);
    earth.visible = !(astro && real && st.margin < -Sim.EARTH_R);
    earthMat.uniforms.sunDir.value.copy(V.sun);
    starMat.opacity = 0.42 * (1 - 0.8 * st.sunFrac);

    const hgt = camera.position.y - EYE;
    const ra = (1 - smooth(350, 3200, hgt)) * (1 - st.flat);
    ring.visible = ra > 0.01;
    ringMat.uniforms.alpha.value = ra;
    ringMat.transparent = ra < 0.995;
    ringMat.uniforms.sunDir.value.copy(V.sun);
    ringMat.uniforms.lit.value = smooth(-1.6, 0.4, st.sunAlt);
    contextMat.opacity = 0.62 * smooth(5000, 24000, hgt);
    context.visible = contextMat.opacity > 0.01;

    // araç: panel Güneş'in azimutunu, çanak Dünya'yı izler
    panelPivot.rotation.y = Math.atan2(V.sun.x, V.sun.z);
    panelMat.emissiveIntensity = 0.85 * st.sunFrac;
    clock += dt;
    beacon.material.opacity = clock % 1.8 < 0.16 ? 1 : 0.1;
    updateShadowStrip();
    dishPivot.getWorldPosition(V.dish);
    dishPivot.lookAt(V.a.copy(V.dish).add(V.earth));
    const up = st.linkUp;
    beamUp.visible = up; beamCut.visible = !up;
    const line = up ? beamUp : beamCut, len = up ? SKY_D * 0.98 : Math.max(30, Math.min(st.blockKm, 30) * 1000);
    const pa = line.geometry.attributes.position;
    pa.setXYZ(0, V.dish.x, V.dish.y, V.dish.z);
    pa.setXYZ(1, V.dish.x + V.earth.x * len, V.dish.y + V.earth.y * len, V.dish.z + V.earth.z * len);
    pa.needsUpdate = true;
    if (!up) {
      const dd = Math.max(1.5, camera.position.distanceTo(V.dish) * 0.012);
      beamCut.material.dashSize = dd; beamCut.material.gapSize = dd * 0.8;
      line.computeLineDistances();
    }

    renderer.render(scene, camera);

    place(mk.Lander, V.b.copy(lander.position).setY(lander.position.y + 2), !astro && !cam.cine && cam.dist > 140);
    place(mk.Sun, sunDisc.getWorldPosition(V.b), astro && sunShown, t('scene.sunTag', { v: Fmt.deg(st.sunAlt, 1) }));
    place(mk.Earth, earth.getWorldPosition(V.b), astro && earth.visible, t('scene.earthTag', { v: Fmt.deg(st.earthAlt, 1) }));

    // düşük donanım: kare süresi uzunsa gölge çözünürlüğünü ve piksel oranını düşür
    if (dt < 0.25) { quality.acc += dt; quality.frames++; }
    if (quality.frames >= 90) {
      if (!quality.lowered && quality.acc / quality.frames > 1 / 26) {
        quality.lowered = true;
        renderer.setPixelRatio(1); resize();
        sunLight.shadow.mapSize.set(2048, 2048);
        if (sunLight.shadow.map) { sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
        st.shadowDirty = true;
      }
      quality.acc = 0; quality.frames = 0;
    }
  }

  function hideMarkers() { for (const k in mk) if (mk[k]) mk[k].hidden = true; }

  return Object.assign(api, {
    init, setSite, setView, setFlat, update, render, startDescent, lookAt, lookLander, hideMarkers, resize,
    setOrbit(az, pol, dist) { tween = null; cam.az = az; cam.pol = pol; cam.dist = dist; },
    tween: startTween, tweenLook,
    get cam() { return cam; },
    setFov(v) { cam.fov = clamp(v, 2.5, 75); },
    get ok() { return ok; },
    get hasSite() { return !!terrain; },
    get view() { return { mode: cam.mode, yaw: (cam.yaw / D2R % 360 + 360) % 360, fov: cam.fov, aspect: camera ? camera.aspect : 1 }; },
  });
})();

// ===== skyplot: gökyüzü radarı (ufuk çevresi büyütülmüş kutup grafiği) =====
// Yarıçap = yükseklik açısı, doğrusal değil (asinh): −8° dış kenar, +15° iç halka. Kuzey yukarıda, doğu sağda.
const SkyPlot = (() => {
  const E_MIN = -8, E_MAX = 15, S = 1.5, TRAIL_H = 720;
  const u = (e) => Math.asinh(e / S), U0 = u(E_MIN), U1 = u(E_MAX);
  let cv, ctx, base, bctx, baseKey = '', hatch = null;
  let W = 300, cx = 150, cy = 150, R0 = 120, R1 = 30, dpr = 1;

  const rOf = (e) => R0 - clamp((u(e) - U0) / (U1 - U0), 0, 1) * (R0 - R1);
  const pt = (az, e) => { const r = rOf(e), a = az * D2R; return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; };

  function init(canvas) {
    cv = canvas; ctx = cv.getContext('2d');
    cv.setAttribute('aria-label', t('sky.alt'));
    base = document.createElement('canvas'); bctx = base.getContext('2d');
    const h = document.createElement('canvas'); h.width = h.height = 6;
    const hc = h.getContext('2d');
    hc.fillStyle = '#343c39'; hc.fillRect(0, 0, 6, 6);
    hc.strokeStyle = '#5b6562'; hc.lineWidth = 1;
    hc.beginPath(); hc.moveTo(-1, 7); hc.lineTo(7, -1); hc.moveTo(-1, 1); hc.lineTo(1, -1); hc.moveTo(5, 7); hc.lineTo(7, 5); hc.stroke();
    hatch = h;
  }

  function layout() {
    const d = fitCanvas(cv);
    dpr = d.dpr; W = d.w;
    cx = W / 2; cy = d.h / 2;
    R0 = Math.min(d.w, d.h) / 2 - 17; R1 = R0 * 0.2;
    if (base.width !== cv.width || base.height !== cv.height) { base.width = cv.width; base.height = cv.height; baseKey = ''; }
  }

  // değişmeyen katman: arazi maskesi, ızgara, pusula, Dünya'nın yıllık izi
  function drawBase(site, flatK, mask) {
    const c = bctx, hz = site.horizon, se = site.series;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, W * 2);
    const line = cssVar('--line'), earth = cssVar('--earth');
    // gökyüzü diski
    c.fillStyle = '#000'; c.beginPath(); c.arc(cx, cy, R0, 0, Math.PI * 2); c.fill();
    // arazi maskesi: dış kenardan ufuk çizgisine kadar dolu
    const hAt = (az) => lerp(Sim.horizonAt(hz, az), 0, flatK);
    c.beginPath(); c.arc(cx, cy, R0, 0, Math.PI * 2);
    for (let az = 360; az >= 0; az -= 0.5) { const [x, y] = pt(az, hAt(az)); if (az === 360) c.moveTo(x, y); else c.lineTo(x, y); }
    c.closePath();
    c.fillStyle = c.createPattern(hatch, 'repeat'); c.fill('evenodd');
    c.beginPath();
    for (let az = 0; az <= 360; az += 0.5) { const [x, y] = pt(az, hAt(az)); if (az === 0) c.moveTo(x, y); else c.lineTo(x, y); }
    c.closePath(); c.strokeStyle = flatK > 0.5 ? cssVar('--warn') : line; c.lineWidth = 1.4; c.stroke();
    // düz ufuk modunda gerçek ufuk hayalet çizgi olarak kalsın
    if (flatK > 0.02) {
      c.beginPath();
      for (let az = 0; az <= 360; az += 0.5) { const [x, y] = pt(az, Sim.horizonAt(hz, az)); if (az === 0) c.moveTo(x, y); else c.lineTo(x, y); }
      c.closePath(); c.setLineDash([2, 3]); c.strokeStyle = 'rgba(201,210,205,0.55)'; c.lineWidth = 1; c.stroke(); c.setLineDash([]);
    }
    // yükseklik halkaları
    c.font = '500 10px "IBM Plex Mono", monospace'; c.textAlign = 'left'; c.textBaseline = 'middle';
    for (const e of [-5, 0, 5, 10]) {
      c.beginPath(); c.arc(cx, cy, rOf(e), 0, Math.PI * 2);
      c.strokeStyle = e === 0 ? 'rgba(238,242,238,0.5)' : 'rgba(201,210,205,0.2)'; c.lineWidth = 1;
      if (e === 0) c.setLineDash([5, 4]);
      c.stroke(); c.setLineDash([]);
      if (e === 10) continue;
      const [x, y] = pt(135, e);
      c.fillStyle = 'rgba(0,0,0,0.75)'; c.fillRect(x + 1, y - 6, e === 0 ? 14 : 22, 12);
      c.fillStyle = e === 0 ? '#eef2ee' : 'rgba(201,210,205,0.8)';
      c.fillText((e > 0 ? '+' : e < 0 ? '−' : '') + Math.abs(e) + '°', x + 2, y);
    }
    // pusula çentikleri ve yönler
    c.strokeStyle = line; c.lineWidth = 1;
    for (let az = 0; az < 360; az += 10) {
      const a = az * D2R, l = az % 90 === 0 ? 7 : az % 30 === 0 ? 5 : 3;
      c.beginPath(); c.moveTo(cx + R0 * Math.sin(a), cy - R0 * Math.cos(a)); c.lineTo(cx + (R0 + l) * Math.sin(a), cy - (R0 + l) * Math.cos(a)); c.stroke();
    }
    c.beginPath(); c.arc(cx, cy, R0, 0, Math.PI * 2); c.stroke();
    c.font = '600 14px "Barlow Condensed", sans-serif'; c.textAlign = 'center'; c.fillStyle = line;
    [['n', 0], ['e', 90], ['s', 180], ['w', 270]].forEach(([k, az]) => {
      const a = az * D2R; c.fillText(t('compass.' + k), cx + (R0 + 12) * Math.sin(a), cy - (R0 + 12) * Math.cos(a) + 0.5);
    });
    // Dünya'nın yıl boyunca izi (çok silik) ve anten maskesi çizgisi (Dünya'nın dolaştığı yönlerde)
    c.beginPath();
    for (let i = 0; i < se.n; i += 6) { const [x, y] = pt(se.earthAz[i], se.earthAlt[i]); if (i) c.lineTo(x, y); else c.moveTo(x, y); }
    c.strokeStyle = 'rgba(90,165,255,0.2)'; c.lineWidth = 1; c.stroke();
    if (mask > 0) {
      let s = 0, k = 0;
      for (let i = 0; i < se.n; i += 24) { s += Math.sin(se.earthAz[i] * D2R); k += Math.cos(se.earthAz[i] * D2R); }
      const mid = Math.atan2(s, k) / D2R;
      c.beginPath();
      for (let d = -22; d <= 22; d += 0.5) { const [x, y] = pt(mid + d, hAt(mid + d) + mask); if (d === -22) c.moveTo(x, y); else c.lineTo(x, y); }
      c.setLineDash([4, 3]); c.strokeStyle = earth; c.lineWidth = 1.4; c.stroke(); c.setLineDash([]);
    }
    // iç halka: +15° üstü kullanılmıyor
    c.beginPath(); c.arc(cx, cy, R1, 0, Math.PI * 2); c.fillStyle = '#0e1112'; c.fill(); c.strokeStyle = 'rgba(201,210,205,0.35)'; c.stroke();
    c.beginPath(); c.moveTo(cx - 4, cy); c.lineTo(cx + 4, cy); c.moveTo(cx, cy - 4); c.lineTo(cx, cy + 4); c.strokeStyle = 'rgba(201,210,205,0.5)'; c.stroke();
  }

  function trail(c, az, alt, tH, color) {
    const i1 = Math.floor(tH), i0 = Math.max(0, i1 - TRAIL_H), parts = 6;
    for (let p = 0; p < parts; p++) {
      const a = i0 + Math.floor(((i1 - i0) * p) / parts), b = i0 + Math.floor(((i1 - i0) * (p + 1)) / parts);
      c.beginPath();
      for (let i = a; i <= b; i++) { const [x, y] = pt(az[i], alt[i]); if (i === a) c.moveTo(x, y); else c.lineTo(x, y); }
      c.globalAlpha = 0.18 + (0.72 * (p + 1)) / parts;
      c.strokeStyle = color; c.lineWidth = 1.4; c.stroke();
    }
    c.globalAlpha = 1;
  }

  function label(c, text, x, y, color) {
    c.font = '600 13px "Barlow Condensed", sans-serif';
    const left = x > cx; // etiketi merkeze doğru yaz ki kenardan taşmasın
    c.textAlign = left ? 'right' : 'left'; c.textBaseline = 'middle';
    const tx = x + (left ? -12 : 12);
    c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.9)'; c.strokeText(text, tx, y);
    c.fillStyle = color; c.fillText(text, tx, y);
  }

  // o: { site, now, tH, flatK, mask, view: {mode, yaw, fov, aspect} | null }
  function draw(o) {
    if (!cv || !o.site) return;
    layout();
    if (W < 20) return;
    const key = [o.site.id, o.flatK.toFixed(3), o.mask, cv.width, cv.height].join('|');
    if (key !== baseKey) { drawBase(o.site, o.flatK, o.mask); baseKey = key; }
    const c = ctx, se = o.site.series, now = o.now;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, cv.width, cv.height);
    c.drawImage(base, 0, 0);
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sun = cssVar('--sun'), earth = cssVar('--earth'), warn = cssVar('--warn');

    // bakış yönü (astronot gözü / panorama)
    if (o.view) {
      const half = o.view.hfov / 2;
      c.beginPath();
      for (const s of [-1, 1]) { const a = (o.view.yaw + s * half) * D2R; c.moveTo(cx + R1 * Math.sin(a), cy - R1 * Math.cos(a)); c.lineTo(cx + (R0 + 8) * Math.sin(a), cy - (R0 + 8) * Math.cos(a)); }
      c.strokeStyle = 'rgba(238,242,238,0.75)'; c.lineWidth = 1; c.stroke();
      c.beginPath(); c.arc(cx, cy, R0 + 8, (o.view.yaw - half - 90) * D2R, (o.view.yaw + half - 90) * D2R); c.lineWidth = 2; c.stroke();
    }

    trail(c, se.sunAz, se.sunAlt, o.tH, sun);
    trail(c, se.earthAz, se.earthAlt, o.tH, earth);

    // Dünya: ⊕ ; bağlantı yoksa içi boş ve çizgili
    const [ex, ey] = pt(now.earthAz, now.earthAlt);
    c.lineWidth = 1.8; c.strokeStyle = earth; c.fillStyle = now.linkUp ? earth : '#000';
    c.beginPath(); c.arc(ex, ey, 7, 0, Math.PI * 2); c.fill(); c.stroke();
    c.strokeStyle = now.linkUp ? '#04101f' : warn;
    c.beginPath();
    if (now.linkUp) { c.moveTo(ex - 7, ey); c.lineTo(ex + 7, ey); c.moveTo(ex, ey - 7); c.lineTo(ex, ey + 7); }
    else { c.moveTo(ex - 5, ey - 5); c.lineTo(ex + 5, ey + 5); c.moveTo(ex + 5, ey - 5); c.lineTo(ex - 5, ey + 5); }
    c.stroke();
    // iki işaret yakınsa etiketleri düşeyde ayır
    const [sx, sy] = pt(now.sunAz, now.sunAlt);
    const near = Math.abs(sy - ey) < 16 && Math.abs(sx - ex) < 110, split = near ? (ey <= sy ? -9 : 9) : 0;
    label(c, t('sky.earth').toLocaleUpperCase(LOCALE) + ' ' + Fmt.deg(now.earthAlt, 1), ex, ey + split, earth);

    // Güneş: ☉ ; görünmüyorsa içi boş
    const lit = now.sunFrac > 0;
    c.lineWidth = 1.8; c.strokeStyle = sun; c.fillStyle = lit ? sun : '#000';
    c.beginPath(); c.arc(sx, sy, 6, 0, Math.PI * 2); c.fill(); c.stroke();
    c.fillStyle = lit ? '#2a1c00' : sun;
    c.beginPath(); c.arc(sx, sy, 1.8, 0, Math.PI * 2); c.fill();
    label(c, t('sky.sun').toLocaleUpperCase(LOCALE) + ' ' + Fmt.deg(now.sunAlt, 1), sx, sy - split, sun);
  }

  function legend(el) {
    el.innerHTML = [
      `<li>${icon('sun', 'sun')}${esc(t('sky.sun'))}</li>`,
      `<li>${icon('earth', 'earth')}${esc(t('sky.earth'))}</li>`,
      `<li><span class="sw sw-terrain"></span>${esc(tp('sky.terrain'))}</li>`,
      `<li><span class="sw sw-trail-s"></span><span class="sw sw-trail-e"></span>${esc(t('sky.trail'))}</li>`,
      `<li><span class="sw sw-mask"></span>${esc(tp('sky.maskLine'))}</li>`,
    ].join('');
  }

  return { init, draw, legend, invalidate() { baseKey = ''; } };
})();

// ===== timeline: zaman şeritleri (Güneş, Dünya, ikisi birlikte, batarya, iniş penceresi) + kaydırıcı =====
// Şerit verinin bir penceresini [v0, v1] gösterir: bütün veri, bir yıl, 90 gün ya da 30 gün. Tekerlek yakınlaştırır.
const Timeline = (() => {
  const PAD = 8;            // kaydırıcı başının yarı genişliği: şerit ile başlık hizalı kalsın
  const ROW = 13, GAP = 3;  // CSS'teki .t-labels ile aynı
  const NROW = 5;
  const LIFE_CAP = 60;      // iniş penceresi satırında çubuğun dolduğu görev süresi (gün)
  const MIN_SPAN = 7 * 24;
  let cv, ctx, track, cursor, landMark, slider, tip, n = 8760, W = 100, last = null;
  let v0 = 0, v1 = 8759, onView = null, landing = 0;

  const xOf = (h) => PAD + ((h - v0) / Math.max(1, v1 - v0)) * (W - 2 * PAD);
  const hOf = (x) => clamp(v0 + ((x - PAD) / Math.max(1, W - 2 * PAD)) * (v1 - v0), v0, v1);

  function init(onSeek, onViewChange) {
    cv = $('strips'); ctx = cv.getContext('2d'); track = $('track'); cursor = $('cursor'); landMark = $('landMark'); slider = $('slTime'); tip = $('tTip');
    onView = onViewChange;
    slider.setAttribute('aria-label', t('time.slider'));
    slider.addEventListener('input', () => onSeek(Number(slider.value)));
    slider.addEventListener('pointermove', showTip);
    slider.addEventListener('pointerleave', () => { tip.hidden = true; });
    // tekerlek: farenin altındaki an sabit kalacak şekilde yakınlaş / uzaklaş
    track.addEventListener('wheel', (e) => {
      e.preventDefault();
      const x = e.clientX - track.getBoundingClientRect().left, hAt = hOf(x), f = (hAt - v0) / Math.max(1, v1 - v0);
      const span = clamp((v1 - v0) * Math.exp(e.deltaY * 0.0015), MIN_SPAN, n - 1);
      setView(hAt - f * span, hAt - f * span + span, true);
    }, { passive: false });
    new ResizeObserver(() => { if (last) draw(last.D, last.cap); }).observe(track);
  }

  // gösterilen pencere; veri sınırlarına sıkıştırılır
  function setView(a, b, user) {
    const span = clamp(b - a, Math.min(MIN_SPAN, n - 1), n - 1);
    a = clamp(a, 0, n - 1 - span);
    v0 = Math.round(a); v1 = Math.round(a + span);
    slider.min = v0; slider.max = v1;
    if (last) draw(last.D, last.cap);
    if (onView) onView(v0, v1, !!user);
  }
  // imleç pencerenin dışına çıkarsa pencereyi sayfa sayfa kaydır
  function follow(tH) {
    if (tH > v1) setView(Math.min(tH, v1), Math.min(tH, v1) + (v1 - v0));
    else if (tH < v0) setView(tH - (v1 - v0) * 0.1, tH + (v1 - v0) * 0.9);
  }

  // fare şeridin üstündeyken: o saatin durumu ve "o gün inilseydi" sonucu
  function showTip(e) {
    if (!last) return;
    const x = e.clientX - track.getBoundingClientRect().left, h = Math.round(hOf(x));
    const m = last.D.model, sc = last.D.scan, day = Math.min(sc.life.length - 1, Math.floor(h / 24));
    tip.textContent = [
      Fmt.date(h, true) + ' ' + Fmt.time(h),
      t('tip.sun', { v: Fmt.pct0(m.sunFrac[h] * 100) }),
      t(m.linkUp[h] ? 'tip.link' : 'tip.noLink'),
      sc.open[day] ? t('tip.lifeOpen') : t('tip.life', { d: Fmt.days(sc.life[day]) }),
    ].join(' · ');
    tip.hidden = false;
    const half = tip.offsetWidth / 2 + 4;
    tip.style.left = clamp(x, half, Math.max(half, W - half)).toFixed(0) + 'px';
  }

  function ruler(c, ry) {
    const span = v1 - v0, months = t('months');
    c.strokeStyle = 'rgba(201,210,205,0.55)'; c.fillStyle = cssVar('--ink-2'); c.lineWidth = 1;
    c.font = '500 10.5px "IBM Plex Mono", monospace'; c.textBaseline = 'top'; c.textAlign = 'left';
    const d0 = Fmt.hourToDate(v0), d1 = Fmt.hourToDate(v1);
    const pxPerDay = ((W - 2 * PAD) / span) * 24;
    if (pxPerDay < 6) {
      // ay çentikleri; uzun pencerede yalnız çeyrekler etiketlenir, Ocak'ta yıl yazılır
      const pxPerMonth = pxPerDay * 30.4, every = pxPerMonth > 46 ? 1 : pxPerMonth > 24 ? 2 : pxPerMonth > 15 ? 3 : 6;
      for (let y = d0.getUTCFullYear(), mo = d0.getUTCMonth(); ; mo++) {
        if (mo > 11) { mo = 0; y++; }
        const h = Fmt.hourOfMs(Date.UTC(y, mo, 1));
        if (h > v1) break;
        if (h < v0) continue;
        const x = Math.round(xOf(h)) + 0.5;
        c.beginPath(); c.moveTo(x, ry - 1); c.lineTo(x, ry + (mo === 0 ? 9 : 6)); c.stroke();
        if (mo % every === 0) c.fillText(mo === 0 ? String(y) : months[mo], x + 3, ry + 1);
      }
      if (pxPerDay * 5 > 5) {
        c.strokeStyle = 'rgba(201,210,205,0.25)';
        for (let h = Math.ceil(v0 / 120) * 120; h <= v1; h += 120) { const x = Math.round(xOf(h)) + 0.5; c.beginPath(); c.moveTo(x, ry - 1); c.lineTo(x, ry + 2); c.stroke(); }
      }
    } else {
      // gün çentikleri; etiket aralığı piksel yoğunluğuna göre
      const every = pxPerDay > 64 ? 1 : pxPerDay > 34 ? 2 : pxPerDay > 13 ? 5 : 10;
      for (let h = Math.ceil(v0 / 24) * 24; h <= v1; h += 24) {
        const d = Fmt.hourToDate(h), x = Math.round(xOf(h)) + 0.5, lab = d.getUTCDate() === 1 || (d.getUTCDate() - 1) % every === 0;
        c.strokeStyle = lab ? 'rgba(201,210,205,0.55)' : 'rgba(201,210,205,0.25)';
        c.beginPath(); c.moveTo(x, ry - 1); c.lineTo(x, ry + (lab ? 6 : 2)); c.stroke();
        if (lab && x < W - 34) c.fillText(d.getUTCDate() + ' ' + months[d.getUTCMonth()], x + 3, ry + 1);
      }
    }
    void d1;
  }

  function draw(D, cap) {
    last = { D, cap };
    const d = fitCanvas(cv), c = ctx, m = D.model;
    W = d.w;
    if (n !== m.n) { n = m.n; if (v1 > n - 1 || v1 <= v0) { v0 = 0; v1 = n - 1; slider.min = v0; slider.max = v1; } }
    c.setTransform(d.dpr, 0, 0, d.dpr, 0, 0);
    c.clearRect(0, 0, d.w, d.h);
    const sun = cssVar('--sun'), earth = cssVar('--earth'), both = cssVar('--both'), line = cssVar('--line'), warn = cssVar('--warn');
    const x0 = PAD, x1 = W - PAD, cols = Math.max(1, Math.round(x1 - x0)), span = v1 - v0;
    const rows = []; for (let i = 0; i < NROW; i++) rows.push(i * (ROW + GAP));
    c.fillStyle = '#171b1c';
    rows.forEach((y) => c.fillRect(x0, y, x1 - x0, ROW));
    const hA = (px) => v0 + (px / cols) * span;

    // Güneş (görünen oran → opaklık), Dünya (bağlantı var oranı), ikisi birlikte
    for (let px = 0; px < cols; px++) {
      const a = clamp(Math.floor(hA(px)), 0, n - 1), b = clamp(Math.max(a + 1, Math.floor(hA(px + 1))), a + 1, n);
      let s = 0, e = 0, k = 0;
      for (let i = a; i < b; i++) { s += m.sunFrac[i]; e += m.linkUp[i]; k += m.both[i]; }
      s /= b - a; e /= b - a; k /= b - a;
      if (s > 0.003) { c.globalAlpha = 0.25 + 0.75 * s; c.fillStyle = sun; c.fillRect(x0 + px, rows[0], 1.05, ROW); }
      if (e > 0.003) { c.globalAlpha = 0.25 + 0.75 * e; c.fillStyle = earth; c.fillRect(x0 + px, rows[1], 1.05, ROW); }
      if (k > 0.003) { c.globalAlpha = 0.25 + 0.75 * k; c.fillStyle = both; c.fillRect(x0 + px, rows[2], 1.05, ROW); }
    }
    c.globalAlpha = 1;

    // batarya düzeyi; bittiği andan sonra kırmızı taralı
    const lv = D.batt.level, dead = D.batt.deadHour, yb = rows[3];
    c.fillStyle = line;
    for (let px = 0; px < cols; px++) {
      const i = clamp(Math.floor(hA(px + 0.5)), 0, n);
      if (Number.isNaN(lv[i]) || (dead >= 0 && i >= dead)) continue;
      const hgt = Math.max(1, (lv[i] / cap) * ROW);
      c.globalAlpha = 0.85; c.fillRect(x0 + px, yb + ROW - hgt, 1.05, hgt);
    }
    c.globalAlpha = 1;
    if (dead >= 0 && dead < v1) {
      const xd = Math.max(x0, xOf(dead));
      c.save(); c.beginPath(); c.rect(xd, yb, x1 - xd, ROW); c.clip();
      c.fillStyle = '#3a0d1c'; c.fillRect(xd, yb, x1 - xd, ROW);
      c.strokeStyle = warn; c.lineWidth = 1;
      for (let x = xd - ROW; x < x1; x += 5) { c.beginPath(); c.moveTo(x, yb + ROW); c.lineTo(x + ROW, yb); c.stroke(); }
      c.restore();
      if (dead >= v0) { c.fillStyle = warn; c.fillRect(xd - 1, yb - 1, 2, ROW + 2); }
    }

    // iniş penceresi: o gün inen araç ne kadar dayanır? dolu = veri sonuna dek dayanır, kısa kırmızı çubuk = erken biter
    const sc = D.scan, yl = rows[4];
    for (let px = 0; px < cols; px++) {
      const day = clamp(Math.floor(hA(px + 0.5) / 24), 0, sc.life.length - 1);
      if (sc.open[day]) { c.fillStyle = line; c.globalAlpha = 0.85; c.fillRect(x0 + px, yl, 1.05, ROW); }
      else {
        const hgt = Math.max(1.5, (Math.min(sc.life[day], LIFE_CAP) / LIFE_CAP) * (ROW - 3));
        c.fillStyle = warn; c.globalAlpha = 0.85; c.fillRect(x0 + px, yl + ROW - hgt, 1.05, hgt);
      }
    }
    c.globalAlpha = 1;

    ruler(c, NROW * (ROW + GAP));
    setLanding(D.batt.start);
  }

  function setCursor(tH) {
    const inView = tH >= v0 && tH <= v1;
    cursor.hidden = !inView;
    cursor.style.left = xOf(tH).toFixed(1) + 'px';
    const v = String(Math.round(tH));
    if (slider.value !== v && !slider.matches(':active')) slider.value = v;
  }
  function setLanding(h) {
    landing = h;
    landMark.hidden = h < v0 || h > v1;
    landMark.style.left = xOf(h).toFixed(1) + 'px';
  }

  return { init, draw, setCursor, setLanding, setView, follow, get view() { return [v0, v1]; } };
})();

// ===== pano: 2B ufuk panoraması (WebGL yokken yedek; ayrıca üçüncü görünüm) =====
// Yatay ve düşey ölçek aynı (piksel/derece): Güneş ve Dünya diskleri gerçek oranda.
const Pano = (() => {
  const TRAIL_H = 720;
  let cv, ctx, center = 0, ppd = 9, W = 100, H = 100, dpr = 1, inited = false;
  // akıllı panorama: kullanıcı sürükleyene ya da yakınlaştırana kadar görünüm Güneş ile Dünya'yı birlikte
  // gösterecek şekilde kendiliğinden ortalanır ve genişler (gerekirse 360°'ye kadar)
  let auto = true;
  let X0 = 0, X1 = 100, Y0 = 0, Y1 = 100; // HUD panellerinin örtmediği alan

  const wrap = (d) => ((d + 540) % 360) - 180;
  const xOf = (az) => (X0 + X1) / 2 + wrap(az - center) * ppd;
  const yOf = (e) => Y0 + (Y1 - Y0) * 0.6 - e * ppd;
  const azAt = (x) => center + (x - (X0 + X1) / 2) / ppd;

  function init(canvas) {
    cv = canvas; ctx = cv.getContext('2d');
    const pts = new Map();
    let pinch = 0;
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
    cv.addEventListener('pointermove', (e) => {
      const p = pts.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p[0]; p[0] = e.clientX; p[1] = e.clientY;
      if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) ppd = clamp((ppd * d) / pinch, 2.5, 80); pinch = d; return; }
      center = (center - dx / ppd + 360) % 360;
      if (Math.abs(dx) > 0) auto = false;
    });
    const up = (e) => { pts.delete(e.pointerId); pinch = 0; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('wheel', (e) => { e.preventDefault(); auto = false; ppd = clamp(ppd * Math.exp(-e.deltaY * 0.0012), 2.5, 80); }, { passive: false });
    cv.addEventListener('dblclick', () => { auto = true; });
    inited = true;
  }

  function drawEarth(c, x, y, r, illum, ang) {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fillStyle = '#0a1a33'; c.fill();
    const k = clamp(illum, 0, 1);
    c.beginPath(); c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
    c.ellipse(0, 0, Math.max(0.01, r * Math.abs(1 - 2 * k)), r, 0, Math.PI / 2, -Math.PI / 2, k < 0.5);
    c.closePath(); c.fillStyle = '#5aa5ff'; c.fill();
    c.restore();
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.strokeStyle = 'rgba(90,165,255,0.7)'; c.lineWidth = 1; c.stroke();
  }

  function trail(c, az, alt, tH, color) {
    const i1 = Math.floor(tH), i0 = Math.max(0, i1 - TRAIL_H);
    c.beginPath();
    let px = null;
    for (let i = i0; i <= i1; i++) {
      const x = xOf(az[i]), y = yOf(alt[i]);
      if (px === null || Math.abs(x - px) > W * 0.5) c.moveTo(x, y); else c.lineTo(x, y);
      px = x;
    }
    c.globalAlpha = 0.55; c.strokeStyle = color; c.lineWidth = 1.2; c.stroke(); c.globalAlpha = 1;
  }

  // o: { site, now, tH, flatK, mask }
  function draw(o) {
    if (!inited || !o.site) return;
    const d = fitCanvas(cv); W = d.w; H = d.h; dpr = d.dpr;
    if (W < 20 || H < 20) return;
    const ins = o.inset || { l: 0, t: 0, r: 0, b: 0 };
    X0 = ins.l; X1 = W - ins.r; Y0 = ins.t; Y1 = H - ins.b;
    const c = ctx, hz = o.site.horizon, se = o.site.series, now = o.now;
    if (auto) {
      const sep = wrap(now.earthAz - now.sunAz), mid = now.sunAz + sep / 2;
      const span = clamp(Math.abs(sep) + 60, 80, 360);
      const goalPpd = clamp((X1 - X0) / span, 2.5, 12);
      center = (center + wrap(mid - center) * 0.08 + 360) % 360;
      ppd += (goalPpd - ppd) * 0.08;
    }
    const sun = cssVar('--sun'), earth = cssVar('--earth'), line = cssVar('--line');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);

    // Dünya'nın yıllık izi (silik) ve son 30 günün izleri
    c.beginPath();
    let px = null;
    for (let i = 0; i < se.n; i += 4) { const x = xOf(se.earthAz[i]), y = yOf(se.earthAlt[i]); if (px === null || Math.abs(x - px) > W * 0.5) c.moveTo(x, y); else c.lineTo(x, y); px = x; }
    c.strokeStyle = 'rgba(90,165,255,0.22)'; c.lineWidth = 1; c.stroke();
    trail(c, se.sunAz, se.sunAlt, o.tH, sun);
    trail(c, se.earthAz, se.earthAlt, o.tH, earth);

    // Güneş (parlama + disk) ve Dünya (evreli)
    const sx = xOf(now.sunAz), sy = yOf(now.sunAlt), sr = Math.max(2, Sim.SUN_R * ppd);
    const g = c.createRadialGradient(sx, sy, 0, sx, sy, sr * 9);
    g.addColorStop(0, 'rgba(255,214,130,0.55)'); g.addColorStop(0.25, 'rgba(255,190,90,0.14)'); g.addColorStop(1, 'rgba(255,180,80,0)');
    c.fillStyle = g; c.fillRect(sx - sr * 9, sy - sr * 9, sr * 18, sr * 18);
    c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fillStyle = '#fff1cf'; c.fill();
    const ex = xOf(now.earthAz), ey = yOf(now.earthAlt), er = Math.max(3, Sim.EARTH_R * ppd);
    drawEarth(c, ex, ey, er, now.illum, Math.atan2(sy - ey, wrap(now.sunAz - now.earthAz) * ppd));

    // arazi maskesi (Güneş ve Dünya'yı örter)
    const hAt = (az) => lerp(Sim.horizonAt(hz, az), 0, o.flatK);
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 2; x += 2) c.lineTo(x, yOf(hAt(azAt(x))));
    c.lineTo(W, H); c.closePath();
    const tg = c.createLinearGradient(0, yOf(6), 0, H);
    tg.addColorStop(0, '#3a403d'); tg.addColorStop(1, '#141716');
    c.fillStyle = tg; c.fill();
    c.beginPath();
    for (let x = 0; x <= W + 2; x += 2) { const y = yOf(hAt(azAt(x))); if (x) c.lineTo(x, y); else c.moveTo(x, y); }
    c.strokeStyle = o.flatK > 0.5 ? cssVar('--warn') : line; c.lineWidth = 1.3; c.stroke();
    if (o.flatK > 0.02) {
      c.beginPath();
      for (let x = 0; x <= W + 2; x += 2) { const y = yOf(Sim.horizonAt(hz, azAt(x))); if (x) c.lineTo(x, y); else c.moveTo(x, y); }
      c.setLineDash([3, 4]); c.strokeStyle = 'rgba(201,210,205,0.6)'; c.lineWidth = 1; c.stroke(); c.setLineDash([]);
    }
    // anten maskesi
    if (o.mask > 0) {
      c.beginPath();
      for (let x = 0; x <= W + 2; x += 3) { const y = yOf(hAt(azAt(x)) + o.mask); if (x) c.lineTo(x, y); else c.moveTo(x, y); }
      c.setLineDash([5, 4]); c.strokeStyle = earth; c.lineWidth = 1.2; c.stroke(); c.setLineDash([]);
    }

    // etiketler
    c.font = '600 14px "Barlow Condensed", sans-serif'; c.textBaseline = 'middle'; c.textAlign = 'left';
    const tag = (text, x, y, col) => { c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,0.9)'; c.strokeText(text, x, y); c.fillStyle = col; c.fillText(text, x, y); };
    tag(t('scene.sunTag', { v: Fmt.deg(now.sunAlt, 1) }).toLocaleUpperCase(LOCALE), sx + sr + 8, sy - 10, sun);
    tag(t('scene.earthTag', { v: Fmt.deg(now.earthAlt, 1) }).toLocaleUpperCase(LOCALE), ex + er + 8, ey - 10, earth);

    if (auto) {
      c.font = '500 10.5px "IBM Plex Mono", monospace'; c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillStyle = cssVar('--ink-3');
      c.fillText(t('scene.panoAuto', { v: Math.round(Math.min(360, (X1 - X0) / ppd)) }), X1 - 12, Y1 - 58);
    }
    // eksenler: azimut (alt), yükseklik (sol)
    c.font = '500 10.5px "IBM Plex Mono", monospace'; c.fillStyle = cssVar('--ink-2'); c.strokeStyle = 'rgba(201,210,205,0.5)'; c.lineWidth = 1;
    const stepAz = ppd > 20 ? 5 : ppd > 6 ? 10 : 30, names = { 0: 'n', 90: 'e', 180: 's', 270: 'w' };
    const a0 = Math.ceil(azAt(X0 + 20) / stepAz) * stepAz, yb = Y1 - 34;
    c.textAlign = 'center'; c.textBaseline = 'bottom';
    for (let a = a0; a <= azAt(X1 - 20); a += stepAz) {
      const x = (X0 + X1) / 2 + (a - center) * ppd, az = ((a % 360) + 360) % 360;
      c.beginPath(); c.moveTo(x, yb); c.lineTo(x, yb - 6); c.stroke();
      c.fillText(names[az] ? t('compass.' + names[az]) + ' ' + az + '°' : az + '°', x, yb - 8);
    }
    const stepEl = ppd > 20 ? 1 : 5;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    for (let e = -10; e <= 30; e += stepEl) {
      const y = yOf(e); if (y < Y0 + 8 || y > yb - 22) continue;
      c.beginPath(); c.moveTo(X0, y); c.lineTo(X0 + (e === 0 ? 14 : 7), y); c.stroke();
      c.fillText((e > 0 ? '+' : e < 0 ? '−' : '') + Math.abs(e) + '°', X0 + 17, y);
    }
  }

  return {
    init, draw,
    lookAt(az) { auto = false; center = ((az % 360) + 360) % 360; },
    autoCenter() { auto = true; },
    get auto() { return auto; },
    get view() { return { yaw: center, hfov: Math.min(360, (X1 - X0) / ppd) }; },
  };
})();

// ===== hud: kokpit panelleri (güç, iletişim, özet, olay akışı, karşılaştırma, sade mod) =====
const HUD = (() => {
  let S, act, feedIdx = -2, feedBtns = [], feedSig = '', many = false;
  const UP = (s) => s.toLocaleUpperCase(LOCALE);

  function seg(el, items, cur, onPick, label) {
    el.setAttribute('aria-label', label);
    el.innerHTML = items.map(([v, text]) => `<button type="button" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${esc(text)}</button>`).join('');
    el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled) onPick(b.dataset.v); });
  }
  function setSeg(el, cur) { el.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === String(cur)))); }
  const withUnit = (v, unit) => `${v}<small>${esc(unit)}</small>`;

  function init(state, actions) {
    S = state; act = actions;
    many = S.index.years.length > 1;
    seg($('viewSeg'), [['orbit', t('top.view.orbit')], ['astro', t('top.view.astro')], ['pano', t('top.view.pano')]], S.view, act.setView, t('top.viewLabel'));
    seg($('modeSeg'), [['terrain', t('top.mode.terrain')], ['flat', t('top.mode.flat')]], 'terrain', (v) => act.setFlat(v === 'flat'), t('top.modeLabel'));
    seg($('speedSeg'), [[1, t('time.speed.h')], [24, t('time.speed.d')], [168, t('time.speed.w')]], S.speed, (v) => act.setSpeed(Number(v)), t('time.speedLabel'));

    seg($('zoomSeg'), (many ? [['all', t('time.zoom.all')]] : []).concat([['year', t('time.zoom.year')], ['90', t('time.zoom.d90')], ['30', t('time.zoom.d30')]]), S.zoom, act.setZoom, t('time.zoomLabel'));
    const ys = $('yearSel');
    ys.innerHTML = S.index.years.map((y) => `<option value="${y}">${y}</option>`).join('');
    ys.setAttribute('aria-label', t('time.yearLabel'));
    ys.hidden = !many;
    ys.onchange = () => act.setYear(Number(ys.value));
    const hs = $('heightSel');
    hs.innerHTML = S.index.heights.map((h) => `<option value="${h}">${Fmt.num(h, 0)} m</option>`).join('');
    $('heightRow').hidden = S.index.heights.length < 2;
    hs.onchange = () => act.setHeight(Number(hs.value));
    const cd = $('cDate');
    cd.min = Fmt.toInput(0); cd.max = Fmt.toInput(S.index.hours - 1);
    cd.onchange = () => { const h = Fmt.fromInput(cd.value); if (h != null) act.seek(h); };
    const vv = S.index.validation, vm = vv && vv.sun_0m ? { sun: Fmt.num(vv.sun_0m.mean_abs, 1), earth: Fmt.num(vv.earth_0m.mean_abs, 1), n: vv.n } : null;
    if (vm) setText($('badgeText'), t('badge.validated', vm));
    $('btnBack').onclick = act.back;
    $('btnSimple').onclick = () => act.setSimple(!S.simple);
    $('btnPlay').onclick = () => act.setPlaying(!S.playing);
    $('btnNext').onclick = act.nextEvent;
    $('btnLanding').onclick = act.setLandingNow;
    $('lookSun').onclick = () => act.look('sun');
    $('lookEarth').onclick = () => act.look('earth');
    $('lookLander').onclick = () => act.look('lander');
    $('btnTour').onclick = act.tour;
    $('ansCap').onclick = act.applyMinCap;
    $('ansLand').onclick = act.goSafeLanding;
    $('ansCap').title = t('ans.capTitle');
    $('ansLand').title = t('ans.landTitle');
    $('btnData').onclick = () => $('dataDlg').showModal();
    // paneller katlanır: başlığa tıklayınca yalnız başlık kalır (3D sahneye yer açılır); üstteki tuş hepsini birden katlar
    document.querySelectorAll('#colLeft .panel, #colRight .panel').forEach((pn) => {
      const h = pn.querySelector('.p-head h3');
      if (!h) return;
      h.tabIndex = 0; h.setAttribute('role', 'button'); h.setAttribute('aria-expanded', 'true');
      h.title = t('top.collapseTitle');
      const flip = () => { const c = pn.dataset.collapsed !== 'true'; pn.dataset.collapsed = String(c); h.setAttribute('aria-expanded', String(!c)); };
      h.addEventListener('click', flip);
      h.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    });
    $('btnPanels').onclick = () => {
      const cp = $('cockpit'), min = cp.dataset.panels !== 'min';

      $('btnPanels').setAttribute('aria-pressed', String(min));
      document.querySelectorAll('#colLeft .panel, #colRight .panel').forEach((pn) => {

    $('videoClose').onclick = () => $('videoDlg').close();
    $('videoDlg').addEventListener('close', () => vid.pause());
    $('slCap').addEventListener('input', (e) => act.setBatt('cap', Number(e.target.value)));
