<title>Ay İniş Navigatörü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Yerleşim: tek ekranlık uygulama. 3D sahne zemin; üstünde ölçü aleti gibi ince çizgili, opak paneller
   (sol: özet + güç + iletişim, sağ: gökyüzü radarı + olay akışı, alt: yıllık zaman şeridi).
   Tek koyu görünüm bilinçli bir seçim: kokpit ve projeksiyon için. */
:root {
  color-scheme: dark;
  /* zemin ve nötrler: hafif soğuk grafit */
  --void: #000000;
  --bg: #0a0c0d;
  --panel: #0e1112;
  --panel-a: rgba(11, 14, 15, 0.92);
  --panel-2: #161a1b;
  --rule: #2b3331;
  --rule-2: #3d4744;
  /* HUD çizgisi ve yazı: kırık beyaz, soğuk */
  --line: #c9d2cd;
  --ink: #eef2ee;
  --ink-2: #a3aeaa;
  --ink-3: #6f7a76;
  /* anlamsal renkler: Güneş yalnız Güneş'e ayrılmış */
  --sun: #ffb21e;
  --sun-2: #8a5f0c;
  --earth: #5aa5ff;
  --earth-2: #214c86;
  --warn: #ff3d6e;
  --warn-2: #5a1228;
  --caution: #e9e04e;
  --both: #49c9a0;   /* Güneş + Dünya birlikte (ortak pencere) */
  --good: #7fe0a2;   /* karşılaştırmada satırın en iyisi */
  /* yazı */
  --f-hud: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button { font: inherit; color: inherit; }
canvas { display: block; }
.ic { width: 1em; height: 1em; flex: none; vertical-align: -0.12em; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; position: relative; }
.scene { flex: 1; min-height: 0; }

/* ---------- ortak parçalar ---------- */
.panel {
  --c: var(--line);
  border: 1px solid var(--rule);
  background:
    linear-gradient(var(--c), var(--c)) 0 0 / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 0 / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0 / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 0 / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 100% / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 0 100% / 1px 9px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 9px 1px no-repeat,
    linear-gradient(var(--c), var(--c)) 100% 100% / 1px 9px no-repeat,
    var(--panel-a);
  background-origin: border-box;
}
.p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-width: 0; }
.p-head h3, .board-head h2 {
  font-family: var(--f-hud); font-weight: 600; font-size: 17px; letter-spacing: 0.09em; text-transform: uppercase;
  display: flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--ink);
}
.p-tag { font-size: 11.5px; color: var(--ink-3); text-align: right; min-width: 0; }
.sub { font-size: 12px; color: var(--ink-2); }
.eyebrow { font-family: var(--f-hud); font-weight: 500; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase;
  height: 34px; padding: 0 12px; white-space: nowrap;
  background: var(--panel); border: 1px solid var(--rule-2); color: var(--ink); cursor: pointer;
}
.btn:hover { border-color: var(--line); }
.btn:active { background: var(--panel-2); }
.btn[aria-pressed="true"] { background: var(--line); color: #0a0c0d; border-color: var(--line); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn-sm { height: 28px; font-size: 13.5px; padding: 0 9px; }
.btn-icon { width: 40px; padding: 0; font-size: 17px; }
.btn-primary {
  height: 48px; padding: 0 26px; font-size: 21px; letter-spacing: 0.12em;
  background: var(--line); color: #0a0c0d; border-color: var(--line);
}
.btn-primary:hover { background: var(--ink); }
.btn-primary[disabled] { background: var(--panel-2); color: var(--ink-3); border-color: var(--rule-2); opacity: 1; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }
.linkbtn:hover { color: var(--ink); }

.seg { display: inline-flex; border: 1px solid var(--rule-2); background: var(--panel); }
.seg button {
  font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.07em; text-transform: uppercase;
  height: 32px; padding: 0 11px; background: none; border: 0; border-left: 1px solid var(--rule-2); color: var(--ink-2); cursor: pointer; white-space: nowrap;
}
.seg button:first-child { border-left: 0; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--line); color: #0a0c0d; }
.seg button[disabled] { opacity: 0.35; cursor: default; }
.seg-mode button[aria-pressed="true"][data-v="flat"] { background: var(--warn); color: #fff; }

.chip {
  font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 1px 7px; border: 1px solid var(--rule-2); color: var(--ink-2); white-space: nowrap;
}
.chip[data-s="ok"] { border-color: var(--line); color: var(--ink); }
.chip[data-s="caution"] { border-color: var(--caution); color: var(--caution); background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(233, 224, 78, 0.16) 5px 7px); }
.chip[data-s="warn"] { border-color: var(--warn); background: var(--warn); color: #fff; }

input[type="range"] { -webkit-appearance: none; appearance: none; background: none; height: 20px; margin: 0; min-width: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--rule-2); }
input[type="range"]::-moz-range-track { height: 2px; background: var(--rule-2); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 16px; margin-top: -7px; background: var(--line); border: 0; border-radius: 0; }
input[type="range"]::-moz-range-thumb { width: 10px; height: 16px; background: var(--line); border: 0; border-radius: 0; }

.loading { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--bg); font-family: var(--f-hud); font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); padding: 24px; text-align: center; }
.loading.soft { background: rgba(0, 0, 0, 0.72); }
.loading.err { color: var(--warn); text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-size: 15px; }

/* ---------- sabit rozet ---------- */
.statusbar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 26px;
  padding: 3px var(--gut-r) 3px var(--gut-l);
  background: #050607; border-top: 1px solid var(--rule); z-index: 5;
}
.prelim { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--caution); min-width: 0; }

/* ---------- SAHNE 1: BRİFİNG ---------- */
#briefing { display: flex; flex-direction: column; gap: 12px; padding: 14px var(--gut-r) 12px var(--gut-l); overflow-y: auto; }
.b-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 46px; height: 46px; color: var(--line); flex: none; }
.brand-mark .bm-sun { fill: var(--sun); }
.brand-mark .bm-earth { fill: var(--earth); }
.brand h1 { font-family: var(--f-hud); font-weight: 600; font-size: 38px; line-height: 1; letter-spacing: 0.05em; text-transform: uppercase; text-wrap: balance; }
.b-lede { max-width: 68ch; flex: 1 1 380px; font-size: 13.5px; color: var(--ink-2); }

.b-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(380px, 0.9fr); gap: 14px; }
.b-map { position: relative; min-height: 320px; overflow: hidden; }
#mapCanvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#mapCanvas:active { cursor: grabbing; }
.map-tools { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
/* seçili bölgede: NASA ısı haritasının ölçeği, nokta işaretleri, fareyle üstüne gelinen adayın rakamları */
.map-legend { position: absolute; left: 10px; bottom: 30px; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; align-items: center; gap: 3px 12px; padding: 5px 8px; background: var(--panel-a); border: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-2); pointer-events: none; }
.map-legend .lg-h { color: var(--ink); }
.lg-ramp { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-data); font-size: 11px; }
.lg-ramp i { width: 84px; height: 8px; background: linear-gradient(90deg, #0a0c0d, var(--sun)); border: 1px solid var(--rule-2); }
.lg-k { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.lg-k .dot { width: 8px; height: 8px; border: 1.4px solid var(--line); border-radius: 50%; }
.lg-k .dot.full { background: var(--line); }
.lg-k .dia { width: 7px; height: 7px; margin: 0 2px; border: 1.4px solid var(--line); transform: rotate(45deg); }
.map-tip { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 3px; padding: 6px 9px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); white-space: nowrap; pointer-events: none; }
.map-tip > b { font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.map-tip small { font-size: 11px; color: var(--ink-3); }
.tip-trio, .sd-trio { display: flex; align-items: center; gap: 5px; font-family: var(--f-hud); font-size: 17px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip-trio b, .sd-trio b { font-weight: 600; margin-right: 9px; }
.tip-trio .ic, .sd-trio .ic { font-size: 0.7em; }
.map-note { position: absolute; left: 10px; bottom: 8px; right: 10px; font-size: 11.5px; color: var(--ink-2); pointer-events: none; text-shadow: 0 0 4px #000, 0 0 2px #000; }

.b-board { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.board-head h2 { font-size: 20px; }
.period { font-size: 12px; color: var(--ink-3); }
#sortBar { align-self: flex-start; flex-wrap: wrap; }
.formula { font-size: 12px; color: var(--ink-2); min-height: 2.8em; }
/* dengeli sıralamada ölçü ağırlıkları */
.weightbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.weightbar .wb-l { color: var(--ink-3); }
.wb { display: inline-flex; align-items: center; gap: 5px; }
.wb input { width: 74px; }
.wb output { font-family: var(--f-data); color: var(--ink); min-width: 1ch; }
.weightbar .btn { height: 22px; font-size: 12px; padding: 0 7px; }

.cards { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 2px; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.card {
  display: grid; grid-template-columns: 30px 40px minmax(0, 1.1fr) repeat(3, minmax(0, 1fr)); align-items: center; column-gap: 10px;
  width: 100%; text-align: left; padding: 6px 10px 7px 6px; cursor: pointer; min-height: 46px;
  background: var(--panel); border: 1px solid var(--rule); color: var(--ink);
}
.card:hover { border-color: var(--rule-2); background: var(--panel-2); }
.card[aria-pressed="true"] { border-color: var(--line); background: var(--panel-2); box-shadow: inset 3px 0 0 var(--line); }
.card .rank { font-family: var(--f-data); font-size: 12px; color: var(--ink-3); text-align: right; }
.card .code { font-family: var(--f-hud); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; color: var(--line); }
.card .nm { min-width: 0; }
.card .nm b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.1; overflow-wrap: anywhere; }
.card .nm small { display: block; font-size: 11px; color: var(--ink-3); }
.card .flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--caution); margin-top: 2px; }
.met { min-width: 0; }
.met .v { display: flex; align-items: baseline; gap: 5px; font-family: var(--f-hud); font-weight: 600; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.met .v .ic { font-size: 13px; align-self: center; }
.met .v small { font-family: var(--f-body); font-weight: 400; font-size: 11px; color: var(--ink-2); }
.met .bar { height: 3px; background: var(--rule); margin-top: 5px; position: relative; }
.met .bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.met .v .med { font-family: var(--f-hud); font-weight: 500; font-size: 14px; color: var(--ink-2); }
.met-sun .v .ic, .met-sun .bar i { color: var(--sun); background: var(--sun); }
.met-sun .v .ic { background: none; }
.met-earth .v .ic { color: var(--earth); }
.met-earth .bar i { background: var(--earth); }
.met-dark .v .ic { color: var(--ink-2); }
.met-dark .bar i { background: repeating-linear-gradient(90deg, var(--ink-2) 0 3px, transparent 3px 5px); }
.met-score .v { color: var(--ink); }
.cards-head { display: grid; grid-template-columns: 30px 40px minmax(0, 1.1fr) repeat(3, minmax(0, 1fr)); column-gap: 10px; padding: 0 11px 0 7px; font-size: 11px; color: var(--ink-3); position: sticky; top: 0; background: var(--bg); z-index: 1; }
.card .subline { grid-column: 3; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.ministrip { grid-column: 4 / -1; width: 100%; height: 7px; margin-top: 4px; background: linear-gradient(#191d1e 0 3px, transparent 3px 4px, #191d1e 4px 7px); }
.cards-head span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 3px; }

.launch { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.site-detail { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.site-detail .sd-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; color: var(--ink); }
.site-detail .sd-h b { font-family: var(--f-hud); font-weight: 600; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; }
.site-detail .sd-h span { font-family: var(--f-data); font-size: 12px; color: var(--ink-2); }
.site-detail .warnline, .warnline { color: var(--caution); display: flex; gap: 6px; align-items: flex-start; }
.warnline .ic { margin-top: 0.2em; }
.site-detail .sd-pt { display: flex; align-items: center; gap: 4px 14px; flex-wrap: wrap; }
.site-detail .sd-pt > b { font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
.site-detail .sd-trio { font-size: 21px; }
.site-detail .sd-nasa { color: var(--ink-3); }
.site-detail .tag { font-style: normal; font-family: var(--f-hud); font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--rule-2); padding: 0 5px; }
/* iniş hatası halkası: en kötü üç rakam; eğim sınırını aşan yön varsa dikkat rengi */
.site-detail .sd-ring { display: flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; }
.site-detail .sd-ring .sd-trio { font-size: 16px; color: var(--ink-2); }
.site-detail .sd-ring .sd-trio b { margin-right: 6px; }
.site-detail .sd-ring.steep > span:last-child { color: var(--caution); }
.sd-more { display: flex; flex-direction: column; gap: 4px; }
.sd-more > summary { cursor: pointer; font-size: 11.5px; color: var(--ink-3); list-style-position: inside; }
.sd-more > summary:hover { color: var(--ink); }
.sd-more[open] > summary { margin-bottom: 2px; }
.sd-more > div { margin-top: 4px; }
/* aday çubuğu: düz çerçeve = iniş paketi hazır, kesik çerçeve = yalnız rakam, dolu = seçili */
.candbar { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
.cand { min-width: 23px; height: 24px; padding: 0 3px; font-family: var(--f-data); font-size: 11.5px; background: none; border: 1px dashed var(--rule-2); color: var(--ink-3); cursor: pointer; }
.cand.full { border: 1px solid var(--line); color: var(--ink); }
.cand.legacy { padding: 0 7px; margin-right: 5px; font-family: var(--f-hud); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.cand.par { background: linear-gradient(135deg, var(--line) 0 5px, transparent 5px); } /* köşe işareti: Pareto noktası */
.cand:hover { border-color: #fff; color: #fff; }
.cand[aria-pressed="true"] { background: var(--line); border: 1px solid var(--line); color: #0a0c0d; }
.launch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.launch-hint { font-size: 12px; color: var(--ink-3); }

/* ---------- SAHNE 3: KOKPİT ---------- */
#cockpit {
  position: relative; display: grid; gap: 10px;
  grid-template-columns: 304px minmax(0, 1fr) 332px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "left mid right" "time time time";
  padding: 10px var(--gut-r) 8px var(--gut-l);
  overflow: hidden; background: var(--void);
}
#cockpit[hidden] { display: none; }
.viewport { position: absolute; inset: 0; z-index: 0; touch-action: none; cursor: grab; overflow: hidden; }
.viewport:active { cursor: grabbing; }
#gl, #pano { position: absolute; inset: 0; width: 100%; height: 100%; }
#cockpit > :not(.viewport) { position: relative; z-index: 1; }

.c-top { grid-area: top; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 7px 10px; border: 1px solid var(--rule); background: var(--panel-a); }
.site-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.site-id .code { font-family: var(--f-hud); font-weight: 700; font-size: 30px; line-height: 1; color: var(--line); letter-spacing: 0.03em; }
.site-id strong { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 20px; line-height: 1.05; letter-spacing: 0.05em; text-transform: uppercase; }
.site-id small { display: block; font-family: var(--f-data); font-size: 11px; color: var(--ink-2); }
.clock { margin-left: auto; margin-right: auto; display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: baseline; text-align: left; }
.clock small { font-family: var(--f-hud); font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); line-height: 1; }
.clock strong { grid-column: 1 / -1; grid-row: 2; font-family: var(--f-data); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.2; }
.clock span { font-family: var(--f-hud); font-weight: 600; font-size: 21px; line-height: 1; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.top-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.c-left, .c-right { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.c-left { grid-area: left; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.c-right { grid-area: right; }
.c-left .panel, .c-right .panel { padding: 7px 11px 8px; display: flex; flex-direction: column; gap: 5px; flex: none; }

.trio { display: flex; justify-content: space-between; gap: 8px; }
.fig { min-width: 0; }
.fig-l { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.fig b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fig b small { font-size: 15px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
.fig-sun .ic { color: var(--sun); }
.fig-earth .ic { color: var(--earth); }
.fig-both .ic { color: var(--both); }
.trio4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
.trio4 .fig b { font-size: 26px; }
.clock .datefield { grid-column: 1 / -1; grid-row: 2; }
.clock .datefield input { font-size: 14px; height: 26px; }
.sl-h { grid-template-columns: 86px minmax(0, 1fr); }
.geo { font-family: var(--f-data); font-size: 11px; line-height: 1.35; color: var(--ink-2); font-variant-numeric: tabular-nums; }
#pSummary[data-flat="true"] { --c: var(--warn); border-color: var(--warn-2); }
#pSummary[data-flat="true"] .p-tag { color: var(--warn); }

.readout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 10px; align-items: end; }
.readout small { display: block; font-size: 11px; color: var(--ink-2); line-height: 1.2; }
.readout .big b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 46px; line-height: 0.92; font-variant-numeric: tabular-nums; white-space: nowrap; }
.readout .big span { display: block; font-size: 12px; color: var(--ink-2); min-height: 1.4em; }
.readout .side { display: flex; flex-direction: column; gap: 6px; }
.readout .side b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 23px; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
#pwIn { color: var(--sun); }
.meter { height: 8px; border: 1px solid var(--rule-2); position: relative; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), var(--rule) calc(10% - 1px) 10%); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--line); width: 0; }
#pPower[data-state="low"] .meter i { background: repeating-linear-gradient(135deg, var(--caution) 0 4px, transparent 4px 6px); }
#pPower[data-state="dead"], #pComm[data-state="blocked"] { --c: var(--warn); border-color: var(--warn); }
#pPower[data-state="dead"] .big b, #pComm[data-state="blocked"] .big b { color: var(--warn); }
#pComm[data-state="low"] .big b, #pComm[data-state="mask"] .big b { color: var(--caution); }
#pComm[data-state="ok"] .big b { color: var(--earth); }

.whatif { border-top: 1px dashed var(--rule-2); padding-top: 5px; display: flex; flex-direction: column; gap: 1px; }
.whatif-h { font-size: 11px; color: var(--caution); }
.sl { display: grid; grid-template-columns: 86px minmax(0, 1fr) 68px; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.sl output { font-family: var(--f-data); font-size: 12.5px; color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.verdict { font-size: 12.5px; font-weight: 500; color: var(--ink); padding-top: 1px; }
.verdict[data-s="dead"] { color: var(--warn); }
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; padding: 2px 0 1px; }
.live-h { grid-column: 1 / -1; font-size: 11px; color: var(--ink-3); }
.live small { display: block; font-size: 11px; color: var(--ink-2); }
.live b { font-family: var(--f-hud); font-weight: 600; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.live b small { display: inline; font-size: 14px; margin-left: 3px; }
#cmLivePct { color: var(--earth); }

#pSky { align-items: stretch; }
#sky { width: min(100%, 31vh); aspect-ratio: 1; max-width: 100%; align-self: center; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend .sw { width: 16px; height: 8px; flex: none; }
.legend .sw-terrain { background: repeating-linear-gradient(135deg, #59625f 0 2px, #2c3331 2px 4px); }
.legend .sw-trail-s { height: 2px; background: var(--sun); }
.legend .sw-trail-e { height: 2px; background: var(--earth); }
.legend .sw-mask { height: 0; border-top: 2px dashed var(--earth); }
.legend .ic.sun { color: var(--sun); } .legend .ic.earth { color: var(--earth); }
.ic.sun { color: var(--sun); } .ic.earth { color: var(--earth); }

#pEvents { flex: 1 1 0; min-height: 90px; }
.feed { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; scrollbar-color: var(--rule-2) transparent; }
.ev { display: grid; grid-template-columns: 60px 16px minmax(0, 1fr); gap: 7px; align-items: start; width: 100%; text-align: left; padding: 5px 2px 5px 5px; background: none; border: 0; border-top: 1px solid var(--rule); border-left: 3px solid transparent; cursor: pointer; color: var(--ink); }
.ev:hover { background: var(--panel-2); }
.ev .when b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.15; white-space: nowrap; }
.ev .when small { display: block; font-family: var(--f-data); font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.ev .ic { margin-top: 3px; font-size: 13px; }
.ev .tx { font-size: 12.5px; line-height: 1.3; }
.ev .tx small { display: block; color: var(--ink-2); font-size: 12px; }
.ev[data-k^="sun"] .ic { color: var(--sun); }
.ev[data-k="sun_off"] .ic { color: var(--ink-2); }
.ev[data-k^="link"] .ic { color: var(--earth); }
.ev[data-k="link_off"] .ic, .ev[data-k="dead"] .ic { color: var(--warn); }
.ev.long { border-left-color: var(--line); }
.ev.long .tx small { color: var(--ink); font-weight: 600; }
.ev.long .tag { display: inline-block; font-family: var(--f-hud); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--line); padding: 0 5px; margin-top: 2px; }
.ev[data-k="dead"] { border-left-color: var(--warn); background: var(--warn-2); }
.ev[data-k="dead"] .tx { font-weight: 600; }
.ev.future { opacity: 0.45; }
.ev.current { background: var(--panel-2); }

.c-mid { grid-area: mid; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; gap: 10px; min-height: 0; min-width: 0; }
.c-mid > * { pointer-events: auto; }
.view-tools { order: 9; margin-top: auto; align-self: stretch; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.view-hint { font-size: 11.5px; color: var(--ink-2); margin-left: 6px; text-shadow: 0 0 4px #000, 0 0 2px #000; pointer-events: none; }
#cockpit:not([data-view="astro"]):not([data-view="pano"]) #lookSun,
#cockpit:not([data-view="astro"]):not([data-view="pano"]) #lookEarth,
#cockpit:not([data-view="astro"]) #lookLander { display: none; }
#cockpit[data-view="orbit"] #lookLander { display: inline-flex; }
.view-msg { order: 8; font-size: 12.5px; color: var(--caution); background: var(--panel-a); border: 1px solid var(--rule-2); padding: 5px 9px; max-width: 60ch; }

.markers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mk { position: absolute; left: 0; top: 0; will-change: transform; }
.mk i { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px;
  background:
    linear-gradient(currentColor, currentColor) 0 0 / 8px 1px no-repeat, linear-gradient(currentColor, currentColor) 0 0 / 1px 8px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 0 / 8px 1px no-repeat, linear-gradient(currentColor, currentColor) 100% 0 / 1px 8px no-repeat,
    linear-gradient(currentColor, currentColor) 0 100% / 8px 1px no-repeat, linear-gradient(currentColor, currentColor) 0 100% / 1px 8px no-repeat,
    linear-gradient(currentColor, currentColor) 100% 100% / 8px 1px no-repeat, linear-gradient(currentColor, currentColor) 100% 100% / 1px 8px no-repeat; }
.mk span { position: absolute; left: 21px; top: -9px; font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 2px #000; }
.mk-lander { color: var(--line); }
.mk-sun { color: var(--sun); }
.mk-earth { color: var(--earth); }
.mk-earth i { left: -26px; top: -26px; width: 52px; height: 52px; }
.mk-earth span { left: 32px; }

.compare { order: 1; width: min(100%, 620px); padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 8px; --c: var(--warn); border-color: var(--warn-2); }
.compare table { width: 100%; border-collapse: collapse; }
.compare th { font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); text-align: right; padding: 0 0 2px 8px; }
.compare th:nth-child(2) { color: var(--warn); }
.compare td { padding: 3px 0 3px 8px; text-align: right; border-top: 1px solid var(--rule); font-family: var(--f-hud); font-weight: 600; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
.compare td:first-child { text-align: left; padding-left: 0; font-family: var(--f-body); font-weight: 400; font-size: 12.5px; color: var(--ink-2); white-space: normal; }
.compare td:first-child .ic { margin-right: 5px; }
.compare td small { font-size: 0.5em; font-weight: 500; margin-left: 4px; color: var(--ink-2); }
.compare td.flat { color: var(--warn); }
.compare td.arrow { font-size: 18px; color: var(--ink-3); padding-left: 4px; }
.compare td.diff { font-size: 20px; color: var(--ink-2); }
.cmp-note { font-size: 14.5px; font-weight: 500; }

.descent { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 12px; padding: 0 0 6px; pointer-events: none; }
.descent[hidden] { display: none; }
.descent .d-alt small { display: block; font-family: var(--f-hud); font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); }
.descent .d-alt b { font-family: var(--f-hud); font-weight: 600; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #000; }
.d-log { display: flex; flex-direction: column; gap: 3px; min-height: 9em; justify-content: flex-end; }
.d-log li { font-family: var(--f-hud); font-weight: 600; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 6px #000, 0 0 2px #000; color: var(--ink-2); }
.d-log li:last-child { color: var(--ink); }
.d-log li::before { content: "› "; color: var(--ink-3); }
#btnSkip { pointer-events: auto; position: absolute; right: 0; bottom: 6px; }

.tour { order: 6; margin-top: auto; width: min(100%, 780px); padding: 12px 16px 13px; display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; }
.tour-cap { font-size: clamp(16px, 1.45vw, 21px); line-height: 1.35; text-wrap: balance; }
.tour-step { font-family: var(--f-data); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
#cockpit[data-tour="on"] .view-tools { margin-top: 0; }
#cockpit[data-tour="on"] #btnTour { background: var(--line); color: #0a0c0d; border-color: var(--line); }
#cockpit[data-hud="off"] .c-left, #cockpit[data-hud="off"] .c-right, #cockpit[data-hud="off"] .c-time, #cockpit[data-hud="off"] .view-tools { visibility: hidden; }

.simple { order: 5; margin-top: auto; width: min(100%, 860px); padding: 16px 22px 16px; display: flex; flex-direction: column; gap: 10px; text-align: center; }
.simple-tag { font-family: var(--f-hud); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); }
.simple-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.simple-trio b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: clamp(54px, 7.2vw, 104px); line-height: 0.95; font-variant-numeric: tabular-nums; white-space: nowrap; }
.simple-trio b small { font-size: 0.34em; font-weight: 500; margin-left: 6px; color: var(--ink-2); }
.simple-trio span { display: inline-flex; align-items: center; gap: 7px; font-size: 16px; color: var(--ink-2); }
.simple-trio .fig-sun b { color: var(--sun); }
.simple-trio .fig-earth b { color: var(--earth); }
.simple-sentence { font-size: clamp(16px, 1.6vw, 22px); line-height: 1.35; text-wrap: balance; max-width: 60ch; margin-inline: auto; }
.simple-now { font-size: 14px; color: var(--ink-2); }

.c-time { grid-area: time; padding: 7px 11px 8px; display: flex; flex-direction: column; gap: 6px; }
.t-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.answers { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.ans { display: grid; text-align: left; height: 34px; padding: 1px 10px 0; align-content: center; background: var(--panel); border: 1px solid var(--rule-2); color: var(--ink); cursor: pointer; }
.ans:hover { border-color: var(--line); }
.ans small { font-size: 10.5px; line-height: 1.1; color: var(--ink-2); white-space: nowrap; }
.ans b { font-family: var(--f-hud); font-weight: 600; font-size: 16px; line-height: 1.1; letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
.t-strips { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; }
.t-labels { display: grid; grid-template-rows: 13px 13px 13px 13px 13px; row-gap: 3px; font-size: 11px; color: var(--ink-2); line-height: 13px; }
.t-labels span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.t-labels .l-sun .ic { color: var(--sun); }
.t-labels .l-earth .ic { color: var(--earth); }
.t-labels .l-both .ic { color: var(--both); }
.t-track { position: relative; height: 96px; }
.t-tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); padding: 3px 8px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 3; }
#strips { position: absolute; inset: 0; width: 100%; height: 100%; }
#slTime { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; }
#slTime::-webkit-slider-thumb { width: 16px; height: 92px; }
#slTime::-moz-range-thumb { width: 16px; height: 92px; }
#slTime:focus-visible + .dummy, .t-track:focus-within { outline: 1px solid var(--ink-3); outline-offset: 2px; }
.t-cursor { position: absolute; top: -2px; bottom: 14px; width: 2px; margin-left: -1px; background: var(--ink); pointer-events: none; box-shadow: 0 0 0 1px #000; }
.t-cursor::before { content: ""; position: absolute; left: -4px; top: -3px; border: 5px solid transparent; border-top-color: var(--ink); }
.t-landing { position: absolute; top: 0; bottom: 14px; width: 0; border-left: 1px dashed var(--line); pointer-events: none; }
.t-landing span { position: absolute; left: 3px; bottom: -14px; font-family: var(--f-hud); font-weight: 600; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--line); white-space: nowrap; background: var(--panel); padding: 0 2px; }

@media (max-height: 880px) and (min-width: 901px) {
  .readout .big b { font-size: 38px; }
  .readout .side b { font-size: 20px; }
  .fig b { font-size: 24px; }
  .live b { font-size: 22px; }
  .c-left .panel, .c-right .panel { gap: 3px; padding-top: 6px; padding-bottom: 6px; }
  .c-left, .c-right { gap: 6px; }
}

/* iniş sekansı: paneller sırayla açılır */
#cockpit[data-boot="seq"] [data-boot] { opacity: 0; transform: translateY(6px); pointer-events: none; }
#cockpit[data-boot="seq"] [data-boot].on { opacity: 1; transform: none; transition: opacity 0.35s ease, transform 0.35s ease; }
#cockpit[data-boot="seq"] .top-ctl, #cockpit[data-boot="seq"] .view-tools, #cockpit[data-boot="seq"] #btnBack { visibility: hidden; }

/* sade mod */
/* sade mod: gökyüzü radarı, olay akışı ve paneller kalır; ayar kaydırıcıları ve uzman satırları gizlenir, etiketler sadeleşir */
#cockpit[data-simple="true"] .whatif, #cockpit[data-simple="true"] .geo, #cockpit[data-simple="true"] #sumEnergy,
#cockpit[data-simple="true"] #heightRow, #cockpit[data-simple="true"] #sumHeight, #cockpit[data-simple="true"] .answers,
#cockpit[data-simple="true"] #btnLanding, #cockpit[data-simple="true"] .compare, #cockpit[data-simple="true"] #pwMeter,
#cockpit[data-simple="true"] .l-batt, #cockpit[data-simple="true"] .l-land { display: none; }
#cockpit[data-simple="true"] .view-tools { margin-top: 0; }
#cockpit[data-simple="true"] .simple-trio b { font-size: clamp(40px, 4.6vw, 72px); }

/* veri penceresi */
.dlg { width: min(680px, calc(100% - 32px)); max-height: min(86%, 760px); padding: 0; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.dlg::backdrop { background: rgba(0, 0, 0, 0.7); }
.dlg .p-head { padding: 12px 16px; border-bottom: 1px solid var(--rule); align-items: center; }
.dlg-body { padding: 14px 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.dlg-body h4 { font-family: var(--f-hud); font-weight: 600; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; margin: 6px 0 0; color: var(--ink-2); }
.dlg-body ul { display: flex; flex-direction: column; gap: 6px; padding-left: 16px; list-style: square; color: var(--ink); }
.dlg-body .status { color: var(--caution); display: flex; gap: 8px; }

/* ---------- dar ekranlar ---------- */
@media (max-width: 1180px) {
  #cockpit { grid-template-columns: 280px minmax(0, 1fr) 296px; }
  .ans small { display: none; }
  .readout .big b { font-size: 44px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  .b-body { grid-template-columns: minmax(0, 1fr); }
  .b-map { min-height: 0; aspect-ratio: 1; max-height: 70vh; }
  .cards { overflow: visible; flex: none; }
  .brand h1 { font-size: 30px; }
  .cards-head { display: none; }
  .card { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 7px; }
  .card .rank { display: none; }
  .card .code { grid-column: 1; }
  .card .nm { grid-column: 2 / -1; }
  .card .subline { grid-column: 1; }
  .ministrip { grid-column: 2 / -1; }
  .cand { min-width: 30px; height: 30px; }
  .map-legend { font-size: 11px; bottom: 8px; }
  .map-legend:not([hidden]) ~ .map-note { display: none; } /* dar ekranda ikisi üst üste binmesin */

  #cockpit { display: flex; flex-direction: column; overflow-y: auto; }
  #cockpit > * { flex: none; } /* küçülmesinler: içerik bir sonraki panelin üstüne taşmasın */
  .c-left .panel, .c-right .panel { flex: none; }
  .viewport { position: relative; inset: auto; flex: none; height: 46vh; min-height: 260px; order: 2; margin: 0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l)); }
  .c-top { order: 1; }
  .c-mid { order: 3; }
  .c-time { order: 4; }
  .c-left { order: 5; overflow: visible; }
  .c-right { order: 6; }
  .clock { margin-left: 0; }
  .descent { position: relative; inset: auto; }
  .descent .d-alt b { font-size: 44px; }
  #pEvents { flex: none; max-height: 320px; }
  .simple-trio { grid-template-columns: 1fr; }
  .t-strips { grid-template-columns: minmax(0, 1fr); }
  .t-labels { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- ortak: tarih alanı, seçim kutusu, onay kutusu ---------- */
.datefield { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.datefield small { font-family: var(--f-data); font-size: 10.5px; color: var(--ink-3); }
input[type="datetime-local"], input[type="number"], .sel {
  font-family: var(--f-data); font-size: 12.5px; height: 28px; padding: 0 6px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--rule-2); border-radius: 0; color-scheme: dark;
}
input[type="datetime-local"]:hover, input[type="number"]:hover, .sel:hover { border-color: var(--line); }
.sel { height: 34px; font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.06em; cursor: pointer; }
.sel-sm { height: 24px; font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--line); margin: 0; }
.x-l { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.launch-btns { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status-r { display: inline-flex; align-items: center; gap: 12px; }
.cmp-open.has { border-color: var(--line); }
.b-head .cmp-open { align-self: center; }
.t-ctl .x-l { margin-left: 6px; }

/* ---------- SAHNE 4: SENARYO KARŞILAŞTIRMA ---------- */
#cmpScene { display: flex; flex-direction: column; gap: 10px; padding: 12px var(--gut-r) 10px var(--gut-l); overflow-y: auto; background: var(--bg); }
#cmpScene[hidden] { display: none; }
.x-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.x-head h2 { font-family: var(--f-hud); font-weight: 600; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1; }
.x-ctl { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.x-sum { font-size: clamp(16px, 1.5vw, 21px); font-weight: 500; line-height: 1.3; text-wrap: balance; min-height: 1.3em; }
.x-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.x-col { padding: 11px 13px 12px; display: flex; flex-direction: column; gap: 9px; min-width: 0; cursor: pointer; }
.x-col:hover { border-color: var(--rule-2); }
.x-col.x-empty { cursor: default; border-style: dashed; background: none; color: var(--ink-2); min-height: 180px; justify-content: center; font-size: 14px; }
.x-ch { display: flex; align-items: flex-start; gap: 10px; }
.x-let { flex: none; width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--f-hud); font-weight: 700; font-size: 22px; background: var(--line); color: #0a0c0d; }
.x-id { min-width: 0; flex: 1; }
.x-id b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 20px; line-height: 1.05; letter-spacing: 0.05em; text-transform: uppercase; overflow-wrap: anywhere; }
.x-id small { display: block; font-family: var(--f-data); font-size: 11px; color: var(--ink-2); }
.x-rm { width: 28px; padding: 0; }
.x-when { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; cursor: default; }
.x-mask { font-size: 11.5px; color: var(--ink-3); }
.x-rows { display: flex; flex-direction: column; }
.x-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 0; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--ink-2); }
.x-row > span:first-child { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.x-row .ic { font-size: 12px; }
.x-row .x-v { display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.x-row b { font-family: var(--f-hud); font-weight: 600; font-size: 26px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.x-row.best b { color: var(--good); }
.x-row.best b::after { content: " ●"; font-size: 9px; vertical-align: 0.5em; }
.x-d { font-style: normal; font-family: var(--f-data); font-size: 11.5px; color: var(--ink-2); min-width: 4.6em; text-align: right; }
.x-land { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--rule); padding-top: 6px; font-size: 12px; color: var(--ink-2); }
.x-land .x-lh { font-family: var(--f-hud); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.x-land > div { display: flex; gap: 7px; align-items: flex-start; }
.x-land .ic { margin-top: 0.2em; }
.x-clip { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--caution); }
.x-strips { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; cursor: crosshair; }
.x-sl { display: grid; grid-template-rows: 15px 15px 15px; row-gap: 4px; font-size: 11px; align-items: center; }
.x-sl .ic.both, .x-row .ic.both { color: var(--both); }
.x-cv { width: 100%; height: 76px; }
.x-read { font-family: var(--f-data); font-size: 11px; line-height: 1.35; color: var(--ink); min-height: 2.7em; }
.x-read.hint { color: var(--ink-3); font-family: var(--f-body); }
.x-foot2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--rule-2); padding-top: 8px; cursor: default; }
.x-copy { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.x-copy input { width: 54px; }
.x-copy .btn { width: 28px; padding: 0; font-size: 17px; }
.x-foot { font-size: 11.5px; color: var(--ink-3); max-width: 150ch; }
.ic.both { color: var(--both); }
@media (max-width: 900px) {
  .x-cols { grid-template-columns: minmax(0, 1fr); }
  .x-ctl { margin-left: 0; }
  .t-track { height: 96px; }
}

/* tanıtım videosu (Blender, gerçek LOLA arazisi) */
.b-head .video-open { align-self: center; margin-left: auto; }
.b-head .video-open + .cmp-open { margin-left: 8px; }
.dlg-video { width: min(1100px, calc(100% - 32px)); max-height: none; }
.dlg-video video { display: block; width: 100%; background: #000; aspect-ratio: 16 / 9; }
.dlg-cap { margin: 0; padding: 10px 16px 14px; font-size: 13px; color: var(--ink-2); }

/* =====================================================================================================
   SAHNE 0: AÇILIŞ — DÖNEN AY (14 Kasım). Sahnede yalnız Ay ve dokuz bölge; bütün işlevler küçük ve kenarda.
   Aynı ölçü aleti dili: kırık beyaz ince çizgi, sıfır köşe, cam efekti yok. Renk yalnız anlam taşır.
   ===================================================================================================== */
#home { position: relative; overflow: hidden; background: var(--void); isolation: isolate; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#globe.dragging { cursor: grabbing; }
/* üst ve alt kenarda yumuşak karartma: parlak kutup haritası üstünde de yazılar okunsun */
#home::before, #home::after { content: ""; position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none; }
#home::before { top: 0; height: 110px; background: linear-gradient(180deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0)); }
#home::after { bottom: 0; height: 130px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0)); }
.h-nogl { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 46ch; text-align: center; color: var(--ink-2); }

/* küçük araç tuşları */
.hbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 11px;
  border: 1px solid var(--rule-2); background: rgba(5, 6, 7, 0.72); color: var(--ink-2); cursor: pointer;
  font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.09em; text-transform: uppercase; white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.hbtn:hover { color: var(--ink); border-color: var(--line); }
.hbtn[disabled] { opacity: 0.35; cursor: default; }
.hbtn-strong { color: var(--ink); border-color: var(--line); }
.hbtn-icon { width: 30px; padding: 0; font-size: 15px; }
.hbtn.has { color: var(--ink); }
.hsel { height: 30px; background: rgba(5, 6, 7, 0.72); }

.h-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 14px var(--gut-r) 0 var(--gut-l); pointer-events: none; z-index: 3; }
.h-top > * { pointer-events: auto; }
.h-brand { display: flex; align-items: center; gap: 11px; }
.h-brand .brand-mark { width: 34px; height: 34px; color: var(--line); }
.h-brand .eyebrow { font-size: 12px; letter-spacing: 0.18em; }
.h-brand h1 { font-family: var(--f-hud); font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; }
.h-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.h-view { position: absolute; right: var(--gut-r); top: 58px; display: flex; flex-direction: column; gap: 6px; z-index: 3; }

/* işaretler: bölgenin inilecek noktası (halka) ve kodu; kalabalıkta (uzaktan) yalnız nokta */
.g-marks { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.gm { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; pointer-events: auto; will-change: transform; }
.gm i { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border: 1.5px solid var(--line); border-radius: 50%; background: rgba(0, 0, 0, 0.35); transition: transform 0.15s; }
.gm i::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--ink); }
.gm span { position: absolute; top: -9px; white-space: nowrap; font-family: var(--f-hud); font-weight: 600; text-transform: uppercase; text-shadow: 0 0 5px #000, 0 0 2px #000, 0 0 1px #000; pointer-events: none; }
.gm .gm-code { left: 13px; font-size: 15px; letter-spacing: 0.06em; color: var(--ink); }
.gm .gm-name { left: 13px; top: 6px; font-size: 12.5px; letter-spacing: 0.08em; color: var(--ink-2); display: none; }
.gm.named .gm-name, .gm.on .gm-name, .gm:focus-visible .gm-name { display: block; }
.gm.on i, .gm:hover i, .gm:focus-visible i { transform: scale(1.35); border-color: var(--ink); }
.gm:focus-visible { outline: none; }
.gm:focus-visible i { outline: 2px solid var(--ink); outline-offset: 3px; }
.gm.hot i { border-color: var(--sun); box-shadow: 0 0 0 4px rgba(255, 178, 30, 0.18); }
.gm.hot .gm-code { color: var(--sun); }
#home[data-cluster="true"] .gm { pointer-events: none; }
#home[data-cluster="true"] .gm i { left: -3px; top: -3px; width: 6px; height: 6px; border-width: 1px; background: var(--ink); }
#home[data-cluster="true"] .gm i::after { display: none; }
#home[data-cluster="true"] .gm span { display: none; }

.g-cluster { position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; z-index: 2; }
.g-cluster i { position: absolute; left: -36px; top: -36px; width: 72px; height: 72px; border: 1px dashed var(--line); border-radius: 50%; animation: gspin 40s linear infinite; }
.g-cluster span { position: absolute; left: 46px; top: -11px; white-space: nowrap; font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 6px #000, 0 0 2px #000; padding-left: 22px; }
.g-cluster span::before { content: ""; position: absolute; left: 0; top: 50%; width: 16px; height: 1px; background: var(--line); }
.g-cluster:hover i { border-style: solid; }
.g-cluster:focus-visible { outline: none; }
.g-cluster:focus-visible i { outline: 2px solid var(--ink); outline-offset: 3px; }
@keyframes gspin { to { transform: rotate(360deg); } }

/* Güneş ve Dünya yönü: ekranın kenarında, o yöne bakan küçük ok */
.g-dir { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; font-family: var(--f-hud); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
.g-dir i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; }
.g-dir i::before { content: ""; position: absolute; inset: 0; background: currentColor; clip-path: polygon(100% 50%, 0 0, 28% 50%, 0 100%); }
.g-dir > span { position: absolute; left: 0; top: 12px; transform: translateX(-50%); display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; text-shadow: 0 0 5px #000; }
.g-sun { color: var(--sun); }
.g-earth { color: var(--earth); }

/* bölge ipucu */
.h-tip { position: absolute; left: 0; top: 0; z-index: 4; width: 300px; max-width: calc(100vw - 32px); padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 5px; pointer-events: none;
  border: 1px solid var(--rule-2); background: rgba(8, 10, 11, 0.94); }
.h-tip strong { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-hud); font-weight: 600; font-size: 20px; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.05; }
.h-tip .code { color: var(--ink-2); font-size: 15px; letter-spacing: 0.08em; }
.h-tip small { font-family: var(--f-data); font-size: 11px; color: var(--ink-2); }
.h-tip small.period { font-family: var(--f-body); color: var(--ink-3); }
.h-tip em { font-style: normal; font-family: var(--f-hud); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); border-top: 1px solid var(--rule); padding-top: 6px; }
.h-trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 4px 0 2px; }
.h-trio > span { display: grid; grid-template-columns: auto 1fr; column-gap: 5px; align-items: baseline; min-width: 0; }
.h-trio .ic { grid-row: 1; align-self: center; }
.h-trio b { font-family: var(--f-hud); font-weight: 600; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.h-trio small { grid-column: 1 / -1; font-family: var(--f-body); font-size: 10.5px; color: var(--ink-3); line-height: 1.2; }
.h-trio .sun b, .h-trio .sun .ic { color: var(--sun); }
.h-trio .earth b, .h-trio .earth .ic { color: var(--earth); }
.h-trio .dark .ic { color: var(--ink-2); }

/* bölge listesi (sağ alt; kapalı başlar) */
.h-regions { position: absolute; right: var(--gut-r); bottom: 16px; z-index: 3; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 6px; max-height: calc(100% - 120px); }
.h-reglist { width: min(430px, calc(100vw - 32px)); overflow-y: auto; border: 1px solid var(--rule-2); background: rgba(8, 10, 11, 0.95); padding: 4px 0; scrollbar-width: thin; }
.h-reg-head { padding: 4px 12px 6px; font-size: 11px; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
.h-reg { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) 190px; align-items: center; gap: 8px; padding: 6px 12px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.h-reg:hover, .h-reg:focus-visible { background: var(--panel-2); outline: none; }
.h-reg-code { font-family: var(--f-hud); font-weight: 700; font-size: 16px; color: var(--ink-2); }
.h-reg-name { font-family: var(--f-hud); font-weight: 600; font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-trio.mini { padding: 0; gap: 6px; }
.h-trio.mini b { font-size: 16px; }
.h-trio.mini small { display: none; }

/* alt şerit: iniş tarihi ve kürenin ışığı */
.h-foot { position: absolute; left: var(--gut-l); bottom: 16px; z-index: 3; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.h-date { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hchip { display: inline-flex; align-items: baseline; gap: 8px; height: 30px; padding: 0 11px; border: 1px solid var(--rule-2); background: rgba(5, 6, 7, 0.72); color: var(--ink); cursor: pointer; }
.hchip .ic { align-self: center; color: var(--ink-2); }
.hchip small { font-family: var(--f-hud); font-weight: 600; font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.hchip b { font-family: var(--f-data); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
.hchip:hover { border-color: var(--line); }
.h-datefield { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }
.h-datefield input { height: 30px; }
.h-light { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.h-light > span { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--rule); background: rgba(5, 6, 7, 0.72); }
.h-light small { font-family: var(--f-hud); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.h-light b { font-family: var(--f-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.h-hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; max-width: min(110ch, calc(100vw - 560px)); text-align: center;
  font-size: 12.5px; color: var(--ink-2); text-shadow: 0 0 6px #000; pointer-events: none; transition: opacity 0.8s; }
.h-hint.gone { opacity: 0; }

/* yaklaşma göstergesi */
.h-approach { position: absolute; left: var(--gut-l); bottom: 64px; z-index: 4; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; pointer-events: none; max-width: min(520px, calc(100vw - 32px)); }
.h-approach small { font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink-2); }
.h-approach > b { font-family: var(--f-hud); font-weight: 600; font-size: clamp(30px, 3.6vw, 52px); line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 0 10px #000; }
.h-approach > span { font-family: var(--f-data); font-size: 12px; color: var(--ink-2); text-shadow: 0 0 6px #000; }
.ha-alt { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule-2); }
.ha-alt strong { font-family: var(--f-hud); font-weight: 600; font-size: clamp(36px, 4.4vw, 64px); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px #000; }
#haCancel { pointer-events: auto; margin-top: 10px; }
.h-fade { position: absolute; inset: 0; z-index: 6; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
#home[data-mode="fade"] .h-fade { opacity: 1; }
#home[data-mode="approach"] .h-tools, #home[data-mode="approach"] .h-view, #home[data-mode="approach"] .h-regions,
#home[data-mode="approach"] .h-foot, #home[data-mode="approach"] .h-hint, #home[data-mode="approach"] .g-marks,
#home[data-mode="approach"] .g-cluster, #home[data-mode="approach"] .g-dir,
#home[data-mode="fade"] .h-top, #home[data-mode="fade"] .h-view, #home[data-mode="fade"] .h-regions, #home[data-mode="fade"] .h-foot { visibility: hidden; }

/* ---------- sunum modu ---------- */
.present { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.present::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, 0.9) 0, rgba(0, 0, 0, 0.78) 30%, rgba(0, 0, 0, 0.35) 50%, rgba(0, 0, 0, 0) 64%); }
.present::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0)); }
.pr-nav { z-index: 1; }
.pr-card { position: absolute; left: var(--gut-l); top: 50%; transform: translateY(-50%); width: min(600px, 46vw); display: flex; flex-direction: column; gap: 14px; pointer-events: auto; }
.present.in .pr-card > * { animation: prIn 0.6s ease both; }
.present.in .pr-card > :nth-child(2) { animation-delay: 0.06s; }
.present.in .pr-card > :nth-child(3) { animation-delay: 0.14s; }
.present.in .pr-card > :nth-child(4) { animation-delay: 0.24s; }
@keyframes prIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.pr-kick { font-family: var(--f-hud); font-weight: 600; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); }
.pr-title { font-family: var(--f-hud); font-weight: 600; font-size: clamp(42px, 4.8vw, 82px); line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 0 18px #000; }
.pr-line { font-size: clamp(16px, 1.35vw, 21px); line-height: 1.45; color: var(--ink); max-width: 46ch; text-wrap: pretty; text-shadow: 0 0 10px #000, 0 0 3px #000; }
.pr-figs { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end; }
.pr-figs:empty { display: none; }
.pr-fig { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pr-fig b { font-family: var(--f-hud); font-weight: 600; font-size: clamp(46px, 5vw, 88px); line-height: 0.92; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 14px #000; }
.pr-fig span { font-size: 13px; color: var(--ink-2); text-shadow: 0 0 6px #000; }
.pr-fig.sun b { color: var(--sun); }
.pr-fig.earth b { color: var(--earth); }
.pr-fig.both b { color: var(--both); }
.pr-fig.dim b { color: var(--ink-2); }
.pr-vs { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.pr-vs > div:not(.pr-arrow) { display: flex; flex-direction: column; gap: 8px; }
.pr-vs small, .pr-col small { font-family: var(--f-hud); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.pr-arrow { font-family: var(--f-hud); font-size: 40px; color: var(--ink-3); padding-bottom: 20px; }
.pr-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; width: 100%; }
.pr-col { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--rule-2); }
.pr-col em { font-style: normal; font-family: var(--f-data); font-size: 11px; color: var(--ink-3); }
.pr-col .pr-fig b { font-size: clamp(34px, 3.3vw, 58px); }
.pr-col.win { border-top-color: var(--both); }
.pr-col.win small { color: var(--both); }
.pr-wait { font-family: var(--f-hud); font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.pr-note { font-size: 11.5px; color: var(--ink-3); max-width: 60ch; }
.pr-nav { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.pr-dots { display: flex; gap: 6px; }
.pr-dots li { width: 18px; height: 2px; background: var(--rule-2); }
.pr-dots li.on { background: var(--ink); }
#home[data-present="on"] .h-tools, #home[data-present="on"] .h-view, #home[data-present="on"] .h-regions,

/* ---------- kokpit: büyük geri sayımlar (görev kontrol saati) ---------- */
.countdown { order: 0; display: flex; gap: 2px; pointer-events: none; }
.cd { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 16px 6px; background: rgba(5, 6, 7, 0.78); border: 1px solid var(--rule); min-width: 190px; }
.cd small { font-family: var(--f-hud); font-weight: 600; font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.cd b { font-family: var(--f-hud); font-weight: 600; font-size: clamp(26px, 2.5vw, 40px); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: 0.03em; }
.cd-sun[data-on="true"] b { color: var(--sun); }
.cd-earth[data-on="true"] b { color: var(--earth); }
.cd[data-on="false"] b { color: var(--ink-2); }
#cockpit[data-boot="seq"] .countdown, #cockpit[data-simple="true"] .countdown { visibility: hidden; }
#cockpit[data-hud="off"] .countdown { visibility: visible; }

/* ---------- kokpit: katlanır paneller ---------- */
.c-left .p-head h3[role="button"], .c-right .p-head h3[role="button"] { cursor: pointer; }
.c-left .p-head h3[role="button"]::after, .c-right .p-head h3[role="button"]::after {
  content: ""; width: 7px; height: 7px; margin-left: 2px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: translateY(-2px) rotate(45deg); transition: transform 0.15s; }
.panel[data-collapsed="true"] .p-head h3[role="button"]::after { transform: translateY(1px) rotate(-45deg); }
.panel[data-collapsed="true"] > :not(.p-head) { display: none !important; }
.panel[data-collapsed="true"] { flex: none !important; min-height: 0 !important; }
#cockpit[data-panels="min"] .c-left, #cockpit[data-panels="min"] .c-right { pointer-events: none; }
#cockpit[data-panels="min"] .c-left .panel, #cockpit[data-panels="min"] .c-right .panel { pointer-events: auto; }

/* ---------- Uzman ayarları: batarya, belirsizlik, Pareto ve ağırlıklar yalnız Uzman açıkken ---------- */
#app[data-expert="off"] .xp { display: none !important; }
#app[data-expert="off"] .cand.par { background: none; }
#app[data-expert="off"] .site-detail .tag { display: none; }
.xp-hint { font-size: 11px; color: var(--ink-3); }
#app[data-expert="on"] .xp-hint { display: none; }
#btnExpert[aria-pressed="true"], #btnPanels[aria-pressed="true"] { background: var(--line); color: #0a0c0d; border-color: var(--line); }
/* batarya kararı alarm gibi değil: durduğunda bile sakin bir dikkat satırı */
.verdict[data-s="dead"] { color: var(--caution); }
#pPower[data-state="dead"] { --c: var(--caution); border-color: var(--rule-2); }
#pPower[data-state="dead"] .big b { color: var(--caution); }

/* ---------- alt rozet: sarı uyarı şeridi yerine küçük bilgi tuşu ---------- */
.statusbar { min-height: 22px; padding-top: 2px; padding-bottom: 2px; background: #030404; }
.prelim { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-3); font-size: 11.5px; }
.prelim:hover { color: var(--ink); }
#app[data-scene="home"] .statusbar { display: none; }

/* liste ekranından Ay'a dönüş */
.b-home { align-self: center; }

/* dönem etiketi: aynı adlı rakamların hangi döneme ait olduğu (· 2027, · ilk 30 gün) */
small.per { font-size: 0.86em; color: var(--ink-3); font-weight: 400; letter-spacing: 0; text-transform: none; }

t the region centre with slope under 8°. Neither the sample point nor the candidates are official landing sites.", "Region outlines were digitised from NASA's 28 October 2024 announcement image (about ±1 km); they are not USGS's official polygons.", "Candidates were screened only by slope and our illumination/communication model. Rocks, small craters, landing ellipse and temperature are not considered. Terrain is at 80 m resolution; smaller obstacles do not appear in the horizon.", "Battery capacity, panel power and load are example values, not data of a real vehicle.", "Earth's cloud and land pattern in the 3D scene is illustrative. The lander model is symbolic.", "3D shadows only know the 20×20 km terrain tile. Whether the point is lit always comes from the computed data.", "The lander's shadow on the ground is illustrative; terrain shadows are computed from real elevation data.", "Only points with a full data package (the sample point and the top 5 candidates per region, 54 points) have hourly series; only those can be compared or opened in the cockpit.", "For observer heights other than 2 m, the visible fraction of the Sun is recomputed in the browser from the same hourly positions with a constant solar radius of 0.267°.", "The 3D scene always draws the 2 m observer's horizon profile; the observer-height choice changes the numbers, the sky radar, the panorama and the strips."], "sourcesTitle": "Sources", "sources": ["Elevation: NASA LRO/LOLA, Barker et al. 2023, PSJ 4:183, NASA PGDA product 90.", "Regions: NASA, 28 October 2024 Artemis III announcement (digitised from the image); official polygons: McClernan 2024, USGS, doi:10.5066/P1MEQ6UK.", "Heat map and validation: NASA PGDA product 69, LOLA average Sun and Earth visibility maps (AVGVISIB_75S_120M_201608), Mazarico et al. 2011.", "Sun and Earth: NASA/JPL NAIF SPICE, DE440 (de440s.bsp) and lunar orientation (moon_pa_de440_200625.bpc), in the same frame as LOLA, MOON_ME_DE440_ME421.", "Inspiration: NASA SVS 5228, Lunar South Pole Illumination with Earth and Sun."], "keysTitle": "Keyboard"}, "ans": {"cap": "Smallest battery that survives", "capNone": "600 kWh is not enough", "land": "Safe landing window", "landAll": "any day", "landFrom": "{d} and later", "capTitle": "The smallest capacity that survives to the end of the data ({end}) with the selected landing day, panel power and load (example values). Click: set the capacity to this.", "landTitle": "The earliest day on which a vehicle landing with a full battery survives to the end of the data ({end}) with these battery settings. Click: set the landing day to this."}, "tip": {"sun": "solar disc {v}", "link": "link up", "noLink": "no link", "life": "a vehicle landing this day lasts {d}", "lifeOpen": "a vehicle landing this day survives to the end of the data"}, "tour": {"start": "Auto tour", "stop": "Stop tour", "step": "{i} / {n}", "s1": "{name}. Terrain from NASA LOLA data, to scale. The Sun stays only a few degrees above the horizon; shadows sweep across the ground.", "s2": "Astronaut view. The Sun does not rise, it grazes the horizon. The panel gets as much power as the visible part of the disc.", "s3": "Earth does not set, it sways in place; the faint trace is its path over the data. With this antenna mask there is a link {earth} of the time this year.", "s4dead": "Longest dark {dark}. An example {cap} kWh battery runs out on mission day {n}.", "s4alive": "Longest dark {dark}. An example {cap} kWh battery survives to the end of the data with these settings.", "s5": "A flat-horizon calculation finds {flat} sunlit time for {y}. With the real terrain horizon it is {real}.", "s6": "The real horizon makes the difference. Numbers are preliminary; see Data and sources for the comparison with NASA's maps."}, "cmp": {"add": "Add to comparison", "added": "Added as {k}", "open": "Compare ({n})", "title": "Scenario comparison", "window": "Window · after landing", "days": "{n} days", "diff": "Show difference to A", "clear": "Clea e": "Düz ufuk hesabı bu noktada güneşli zamanı {v} puan eksik sayıyor.", "noteLess": "Düz ufuk hesabı bu noktada güneşli zamanı {v} puan fazla sayıyor.", "noteAntenna": "Gerçek arazide 1° anten payıyla Dünya görünür: {v}.", "sceneNote": "Sahne şu an düz ufuk modelini gösteriyor: arazi düzleştirildi, uzak dağlar kaldırıldı."}, "simple": {"sun": "güneş alır", "earth": "Dünya'yı görür", "dark": "en uzun karanlık", "sentence": "Bu noktada araç zamanın {sun} güneş alır, {earth} Dünya'yı görür, ama bir kerede {dark} gün karanlıkta kalır.", "now": "Şu an", "nowLit": "araç güneş alıyor", "nowDark": "araç karanlıkta", "nowLink": "Dünya ile bağlantı var", "nowNoLink": "Dünya ile bağlantı yok", "flatTag": "Düz ufuk varsayımıyla"}, "data": {"title": "Veri ve kaynaklar", "close": "Kapat", "status": "Bütün rakamlar ön sonuçtur. NASA haritalarıyla karşılaştırma özeti bu veri paketinde yok (years.json).", "methodTitle": "Hesap", "method": ["Her nokta için 360° ufuk profili (0,25° adım), NASA LOLA güney kutbu yükseklik haritasından (80 m/piksel, 300 km uzağa kadar) Ay'ın eğriliği dahil edilerek hesaplandı.", "Güneş ve Dünya konumları NASA/JPL SPICE ile saatlik bulundu. \"Güneşli zaman\", Güneş diskinin herhangi bir kısmının göründüğü zamanın yüzdesidir. \"Güneş enerjisi oranı\" diskin görünen oranının ortalamasıdır: yarısı ufkun üstündeyse %50 güç sayılır.", "Brifingdeki kart rakamları 2026–2028 dönemini kapsar. Kokpitteki bütün rakamlar (özet, iletişim, düz ufuk karşılaştırması) seçili yılın tarayıcıda yapılan canlı hesabıdır; karşılaştırma ekranı inişten sonraki pencereyi hesaplar. Aynı panelde iki dönem yan yana gösterilmez.", "Dünya görünürlüğü disk merkezine göre hesaplanır: Dünya'nın merkezi arazi ufkunun anten payı kadar üstündeyse bağlantı var sayılır. Dünya diskinin (yarıçap ≈ 0,95°) kısmen görünmesi bağlantı sayılmaz.", "Düz ufuk karşılaştırması aynı Güneş/Dünya geometrisini kullanır, yalnızca ufku 0° sayar.", "Belirsizlik altında batarya: tüketim ve panel gücü birbirinden bağımsız, seçilen ± oranında düzgün dağılımlı sayılır ve 2027 için 1000 kez denenir. Olasılık, dolu bataryayla seçili günde inen aracın yıl sonuna kadar dayandığı denemelerin oranıdır. Dağılım bir varsayımdır."], "candTitle": "Aday noktalar", "cand": ["Tarama: her bölge poligonunun içinde 800 m aralıklı ızgara (büyük bölgelerde en çok ~1000 nokta) kuruldu ve eğimi 8°'den az noktalar alındı (80 m veride). Her nokta için 2027 yılının Güneş enerjisi ve Dünya yüzdesi bizim modelle hesaplandı; tarama puanı ikisinin ortalamasıdır. Aralarında en az 1 km kalacak şekilde en iyi 20 nokta aday seçildi.", "Ayrıntı: 20 aday bizim modelle (2 m, 2026–2028) yeniden hesaplandı ve dengeli puana göre sıralandı; aday numarası bu sıradır. En iyi 5 adayın ve örnek noktanın tam iniş paketi var; diğer adayların yalnız rakamları gösterilir.", "Her kart tek bir noktanın rakamlarını gösterir: bölgenin 1. adayı ya da, \"Dengeli\" sıralamada, seçilen ağırlıklarla en yüksek puanlı nokta.", "İniş hatası: iniş paketi olan her nokta için aynı hesap, hedefin 100 m ve 300 m çevresinde sekizer yönde yinelendi. Gösterilen, halkada eğimi 8°'den az (inilebilir) noktalar arasındaki en kötü üç rakam ve eğimi 8°'yi aşan yön sayısıdır. 100 m bir varsayımdır, doğrulanmış bir NASA gereksinimi değil. Haritada \"Noktaya yaklaş\" halkaları gösterir; çarpı, eğim sınırını aşan yöndür.", "Pareto işareti: bölgedeki 21 nokta içinde, üç ölçüde birden daha iyi başka bir nokta bulunmayanlar. \"Dengeli\" sıralamada ağırlıklar değiştirilebilir; ağırlıklar eşitken puan öncekiyle aynıdır.", "Isı haritası NASA'nın Güneş haritasıdır, bizim hesabımız değil: yüzeydeki (0 m) bir gözlemci için diskin herhangi bir kısmının göründüğü zaman oranı, yaklaşık 18,6 yıllık ortalama.", "Kullanılan NASA haritası 75° G'den kutba 120 m çözünürlüktedir (AVGVISIB_75S_120M_201608)."], "limitsTitle": "Sınırlar", "limits": ["Örnek nokta: bölge merkezine en yakın, eğimi 8°'den az tarama noktası. Ne örnek nokta ne adaylar resmi iniş noktasıdır.", "
